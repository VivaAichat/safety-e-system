<html lang="zh-TW">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety E-System</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<style>
:root {
  --bg:#07090f;--surface:#0f1219;--card:#141922;--border:#1e2738;--borderHi:#2a3548;
  --amber:#f59e0b;--amberBg:rgba(245,158,11,0.12);--red:#ef4444;--redBg:rgba(239,68,68,0.1);
  --green:#10b981;--greenBg:rgba(16,185,129,0.1);--blue:#3b82f6;--blueBg:rgba(59,130,246,0.1);
  --purple:#8b5cf6;--cyan:#06b6d4;--text:#e8edf5;--textSec:#8b95a8;--textMut:#5a6478;
  --font:'DM Sans','Noto Sans TC',sans-serif;--mono:'JetBrains Mono','Fira Code',monospace;
  --shadow:0 4px 20px rgba(0,0,0,0.5);--radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:var(--font);transition:all .2s}
button:hover:not(:disabled){filter:brightness(1.15)}
input:focus,select:focus,textarea:focus{border-color:var(--amber)!important;box-shadow:0 0 0 2px var(--amberBg);outline:none}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
[contenteditable]:empty:before{content:attr(data-placeholder);color:var(--textMut)}
a{color:var(--amber);text-decoration:none}

/* SIDEBAR */
.sidebar{width:230px;min-height:100vh;background:linear-gradient(180deg,#0b0e16,#111622);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;z-index:100;flex-shrink:0;transition:width .3s;overflow:hidden}
.sidebar.collapsed{width:56px}
.sidebar-logo{padding:18px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10}
.sidebar.collapsed .sidebar-logo{padding:18px 10px}
.logo-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.logo-text{overflow:hidden;white-space:nowrap}
.sidebar.collapsed .logo-text,.sidebar.collapsed .nav-label,.sidebar.collapsed .admin-label{display:none}
.sidebar nav{flex:1;padding:10px 6px}
.nav-btn{display:flex;align-items:center;gap:10;width:100%;padding:9px 12px;background:transparent;border:none;border-radius:8px;color:var(--textSec);font-size:12px;font-weight:500;margin-bottom:1px}
.sidebar.collapsed .nav-btn{padding:9px 13px;justify-content:center}
.nav-btn.active{background:var(--amberBg);color:var(--amber);font-weight:700}
.sidebar-footer{padding:10px 6px;border-top:1px solid var(--border)}
.admin-btn{display:flex;align-items:center;gap:8;width:100%;padding:8px 12px;border:none;border-radius:8px;font-size:11px;font-weight:600}
.admin-btn.off{background:var(--border);color:var(--textSec)}
.admin-btn.on{background:var(--greenBg);color:var(--green)}
.toggle-btn{display:flex;align-items:center;justify-content:center;width:100%;padding:6px;margin-top:4px;background:transparent;border:none;color:var(--textMut);border-radius:6px}

/* MAIN */
.main{flex:1;min-width:0;padding:22px 26px;max-width:1440px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.header h1{font-size:20px;font-weight:800;letter-spacing:-.3px}
.header-sub{margin-top:3px;font-size:11px;color:var(--textMut)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px}
.page{animation:fi .3s ease}
.page[hidden]{display:none!important}

/* CARDS & STATS */
.grid{display:grid;gap:14px}.grid-4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid-3{grid-template-columns:repeat(3,1fr)}.grid-2{grid-template-columns:1fr 1fr}
.grid-6{grid-template-columns:repeat(6,1fr)}.grid-5{grid-template-columns:repeat(5,1fr)}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.card-head h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.card-body{padding:10px 16px;max-height:320px;overflow:auto}
.stat-card{display:flex;align-items:center;gap:14px;padding:16px 18px}
.stat-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.stat-label{font-size:10px;color:var(--textMut);font-weight:600;letter-spacing:.5px;margin-bottom:2px;text-transform:uppercase}
.stat-value{font-size:20px;font-weight:800;font-family:var(--mono)}
.stat-sub{font-size:10px;color:var(--textSec);margin-top:1px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;font-weight:600;border-radius:8px;font-size:13px;padding:8px 16px}
.btn-sm{font-size:12px;padding:5px 10px}
.btn-pri{background:linear-gradient(135deg,#f59e0b,#d97706);color:#000}
.btn-def{background:var(--border);color:var(--text)}
.btn-ghost{background:transparent;color:var(--textSec)}
.btn-danger{background:var(--redBg);color:var(--red)}
.btn-success{background:var(--greenBg);color:var(--green)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* INPUTS */
.inp,.sel,.txa{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:var(--font);outline:none}
.txa{min-height:70px;resize:vertical}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:5px;font-size:11px;font-weight:600;color:var(--textSec);letter-spacing:.5px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);backdrop-filter:blur(6px)}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:16px;border:1px solid var(--border);width:92%;max-width:540px;max-height:88vh;overflow:auto;box-shadow:var(--shadow);animation:fi .25s ease}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15px;font-weight:700}
.modal-body{padding:20px}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{padding:10px 12px;text-align:left;color:var(--textMut);font-weight:600;font-size:10px;white-space:nowrap;border-bottom:2px solid var(--border)}
.tbl td{padding:8px 12px;border-bottom:1px solid rgba(30,39,56,.3)}
.tbl tr:hover{background:rgba(255,255,255,.02)}

/* RICH EDITOR */
.rich-editor{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.rich-toolbar{display:flex;gap:2px;padding:4px 8px;background:var(--bg);border-bottom:1px solid var(--border)}
.rich-toolbar button{background:none;border:none;color:var(--textSec);padding:2px 6px;border-radius:4px;font-size:13px}
.rich-content{padding:9px 12px;min-height:60px;color:var(--text);font-size:13px;outline:none;background:var(--bg)}

/* FILTER BAR */
.filter-bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 20px;margin-bottom:20px}
.filter-bar label{font-size:11px;color:var(--textSec)}
.filter-bar input[type=date]{width:150px;padding:6px 10px;font-size:12px}
.pill-btn{padding:6px 16px;border-radius:20px;border:none;font-size:12px;font-weight:600;font-family:var(--font)}

/* SCHEDULE */
.sched-table{border-collapse:collapse;font-size:11px;min-width:800px}
.sched-table th{padding:5px 3px;text-align:center;font-size:9px;font-weight:600;color:var(--textMut)}
.sched-table td{padding:1px;text-align:center}
.sched-cell{width:24px;height:20px;border-radius:3px;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:8px;font-weight:700;color:white}
.sched-select{width:24px;height:20px;border:none;border-radius:3px;font-size:8px;font-weight:700;color:white;cursor:pointer;text-align:center;padding:0}
.sched-name{padding:5px 10px!important;font-weight:600;font-size:11px;text-align:left!important;position:sticky;left:0;background:var(--card);z-index:1}
.sched-name-head{min-width:75px;text-align:left!important;position:sticky;left:0;background:var(--card);z-index:2}

/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;z-index:99999;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:var(--shadow);animation:fi .25s ease;display:none}
.toast.show{display:block}
.toast.success{background:#064e3b;border:1px solid rgba(16,185,129,.2)}
.toast.error{background:#7f1d1d;border:1px solid rgba(239,68,68,.2)}

/* GAUGE */
.gauge-wrap{text-align:center}
.gauge-label{font-size:12px;font-weight:700;margin-top:4px}

/* Responsive */
@media(max-width:1200px){.grid-6{grid-template-columns:repeat(3,1fr)}.grid-5{grid-template-columns:repeat(3,1fr)}.grid-3{grid-template-columns:1fr 1fr}}
@media(max-width:768px){.sidebar{position:fixed;z-index:200}.sidebar.collapsed{width:0;border:none}.main{padding:14px}.grid-2,.grid-3{grid-template-columns:1fr}.grid-6,.grid-5{grid-template-columns:repeat(2,1fr)}.header{flex-direction:column;align-items:flex-start;gap:8px}}
</style>
</head>

function autoSeverity(desc,cat){
  const s=(desc+" "+cat).toLowerCase();
  if(SEV_KW.critical.some(k=>s.includes(k)))return"critical";
  if(SEV_KW.major.some(k=>s.includes(k)))return"major";
  if(SEV_KW.minor.some(k=>s.includes(k)))return"minor";
  return"major";
}
function badge(text,color){return `<span class="badge" style="color:${color};background:${color}20">${text}</span>`}
function saveState(){try{localStorage.setItem('safety_es',JSON.stringify(state))}catch{}}
function loadState(){try{const s=localStorage.getItem('safety_es');if(s){const d=JSON.parse(s);Object.assign(state,d);state.def.forEach(x=>{if(!x.severity)x.severity=autoSeverity(x.description,x.category)})}}catch{}}
function toast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;setTimeout(()=>t.classList.remove('show'),2800)}
function openModal(id){document.getElementById(id).classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function showGenModal(title,html,w){const m=document.getElementById('genModalBox');m.style.maxWidth=(w||540)+'px';document.getElementById('genModalTitle').textContent=title;document.getElementById('genModalBody').innerHTML=html;openModal('genModal')}
function today(){return new Date().toISOString().slice(0,10)}
function isOverdue(d){return d.status!=='closed'&&new Date(d.dueDate)<new Date()}
function optionsHtml(arr,blank){return (blank?'<option value="">--選擇--</option>':'')+arr.map(a=>`<option value="${a}">${a}</option>`).join('')}

// NAVIGATION
// ═══════════════════════════════════════════════════════════════
function buildNav(){
  document.getElementById('navContainer').innerHTML=NAV.map(n=>
    `<button class="nav-btn${n.id===currentPage?' active':''}" onclick="goPage('${n.id}')">${n.icon} <span class="nav-label">${n.label}</span></button>`
  ).join('');
}
function goPage(id){
  currentPage=id;
  NAV.forEach(n=>{const el=document.getElementById('page-'+n.id);if(el)el.hidden=n.id!==id});
  document.getElementById('pageTitle').textContent=NAV.find(n=>n.id===id)?.label||'';
  buildNav();
  renderPage(id);
}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('collapsed')}
function toggleAdmin(){
  if(isAdmin){isAdmin=false;updateAdminUI();toast('已登出');renderPage(currentPage);return}
  openModal('loginModal');
}
function doLogin(){
  const u=document.getElementById('loginUser').value,p=document.getElementById('loginPass').value;
  if(u==='123'&&p==='123'){isAdmin=true;closeModal('loginModal');updateAdminUI();toast('管理員模式已啟用 ✓');renderPage(currentPage)}
  else{const e=document.getElementById('loginErr');e.textContent='帳號或密碼錯誤';e.style.display='block'}
}
function updateAdminUI(){
  const btn=document.getElementById('adminBtn');
  btn.className='admin-btn '+(isAdmin?'on':'off');
  btn.innerHTML=isAdmin?'🔓 <span class="admin-label">管理員 ON</span>':'🔒 <span class="admin-label">管理員登入</span>';
  document.getElementById('adminBadge').style.display=isAdmin?'block':'none';
}

function statCard(icon,label,value,sub,color){
  return `<div class="card stat-card"><div class="stat-icon" style="background:${color}15;color:${color}">${icon}</div><div><div class="stat-label">${label}</div><div class="stat-value">${value}</div>${sub?`<div class="stat-sub">${sub}</div>`:''}</div></div>`;
}
function gaugeCard(label,value,max,color){
  const pct=Math.min(value/max,1);const r=40;const c=2*Math.PI*r;const d=pct*c*.75;
  return `<div class="card" style="padding:14px;text-align:center"><svg width="100" height="70" viewBox="0 0 100 70">
    <circle cx="50" cy="55" r="${r}" fill="none" stroke="var(--border)" stroke-width="7" stroke-dasharray="${c*.75} ${c*.25}" stroke-linecap="round" transform="rotate(135 50 55)"/>
    <circle cx="50" cy="55" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-dasharray="${d} ${c}" stroke-linecap="round" transform="rotate(135 50 55)"/>
    <text x="50" y="48" text-anchor="middle" fill="var(--text)" style="font-size:16px;font-weight:700;font-family:var(--mono)">${max>10?value.toFixed(1):value.toFixed(2)}</text>
    <text x="50" y="62" text-anchor="middle" fill="var(--textMut)" style="font-size:8px">${max>10?'%':''}</text>
  </svg><div class="gauge-label">${label}</div></div>`;
}

  if(activeTool==='gas-url'){el.innerHTML=`<button class="btn btn-ghost" onclick="activeTool=null;renderTools()">← 返回</button>
    <div class="card" style="padding:22px;margin-top:14px;max-width:550px"><h3 style="margin-bottom:6px;font-size:15px;font-weight:700">🔗 GAS URL 設定</h3>
    <p style="font-size:11px;color:var(--textMut);margin-bottom:14px">連接Google Apps Script</p>
    <div class="field"><label>URL</label><input class="inp" id="gasUrlInp" placeholder="https://script.google.com/macros/s/..."></div>
    <button class="btn btn-pri" onclick="localStorage.setItem('gasUrl',document.getElementById('gasUrlInp').value);toast('已儲存')">儲存</button></div>`;return}
  // custom tool
  const ct=state.tools.find(t=>t.id===activeTool&&t.type==='custom');
  if(ct){el.innerHTML=`<button class="btn btn-ghost" onclick="activeTool=null;renderTools()">← 返回</button>
    <div class="card" style="margin-top:14px;overflow:hidden"><div style="padding:12px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px">${ct.name}</div>
    ${ct.htmlContent?`<iframe srcdoc="${ct.htmlContent.replace(/"/g,'&quot;')}" style="width:100%;height:600px;border:none" sandbox="allow-scripts allow-forms"></iframe>`:'<div style="padding:40px;text-align:center;color:var(--textMut)">尚未上傳HTML</div>'}</div>`;return}

  el.innerHTML=`${isAdmin?'<div style="display:flex;justify-content:flex-end;margin-bottom:14px"><button class="btn btn-pri" onclick="addTool()">+ 新增工具</button></div>':''}
    <div class="grid grid-3">${state.tools.map(t=>`
      <div class="card" style="padding:18px;cursor:pointer;position:relative" onclick="activeTool='${t.id}';renderTools()">
        <div style="display:flex;align-items:flex-start;gap:14px">
          <div style="width:42px;height:42px;border-radius:10px;background:${t.color||'var(--amber)'}15;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${t.icon||'🔧'}</div>
          <div><div style="font-size:13px;font-weight:700;margin-bottom:3px">${t.name}</div><div style="font-size:11px;color:var(--textMut)">${t.desc}</div></div>
        </div>
        ${isAdmin&&t.type==='custom'?`<button class="btn-ghost btn-sm" style="position:absolute;top:8px;right:8px" onclick="event.stopPropagation();delTool('${t.id}')">🗑</button>`:''}
      </div>`).join('')}</div>`;
}
function calcSling(){
  const load=+document.getElementById('sLoad').value,angle=+document.getElementById('sAngle').value,legs=+document.getElementById('sLegs').value;
  const f=1/Math.cos((angle/2)*Math.PI/180),tpl=(load/legs)*f;
  document.getElementById('slingResult').innerHTML=[{l:"放大係數",v:f.toFixed(3)+'×',c:'var(--amber)'},{l:"每條張力",v:tpl.toFixed(0)+'kg',c:'var(--blue)'},{l:"建議WLL",v:(tpl*2).toFixed(0)+'kg',c:'var(--green)'}].map(x=>`<div style="background:var(--bg);border-radius:8px;padding:14px;text-align:center"><div style="font-size:10px;color:var(--textMut);margin-bottom:4px">${x.l}</div><div style="font-size:20px;font-weight:800;color:${x.c};font-family:var(--mono)">${x.v}</div></div>`).join('');
  document.getElementById('slingWarn').innerHTML=angle>120?'<div style="margin-top:14px;padding:10px;background:var(--redBg);border-radius:8px;color:var(--red);font-size:11px;font-weight:600">⚠️ 夾角超過120°！</div>':'';
}

// ─── TRACKING ────────────────────────────────────────────────
function renderTracking(){
  const cycle={pending:'in-progress','in-progress':'done',done:'pending'};
  const el=document.getElementById('page-tracking');
  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:12px;color:var(--textSec)">共 ${state.trk.length} 項 · 待辦 ${state.trk.filter(t=>t.status==='pending').length} · 進行中 ${state.trk.filter(t=>t.status==='in-progress').length} · 完成 ${state.trk.filter(t=>t.status==='done').length}</div>
      ${isAdmin?'<button class="btn btn-pri" onclick="addTracking()">+ 新增</button>':''}
    </div>
    ${state.trk.map(t=>{const od=t.status!=='done'&&new Date(t.deadline)<new Date();return`
      <div class="card" style="padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;border-left:3px solid ${t.status==='done'?'var(--green)':t.status==='in-progress'?'var(--blue)':'var(--amber)'}">
        <div style="flex:1"><div style="font-size:13px;font-weight:600;margin-bottom:3px;text-decoration:${t.status==='done'?'line-through':'none'};opacity:${t.status==='done'?.6:1}">${t.item}</div>
          <div style="font-size:10px;color:var(--textMut);display:flex;gap:10px;flex-wrap:wrap"><span>👤 ${(t.assignees||[]).join(', ')}</span><span style="color:${od?'var(--red)':'var(--textMut)'}">📅 ${t.deadline}${od?' ⚠️':''}</span>${badge(t.priority==='high'?'高':t.priority==='medium'?'中':'低',t.priority==='high'?'var(--red)':t.priority==='medium'?'var(--amber)':'var(--green)')}</div>
          ${t.note?`<div style="font-size:11px;color:var(--textSec);margin-top:4px">${t.note}</div>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          ${isAdmin?`<button class="btn btn-sm ${t.status==='done'?'btn-success':'btn-def'}" onclick="cycleTrack(${t.id})">${t.status==='done'?'✅':t.status==='in-progress'?'🔄':'⏳'}</button><button class="btn btn-danger btn-sm" onclick="delTrack(${t.id})">🗑</button>`
          :badge(t.status==='done'?'✅ 完成':t.status==='in-progress'?'🔄 進行中':'⏳ 待辦',t.status==='done'?'var(--green)':t.status==='in-progress'?'var(--blue)':'var(--amber)')}
        </div>
      </div>`}).join('')}`;
}

// ─── SCHEDULE ────────────────────────────────────────────────
function renderSchedule(){
  const sc=state.schedule;const year=parseInt(sc.month.split('-')[0]),mon=parseInt(sc.month.split('-')[1]);
  const dim=new Date(year,mon,0).getDate();const pp=sc.people||[];
  const el=document.getElementById('page-schedule');
  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:10px">
        <input type="month" class="inp" value="${sc.month}" onchange="state.schedule.month=this.value;saveState();renderSchedule()" style="width:160px;padding:6px 10px">
        <div style="display:flex;gap:6px">${Object.entries(SCHED_LABEL).map(([k,v])=>`<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--textSec)"><span style="width:12px;height:12px;border-radius:3px;background:${SCHED_COLOR[k]};display:inline-block"></span>${v}</span>`).join('')}</div>
      </div>
      ${isAdmin?'<button class="btn btn-pri" onclick="addSchedulePerson()">+ 新增人員</button>':''}
    </div>
    <div class="card" style="overflow:auto"><table class="sched-table">
      <thead><tr><th class="sched-name-head" style="padding:8px 10px">人員</th>
        ${Array.from({length:dim},(_,i)=>{const d=new Date(year,mon-1,i+1);const wd=d.getDay();return`<th style="color:${wd===0||wd===6?'var(--red)':'var(--textMut)'}">${i+1}<div style="font-size:7px">${'日一二三四五六'[wd]}</div></th>`}).join('')}
        ${isAdmin?'<th style="min-width:28px"></th>':''}
      </tr></thead>
      <tbody>${pp.map((p,pi)=>`<tr>
        <td class="sched-name">${p.name}</td>
        ${Array.from({length:dim},(_,di)=>{const val=p.days?.[di]||'R';return`<td>${isAdmin?`<select class="sched-select" style="background:${SCHED_COLOR[val]||'var(--border)'}" onchange="updateSchedCell(${pi},${di},this.value);this.style.background=SCHED_COLOR[this.value]">${Object.keys(SCHED_LABEL).map(k=>`<option value="${k}"${k===val?' selected':''}>${k}</option>`).join('')}</select>`:`<div class="sched-cell" style="background:${SCHED_COLOR[val]||'var(--border)'}">${val}</div>`}</td>`}).join('')}
        ${isAdmin?`<td><button class="btn-ghost btn-sm" onclick="delSchedPerson(${pi})">🗑</button></td>`:''}</tr>`).join('')}</tbody>
    </table></div>`;
}
function updateSchedCell(pi,di,val){state.schedule.people[pi].days[di]=val;saveState()}
function addSchedulePerson(){const name=prompt('輸入姓名');if(!name)return;state.schedule.people.push({name,days:Array.from({length:31},()=>'R')});saveState();renderSchedule();toast('已新增')}
function delSchedPerson(pi){state.schedule.people.splice(pi,1);saveState();renderSchedule();toast('已刪除')}

function addAnnouncement(){
  showGenModal('📢 新增公告',`
    <div class="field"><label>公告內容</label><div class="rich-editor"><div class="rich-toolbar">
      <button onmousedown="event.preventDefault();document.execCommand('bold')"><b>B</b></button>
      <button onmousedown="event.preventDefault();document.execCommand('italic')"><i>I</i></button>
      <button onmousedown="event.preventDefault();document.execCommand('underline')"><u>U</u></button>
      <button onmousedown="event.preventDefault();document.execCommand('insertUnorderedList')">•</button>
    </div><div contenteditable class="rich-content" id="annContent" data-placeholder="輸入公告內容..."></div></div></div>
    <div class="field"><label>優先度</label><select class="sel" id="annPri"><option value="high">🔴 重要</option><option value="medium" selected>🟡 一般</option></select></div>

}
function saveAnn(){

}
function delAnn(id){state.ann=state.ann.filter(a=>a.id!==id);saveState();renderPage(currentPage);toast('已刪除')}

function addTracking(){
  showGenModal('📋 新增追蹤事項',`
    <div class="field"><label>事項</label><input class="inp" id="trkItem" placeholder="事項內容..."></div>
    <div class="field"><label>負責人</label><div style="display:flex;flex-wrap:wrap;gap:4px" id="trkAssignees">${TEAM.map(p=>`<button class="pill-btn" style="background:transparent;border:1px solid var(--border);color:var(--textSec);font-size:11px" onclick="this.dataset.sel=this.dataset.sel==='1'?'':'1';this.style.background=this.dataset.sel==='1'?'var(--amberBg)':'transparent';this.style.color=this.dataset.sel==='1'?'var(--amber)':'var(--textSec)'" data-name="${p}">${p}</button>`).join('')}</div></div>
    <div class="field"><label>期限</label><input class="inp" type="date" id="trkDeadline"></div>
    <div class="field"><label>優先度</label><select class="sel" id="trkPri"><option value="high">🔴 高</option><option value="medium" selected>🟡 中</option><option value="low">🟢 低</option></select></div>
    <div class="field"><label>備註</label><div class="rich-editor"><div class="rich-toolbar"><button onmousedown="event.preventDefault();document.execCommand('bold')"><b>B</b></button><button onmousedown="event.preventDefault();document.execCommand('italic')"><i>I</i></button></div><div contenteditable class="rich-content" id="trkNote" data-placeholder="備註..."></div></div></div>
    <button class="btn btn-pri" style="width:100%;justify-content:center" onclick="saveTrk()">新增</button>`);
}
function saveTrk(){
  const item=document.getElementById('trkItem').value;if(!item)return;
  const assignees=[...document.querySelectorAll('#trkAssignees button[data-sel="1"]')].map(b=>b.dataset.name);
  state.trk.unshift({id:Date.now(),item,assignees,deadline:document.getElementById('trkDeadline').value,priority:document.getElementById('trkPri').value,status:'pending',note:document.getElementById('trkNote').innerHTML});
  saveState();closeModal('genModal');toast('已新增');renderPage(currentPage);
}
function cycleTrack(id){const c={pending:'in-progress','in-progress':'done',done:'pending'};const t=state.trk.find(x=>x.id===id);if(t)t.status=c[t.status];saveState();renderTracking();toast('已更新')}
function delTrack(id){state.trk=state.trk.filter(t=>t.id!==id);saveState();renderTracking();toast('已刪除')}

function addDeficiency(){
  showGenModal('⚠️ 新增TPC缺失單',`<div id="defFormArea"></div>`,600);
  setTimeout(()=>renderDefForm('defFormArea'),0);
}
function renderDefForm(containerId){
  document.getElementById(containerId).innerHTML=`
    <div class="grid grid-2" style="gap:12px">
      <div class="field"><label>發現日期</label><input class="inp" type="date" id="dfDate" value="${today()}"></div>
      <div class="field"><label>改善期限</label><input class="inp" type="date" id="dfDue"></div>
      <div class="field"><label>地點</label><select class="sel" id="dfLoc">${optionsHtml(LOCATIONS,true)}</select></div>

function previewSev(){
  const desc=document.getElementById('dfDesc').value,cat=document.getElementById('dfCat')?.value||'';
  if(desc&&cat){const s=autoSeverity(desc,cat);document.getElementById('sevPreview').innerHTML=badge(SEV_LABEL[s]+' (系統判定)',SEV_COLOR[s])}

function saveDef(){
  const date=document.getElementById('dfDate').value,due=document.getElementById('dfDue').value,loc=document.getElementById('dfLoc').value,con=document.getElementById('dfCon').value,cat=document.getElementById('dfCat').value,desc=document.getElementById('dfDesc').value;

  const no='TPC-2026-'+String(state.def.length+1).padStart(3,'0');
  state.def.unshift({id:Date.now(),no,date,location:loc,contractor:con,category:cat,description:desc,status:'open',dueDate:due,response:'',severity:autoSeverity(desc,cat)});
  saveState();closeModal('genModal');activeTool=null;toast('缺失單已建立');renderPage(currentPage);
}
function viewDef(id){
  const d=state.def.find(x=>x.id===id);if(!d)return;
  showGenModal('缺失單 '+d.no,`
    <div class="grid grid-2" style="gap:12px;margin-bottom:14px">
      ${[['編號',d.no,'var(--amber)'],['日期',d.date],['地點',d.location],['承包商',d.contractor],['類別',d.category]].map(([l,v,c])=>`<div><div style="font-size:10px;color:var(--textMut);margin-bottom:3px">${l}</div><div style="font-size:13px;${c?'font-weight:700;color:'+c+';font-family:var(--mono)':''}">${v}</div></div>`).join('')}
      <div><div style="font-size:10px;color:var(--textMut);margin-bottom:3px">嚴重度</div>${badge(SEV_LABEL[d.severity],SEV_COLOR[d.severity])}</div>
    </div>
    <div style="margin-bottom:14px"><div style="font-size:10px;color:var(--textMut);margin-bottom:3px">說明</div><div style="font-size:12px;line-height:1.6;padding:10px;background:var(--bg);border-radius:8px">${d.description}</div></div>
    <div style="margin-bottom:14px"><div style="font-size:10px;color:var(--textMut);margin-bottom:3px">期限</div><div style="font-size:13px;font-weight:600;color:${isOverdue(d)?'var(--red)':'var(--text)'}">${d.dueDate}${isOverdue(d)?' ⚠️ 逾期':''}</div></div>
    ${d.response?`<div style="margin-bottom:14px"><div style="font-size:10px;color:var(--textMut);margin-bottom:3px">改善回覆</div><div style="font-size:12px;padding:10px;background:var(--bg);border-radius:8px">${d.response}</div></div>`:''}
    ${isAdmin?`
      <div class="field"><label>狀態</label><select class="sel" id="vdStatus"><option value="open"${d.status==='open'?' selected':''}>待改善</option><option value="in-progress"${d.status==='in-progress'?' selected':''}>改善中</option><option value="closed"${d.status==='closed'?' selected':''}>已結案</option></select></div>
      <div class="field"><label>改善回覆</label><textarea class="txa" id="vdResponse">${d.response||''}</textarea></div>
      <button class="btn btn-pri" style="width:100%;justify-content:center" onclick="updateDef(${d.id})">更新</button>`:''}`,600);

function updateDef(id){
  const d=state.def.find(x=>x.id===id);if(!d)return;
  d.status=document.getElementById('vdStatus').value;d.response=document.getElementById('vdResponse').value;
  saveState();closeModal('genModal');toast('已更新');renderPage(currentPage);
}

function addDocSection(){showGenModal('新增分類區塊',`<div class="field"><label>區塊名稱</label><input class="inp" id="secName" placeholder="例: ISP 個別安全施工計畫"></div><button class="btn btn-pri" style="width:100%;justify-content:center" onclick="saveDocSec()">新增</button>`)}
function saveDocSec(){const n=document.getElementById('secName').value;if(!n)return;state.docs.push({sec:n,items:[]});saveState();closeModal('genModal');toast('已新增');renderDocuments()}
function addDocItem(si){showGenModal('新增文件',`

function delDoc(si,di){state.docs[si].items.splice(di,1);saveState();renderDocuments();toast('已刪除')}

function addTool(){showGenModal('新增工具',`
  <div class="field"><label>工具名稱</label><input class="inp" id="tlName" placeholder="名稱"></div>
  <div class="field"><label>說明</label><input class="inp" id="tlDesc" placeholder="描述"></div>

function saveTool(){const n=document.getElementById('tlName').value,d=document.getElementById('tlDesc').value,h=document.getElementById('tlFile').dataset?.content||'';if(!n)return;state.tools.push({id:Date.now().toString(),name:n,desc:d,icon:'🔧',color:'var(--cyan)',type:'custom',htmlContent:h});saveState();closeModal('genModal');toast('已新增');renderTools()}
function delTool(id){state.tools=state.tools.filter(t=>t.id!==id);saveState();renderTools();toast('已刪除')}
