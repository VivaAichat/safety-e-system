<style>
:root {
  --bg:#07090f;--surface:#0f1219;--card:#141922;--border:#1e2738;--borderHi:#2a3548;
  --amber:#f59e0b;--amberBg:rgba(245,158,11,0.12);--red:#ef4444;--redBg:rgba(239,68,68,0.1);
  --green:#10b981;--greenBg:rgba(16,185,129,0.1);--blue:#3b82f6;--blueBg:rgba(59,130,246,0.1);
  --purple:#8b5cf6;--cyan:#06b6d4;--text:#e8edf5;--textSec:#8b95a8;--textMut:#5a6478;
  --font:'DM Sans','Noto Sans TC',sans-serif;--mono:'JetBrains Mono','Fira Code',monospace;
  --shadow:0 4px 20px rgba(0,0,0,0.5);--radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:var(--font);transition:all .2s}
button:hover:not(:disabled){filter:brightness(1.15)}
input:focus,select:focus,textarea:focus{border-color:var(--amber)!important;box-shadow:0 0 0 2px var(--amberBg);outline:none}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
[contenteditable]:empty:before{content:attr(data-placeholder);color:var(--textMut)}
a{color:var(--amber);text-decoration:none}

/* SIDEBAR */
.sidebar{width:230px;min-height:100vh;background:linear-gradient(180deg,#0b0e16,#111622);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;z-index:100;flex-shrink:0;transition:width .3s;overflow:hidden}
.sidebar.collapsed{width:56px}
.sidebar-logo{padding:18px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10}
.sidebar.collapsed .sidebar-logo{padding:18px 10px}
.logo-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.logo-text{overflow:hidden;white-space:nowrap}
.sidebar.collapsed .logo-text,.sidebar.collapsed .nav-label,.sidebar.collapsed .admin-label{display:none}
.sidebar nav{flex:1;padding:10px 6px}
.nav-btn{display:flex;align-items:center;gap:10;width:100%;padding:9px 12px;background:transparent;border:none;border-radius:8px;color:var(--textSec);font-size:12px;font-weight:500;margin-bottom:1px}
.sidebar.collapsed .nav-btn{padding:9px 13px;justify-content:center}
.nav-btn.active{background:var(--amberBg);color:var(--amber);font-weight:700}
.sidebar-footer{padding:10px 6px;border-top:1px solid var(--border)}
.admin-btn{display:flex;align-items:center;gap:8;width:100%;padding:8px 12px;border:none;border-radius:8px;font-size:11px;font-weight:600}
.admin-btn.off{background:var(--border);color:var(--textSec)}
.admin-btn.on{background:var(--greenBg);color:var(--green)}
.toggle-btn{display:flex;align-items:center;justify-content:center;width:100%;padding:6px;margin-top:4px;background:transparent;border:none;color:var(--textMut);border-radius:6px}

/* MAIN */
.main{flex:1;min-width:0;padding:22px 26px;max-width:1440px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.header h1{font-size:20px;font-weight:800;letter-spacing:-.3px}
.header-sub{margin-top:3px;font-size:11px;color:var(--textMut)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px}
.page{animation:fi .3s ease}
.page[hidden]{display:none!important}

/* CARDS & STATS */
.grid{display:grid;gap:14px}.grid-4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid-3{grid-template-columns:repeat(3,1fr)}.grid-2{grid-template-columns:1fr 1fr}
.grid-6{grid-template-columns:repeat(6,1fr)}.grid-5{grid-template-columns:repeat(5,1fr)}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.card-head h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.card-body{padding:10px 16px;max-height:320px;overflow:auto}
.stat-card{display:flex;align-items:center;gap:14px;padding:16px 18px}
.stat-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.stat-label{font-size:10px;color:var(--textMut);font-weight:600;letter-spacing:.5px;margin-bottom:2px;text-transform:uppercase}
.stat-value{font-size:20px;font-weight:800;font-family:var(--mono)}
.stat-sub{font-size:10px;color:var(--textSec);margin-top:1px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;font-weight:600;border-radius:8px;font-size:13px;padding:8px 16px}
.btn-sm{font-size:12px;padding:5px 10px}
.btn-pri{background:linear-gradient(135deg,#f59e0b,#d97706);color:#000}
.btn-def{background:var(--border);color:var(--text)}
.btn-ghost{background:transparent;color:var(--textSec)}
.btn-danger{background:var(--redBg);color:var(--red)}
.btn-success{background:var(--greenBg);color:var(--green)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* INPUTS */
.inp,.sel,.txa{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:var(--font);outline:none}
.txa{min-height:70px;resize:vertical}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:5px;font-size:11px;font-weight:600;color:var(--textSec);letter-spacing:.5px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);backdrop-filter:blur(6px)}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:16px;border:1px solid var(--border);width:92%;max-width:540px;max-height:88vh;overflow:auto;box-shadow:var(--shadow);animation:fi .25s ease}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15px;font-weight:700}
.modal-body{padding:20px}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{padding:10px 12px;text-align:left;color:var(--textMut);font-weight:600;font-size:10px;white-space:nowrap;border-bottom:2px solid var(--border)}
.tbl td{padding:8px 12px;border-bottom:1px solid rgba(30,39,56,.3)}
.tbl tr:hover{background:rgba(255,255,255,.02)}

/* RICH EDITOR */
.rich-editor{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.rich-toolbar{display:flex;gap:2px;padding:4px 8px;background:var(--bg);border-bottom:1px solid var(--border)}
.rich-toolbar button{background:none;border:none;color:var(--textSec);padding:2px 6px;border-radius:4px;font-size:13px}
.rich-content{padding:9px 12px;min-height:60px;color:var(--text);font-size:13px;outline:none;background:var(--bg)}

/* FILTER BAR */
.filter-bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 20px;margin-bottom:20px}
.filter-bar label{font-size:11px;color:var(--textSec)}
.filter-bar input[type=date]{width:150px;padding:6px 10px;font-size:12px}
.pill-btn{padding:6px 16px;border-radius:20px;border:none;font-size:12px;font-weight:600;font-family:var(--font)}

/* SCHEDULE */
.sched-table{border-collapse:collapse;font-size:11px;min-width:800px}
.sched-table th{padding:5px 3px;text-align:center;font-size:9px;font-weight:600;color:var(--textMut)}
.sched-table td{padding:1px;text-align:center}
.sched-cell{width:24px;height:20px;border-radius:3px;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:8px;font-weight:700;color:white}
.sched-select{width:24px;height:20px;border:none;border-radius:3px;font-size:8px;font-weight:700;color:white;cursor:pointer;text-align:center;padding:0}
.sched-name{padding:5px 10px!important;font-weight:600;font-size:11px;text-align:left!important;position:sticky;left:0;background:var(--card);z-index:1}
.sched-name-head{min-width:75px;text-align:left!important;position:sticky;left:0;background:var(--card);z-index:2}

/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;z-index:99999;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:var(--shadow);animation:fi .25s ease;display:none}
.toast.show{display:block}
.toast.success{background:#064e3b;border:1px solid rgba(16,185,129,.2)}
.toast.error{background:#7f1d1d;border:1px solid rgba(239,68,68,.2)}

/* GAUGE */
.gauge-wrap{text-align:center}
.gauge-label{font-size:12px;font-weight:700;margin-top:4px}

/* LOADING */
.loading-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:16px}
.loading-bar .fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--green));animation:loadAni 1.5s ease infinite;width:40%;border-radius:2px}
@keyframes loadAni{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

/* Responsive */
@media(max-width:1200px){.grid-6{grid-template-columns:repeat(3,1fr)}.grid-5{grid-template-columns:repeat(3,1fr)}.grid-3{grid-template-columns:1fr 1fr}}
@media(max-width:768px){.sidebar{position:fixed;z-index:200}.sidebar.collapsed{width:0;border:none}.main{padding:14px}.grid-2,.grid-3{grid-template-columns:1fr}.grid-6,.grid-5{grid-template-columns:repeat(2,1fr)}.header{flex-direction:column;align-items:flex-start;gap:8px}}
</style>
</head>

<div class="modal-overlay" id="loginModal">

let _jsonpCounter = 0;
function loadSheetJsonp(sheetName) {
  return new Promise((resolve, reject) => {
    const cbName = '_gviz_cb_' + (++_jsonpCounter) + '_' + Date.now();
    const timeout = setTimeout(() => {
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      reject(new Error('JSONP timeout for ' + sheetName));
    }, 15000);

    window[cbName] = function(resp) {
      clearTimeout(timeout);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      resolve(resp);
    };

    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${cbName}&sheet=${encodeURIComponent(sheetName)}`;
    const script = document.createElement('script');
    script.src = url;
    script.onerror = () => {
      clearTimeout(timeout);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      reject(new Error('Script load error for ' + sheetName));
    };
    document.head.appendChild(script);
  });
}

// ── Parse GViz date value (handles "Date(y,m,d)" and Excel serial) ──
function parseGvizDate(val) {
  if (val === null || val === undefined) return '';
  // Helper: format local Date as YYYY-MM-DD
  const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  if (typeof val === 'string' && val.startsWith('Date(')) {
    const parts = val.replace('Date(','').replace(')','').split(',').map(Number);
    // Build date directly from Y/M/D components (no time, no UTC)
    const d = new Date(parts[0], parts[1], parts[2]||1);
    return fmt(d);
  }
  if (typeof val === 'number') {
    // Excel serial date → JS date (epoch 1899-12-30)
    // Excel days are local, so we extract Y/M/D from UTC and rebuild as local
    const utcMs = (val - 25569) * 86400000;
    const utc = new Date(utcMs);
    const d = new Date(utc.getUTCFullYear(), utc.getUTCMonth(), utc.getUTCDate());
    return fmt(d);
  }
  return String(val);
}

// ── Convert SOC/TPC_NCR table (label-based columns) ──
function gvizToFormRows(gvizTable) {
  // Map label keywords → short keys
  const LABEL_MAP = {
    'filled date': 'filled_date',
    '填寫日期': 'filled_date',
    'observation type': 'observation_type',
    '觀察種類': 'observation_type',
    'observed subcontractor': 'observed_subcontractor',
    '觀察到的承攬商': 'observed_subcontractor',
    'location': 'location',
    '地點': 'location',
    'hazard type': 'hazard_type',
    '危害種類': 'hazard_type',
    'lsr violated': 'LSR_violated',
    '保命原則': 'LSR_violated',
    'dercription': 'description',  // typo in actual sheet label
    'description': 'description',
    '描述觀察': 'description',
    'already been solved': 'already_solved',
    '已經解決': 'already_solved',
    'operation': 'operation',
    '工作內容': 'operation',
  };

  const colKeys = gvizTable.cols.map(c => {
    const lbl = (c.label || '').toLowerCase();
    for (const [kw, key] of Object.entries(LABEL_MAP)) {
      if (lbl.includes(kw.toLowerCase())) return key;
    }
    return c.id; // fallback to column ID
  });

  return gvizTable.rows.map(row => {
    const obj = {};
    row.c.forEach((cell, i) => {
      if (!cell) return;
      let val = cell.v;
      if (val === null || val === undefined) return;
      const key = colKeys[i];
      if (key === 'filled_date') val = parseGvizDate(val);
      obj[key] = val;
    });
    return obj;
  });
}

// ── Convert manpower table (no labels, row 0 = date serials, rows 1+ = companies) ──
function gvizToManpowerData(gvizTable) {
  const rows = gvizTable.rows;
  if (rows.length < 2) return [];

  // Row 0: column A is empty/header, columns B+ are Excel date serial numbers
  const dateRow = rows[0];
  const dateMap = {}; // col index → date string
  dateRow.c.forEach((cell, i) => {
    if (i === 0 || !cell || cell.v === null) return;
    dateMap[i] = parseGvizDate(cell.v);
  });

  // Rows 1+: column A = company name, columns B+ = daily counts
  const result = [];
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    const companyCell = row.c[0];
    const company = companyCell ? String(companyCell.v || '') : '';
    if (!company) continue;

    const dailyData = {};
    row.c.forEach((cell, i) => {
      if (i === 0 || !dateMap[i] || !cell) return;
      const cnt = parseFloat(cell.v) || 0;
      dailyData[dateMap[i]] = cnt;
    });

    result.push({ company, dailyData });
  }
  return result;
}

function getDefectCategory(t) {
  if (!t) return null;
  const s = (t+'').toLowerCase();
  if (s.includes('不安全條件') || s.includes('unsafe condition')) return 'Condition';
  if (s.includes('不安全行為') || s.includes('unsafe action'))    return 'Action';
  if (s.includes('優點') || s.includes('good practice'))          return 'Positive';
  return null;
}

// ── Convert tracking table ──
// Columns: id, item, assignees, deadline, priority, status, note
function gvizToTrackingRows(gvizTable) {
  const TRK_MAP = {
    'id': 'id', 'item': 'item', 'assignees': 'assignees', 'assignee': 'assignees',
    'deadline': 'deadline', 'priority': 'priority', 'status': 'status', 'note': 'note',
    '事項': 'item', '負責人': 'assignees', '期限': 'deadline', '優先度': 'priority', '狀態': 'status', '備註': 'note'
  };
  const colKeys = gvizTable.cols.map(c => {
    const lbl = (c.label || '').toLowerCase().trim();
    for (const [kw, key] of Object.entries(TRK_MAP)) {
      if (lbl.includes(kw.toLowerCase())) return key;
    }
    return c.id;
  });
  return gvizTable.rows.map(row => {
    const obj = {};
    row.c.forEach((cell, i) => {
      if (!cell || cell.v === null || cell.v === undefined) return;
      let val = cell.v;
      const key = colKeys[i];
      if (key === 'deadline') val = parseGvizDate(val);
      obj[key] = val;
    });
    // Normalize
    const assigneeStr = obj.assignees || '';
    const assignees = typeof assigneeStr === 'string' ? assigneeStr.split(/[,，、;]\s*/).filter(Boolean) : [String(assigneeStr)];
    return {
      id: obj.id || Date.now() + Math.random(),
      item: obj.item || '',
      assignees: assignees,
      deadline: obj.deadline || '',
      priority: obj.priority || 'medium',
      status: obj.status || 'pending',
      note: obj.note || ''
    };
  }).filter(r => r.item); // skip empty rows
}

// ── GAS API helpers (read/write to Sheet 2) ──
async function gasRead(tab) {
  try {
    const resp = await fetch(GAS_URL + '?action=read&tab=' + encodeURIComponent(tab));
    const json = await resp.json();
    return json.data || [];
  } catch(e) { console.error('GAS read error:', e); return []; }
}

async function gasWrite(tab, data) {
  try {
    const resp = await fetch(GAS_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'write', tab: tab, data: data })
    });
    const json = await resp.json();
    if (!json.success) console.error('GAS write error:', json.error);
    return json.success;
  } catch(e) { console.error('GAS write error:', e); return false; }
}

let gasConnected = false;

async function loadGoogleSheetData() {
  const statusEl = document.getElementById('sheetStatus');
  statusEl.innerHTML = '<span style="color:var(--amber);animation:pulse 1s infinite">● 連線中...</span>';

  try {
    // Load Sheet 1 (SOC, TPC NCR, manpower, Gov) via GViz JSONP
    const [socGviz, tpcGviz, mpGviz, govGviz] = await Promise.all([
      loadSheetJsonp('SOC'),
      loadSheetJsonp('TPC NCR'),
      loadSheetJsonp('manpower'),
      loadSheetJsonp('Gov').catch(()=>null),
    ]);

    if (socGviz.status === 'error' || tpcGviz.status === 'error' || mpGviz.status === 'error') {
      throw new Error('GViz query error');
    }

    const socRows = gvizToFormRows(socGviz.table);
    const tpcRows = gvizToTpcRows(tpcGviz.table);
    const mpData  = gvizToManpowerData(mpGviz.table);
    const govRows = (govGviz && govGviz.table) ? gvizToGovRows(govGviz.table) : [];
    processSheetData(socRows, tpcRows, mpData, govRows);

    sheetLoaded = true;

    // Load Sheet 2 (tracking, announcements, leave) via GAS
    try {
      const [trkData, annData, lvData] = await Promise.all([
        gasRead('tracking'),
        gasRead('announcements'),
        gasRead('leave')
      ]);

      // Helper: normalize date from GAS (may be "YYYY-MM-DD", ISO string, or Date string)
      function normalizeDate(v) {
        if (!v) return '';
        const s = String(v);
        // Already in YYYY-MM-DD format
        if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
        // ISO format like "2026-05-06T07:00:00.000Z" - extract local YYYY-MM-DD
        if (s.includes('T')) {
          const d = new Date(s);
          if (!isNaN(d.getTime())) {
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
          }
        }
        return s;
      }

      if (trkData.length > 0) {
        state.trk = trkData.map(r => ({
          id: r.id || Date.now() + Math.random(),
          item: r.item || '',
          assignees: typeof r.assignees === 'string' ? r.assignees.split(/[,，、;]\s*/).filter(Boolean) : [],
          deadline: normalizeDate(r.deadline),
          priority: r.priority || 'medium',
          status: r.status || 'pending',
          note: r.note || ''
        }));
      }

      if (annData.length > 0) {
        state.ann = annData.map(r => ({
          id: r.id || Date.now() + Math.random(),
          date: normalizeDate(r.date),
          content: r.content || '',
          priority: r.priority || 'medium'
        }));
      }

      if (lvData.length > 0) {
        state.leave = lvData.map(r => ({
          id: r.id || Date.now() + Math.random(),
          date: normalizeDate(r.date),
          name: r.name || '',
          reason: r.reason || ''
        }));
      }

      saveState();
      gasConnected = true;
    } catch(gasErr) {
      console.warn('GAS load failed, using local data:', gasErr);
    }

    statusEl.innerHTML = `<span style="color:var(--green)">● 雲端已連線</span> <span style="font-size:10px;color:var(--textMut)">(SOC:${socRows.length} TPC:${tpcRows.length} Gov:${govRows.length} MP:${mpData.length})</span>${gasConnected ? ' <span style="color:var(--green);font-size:10px">● GAS 已連線</span>' : ''}`;
    toast('Google Sheet 資料載入完成 ✓');

    renderPage(currentPage);
  } catch(err) {
    console.error('Sheet load error:', err);
    sheetLoadError = true;
    statusEl.innerHTML = '<span style="color:var(--red)">● 連線失敗</span> <span style="font-size:10px;color:var(--textMut)">(使用本地資料)</span>';
  }
}

function processSheetData(socRows, tpcRows, mpData, govRows) {
  govRows = govRows || [];
  const g = gsheetData;
  g.allData = [];
  g.manpowerData = [];
  g.tbmByDate = {};
  g.workingDaysByDate = {};
  g.totalPeopleByDate = {};
  g.totalHoursByDate = {};
  g.incidentData = {};
  g.socSubcontractors = new Set();

  const INCIDENT_KEYS = ['Recordable incidents','LTI cases','Lost days','Near Miss','Fatalities','Medical treatment','Medical Treatment','MTC','醫療處理'];

  // ── Helper: process one form row (SOC and TPC_NCR share the same structure) ──
  function processFormRow(row, idx, source) {
    const sub = row.observed_subcontractor || '';
    if (sub) g.socSubcontractors.add(sub);
    const obsType = row.observation_type || '';
    const dc = getDefectCategory(obsType);
    const hazType = row.hazard_type || '';
    const desc = row.description || '';
    const loc = row.location || '';
    const filledDate = row.filled_date || '';
    const solved = row.already_solved === true || String(row.already_solved).toLowerCase() === 'true';
    const lsrRaw = String(row.LSR_violated || '').toLowerCase();
    const lsrViolated = lsrRaw === 'true' || lsrRaw.includes('是') || lsrRaw.includes('yes');

    g.allData.push({
      id: source + '-' + idx,
      date: filledDate,
      type: dc === 'Positive' ? '優點' : '缺點',
      defectCategory: dc,
      subcontractor: sub,
      category: hazType,
      location: loc,
      description: desc,
      solved: solved,
      lsr: lsrViolated,
      source: source,
      isPTWViolation: hazType.includes('工作許可') || (desc||'').toLowerCase().includes('ptw') || (desc||'').includes('工作許可')
    });
  }

  socRows.forEach((row, idx) => processFormRow(row, idx, 'SOC'));

  // ── Process TPC NCR rows (completely different structure) ──
  // Columns: issue_date, contractor, issue_category, defect_type, penalty_amount, is_closed, description, other_category
  tpcRows.forEach((row, idx) => {
    let contractor = row.contractor || '';
    // Try to match with SOC subcontractor names
    let matchedSub = contractor;
    g.socSubcontractors.forEach(s => {
      if ((contractor.includes('兆濰') && s.includes('兆濰')) ||
          (contractor.includes('茂富') && s.includes('茂富')) ||
          (contractor.includes('NMDC') && s.includes('NMDC')) ||
          (contractor.includes('安達希') && s.includes('NMDC')) ||
          (contractor.includes('環海') && s.includes('環海')) ||
          (contractor.includes('EGS') && s.includes('EGS')) ||
          (contractor.includes('海義') && s.includes('海義')) ||
          (contractor.includes('HiE') && s.includes('HiE')) ||
          (contractor.includes('高虎') && s.includes('高虎')) ||
          (contractor.includes('GAC') && s.includes('GAC')) ||
          (contractor.includes('美綺') && s.includes('美綺')) ||
          (contractor.includes('天力') && s.includes('天力'))) matchedSub = s;
    });

    let penaltyAmount = 0;
    if (row.penalty_amount) penaltyAmount = parseFloat(String(row.penalty_amount).replace(/[^\d.]/g,'')) || 0;

    // 開立總類 (issue_category): 不安全條件, 不安全行為, 優點
    // 巡檢類型 (inspection_type): 罰單 (now moved here)
    const issueCat = row.issue_category || '';
    const inspType = row.inspection_type || '';
    let type = '缺點', dc = 'Condition';
    if (inspType.includes('罰單') || issueCat.includes('罰單')) type = '罰單'; // backward compatible
    else if (issueCat.includes('優點') || issueCat.includes('Good practice')) { type = '優點'; dc = 'Positive'; }
    if (issueCat.includes('不安全行為') || issueCat.includes('Unsafe action')) dc = 'Action';
    if (issueCat.includes('不安全條件') || issueCat.includes('Unsafe condition')) dc = 'Condition';

    const defectType = row.defect_type || row.other_category || '';
    const desc = row.description || '';
    const dtStr = defectType.toLowerCase();
    const isClosed = row.is_closed === '是' || row.is_closed === true || String(row.is_closed).includes('是');

    g.allData.push({
      id: 'TPC-'+idx,
      date: row.issue_date || '',
      type: type,
      defectCategory: dc,
      subcontractor: matchedSub || contractor,
      category: defectType,
      location: row.area || '',
      description: desc,
      solved: isClosed,
      lsr: false,
      penaltyAmount: penaltyAmount,
      ncrNo: row.ncr_no || '',
      dueDate: row.due_date || '',
      source: 'TPC NCR',
      isPTWViolation: dtStr.includes('工作許可') || dtStr.includes('ptw') || dtStr.includes('permit')
    });
  });

  // ── Process Gov rows (政府機關開立的缺失) ──
  govRows.forEach((row, idx) => {
    let contractor = row.contractor || '';
    let matchedSub = contractor;
    g.socSubcontractors.forEach(s => {
      if ((contractor.includes('兆濰') && s.includes('兆濰')) ||
          (contractor.includes('茂富') && s.includes('茂富')) ||
          (contractor.includes('NMDC') && s.includes('NMDC')) ||
          (contractor.includes('安達希') && s.includes('NMDC')) ||
          (contractor.includes('環海') && s.includes('環海')) ||
          (contractor.includes('EGS') && s.includes('EGS')) ||
          (contractor.includes('海義') && s.includes('海義')) ||
          (contractor.includes('HiE') && s.includes('HiE')) ||
          (contractor.includes('高虎') && s.includes('高虎')) ||
          (contractor.includes('GAC') && s.includes('GAC')) ||
          (contractor.includes('美綺') && s.includes('美綺')) ||
          (contractor.includes('天力') && s.includes('天力'))) matchedSub = s;
    });

    let penaltyAmount = 0;
    if (row.penalty_amount) penaltyAmount = parseFloat(String(row.penalty_amount).replace(/[^\d.]/g,'')) || 0;

    const issueCat = row.issue_category || '';
    let type = '缺點', dc = 'Condition';
    if (issueCat.includes('罰單')) type = '罰單';
    else if (issueCat.includes('優點')) { type = '優點'; dc = 'Positive'; }
    if (issueCat.includes('不安全行為')) dc = 'Action';
    if (issueCat.includes('不安全條件')) dc = 'Condition';

    const defectType = row.defect_type || '';
    const desc = row.description || '';
    const isClosed = row.is_closed === '是' || row.is_closed === true || String(row.is_closed).includes('是');

    g.allData.push({
      id: 'GOV-'+idx,
      date: row.issue_date || '',
      type: type,
      defectCategory: dc,
      subcontractor: matchedSub || contractor,
      category: defectType,
      location: row.area || '',
      description: desc,
      solved: isClosed,
      lsr: false,
      penaltyAmount: penaltyAmount,
      docNo: row.doc_no || '',
      regulation: row.regulation || '',
      issuer: row.issuer || '',
      dueDate: row.due_date || '',
      source: 'Gov',
      isPTWViolation: false
    });
  });

  // ── Process Manpower (pre-parsed array of {company, dailyData}) ──
  mpData.forEach(item => {
    const cname = item.company;
    if (!cname) return;
    const isTBM = cname === 'TBM 次數';
    const isTotal = cname === 'TOTAL';
    const isTotalHours = cname === 'TOTAL HOURS';
    const isIncident = INCIDENT_KEYS.includes(cname);

    Object.entries(item.dailyData).forEach(([dateStr, cnt]) => {
      if (isTBM) {
        g.tbmByDate[dateStr] = (g.tbmByDate[dateStr]||0) + cnt;
      } else if (isTotalHours) {
        g.totalHoursByDate[dateStr] = cnt;
      } else if (isIncident) {
        if (!g.incidentData[cname]) g.incidentData[cname] = {};
        g.incidentData[cname][dateStr] = cnt;
      } else if (isTotal) {
        g.totalPeopleByDate[dateStr] = cnt;
      } else {
        if (cnt > 0) {
          g.manpowerData.push({ company: cname, date: dateStr, count: cnt });
          if (!g.workingDaysByDate[dateStr]) g.workingDaysByDate[dateStr] = 0;
          g.workingDaysByDate[dateStr] += cnt;
        }
      }
    });
  });
}

// ═══════════════════════════════════════════════════════════════
// KPI CALCULATION ENGINE (ported from v2.4)
// ═══════════════════════════════════════════════════════════════
function calcKPI(startDate, endDate, source, subFilter, locFilter, dcFilter) {
  if (!sheetLoaded) return getFallbackKPI();
  const g = gsheetData;

  // Base filter
  let base = g.allData.filter(item =>
    item.date >= startDate && item.date <= endDate &&
    (source === 'All' || item.source === source) &&
    (subFilter === 'All' || item.subcontractor === subFilter) &&
    (locFilter === 'All' || item.location === locFilter)
  );

  const allDefects = base.filter(d => d.type === '缺點' || d.type === '罰單');
  const condDef = allDefects.filter(d => d.defectCategory === 'Condition');
  const actDef  = allDefects.filter(d => d.defectCategory === 'Action');

  let filtered = dcFilter && dcFilter !== 'All'
    ? base.filter(i => i.type === '優點' || i.defectCategory === dcFilter)
    : base;

  const defects   = filtered.filter(d => d.type === '缺點' || d.type === '罰單');
  const positives = filtered.filter(d => d.type === '優點');
  const closed    = defects.filter(d => d.solved);
  const socDef    = filtered.filter(d => d.source === 'SOC' && (d.type === '缺點' || d.type === '罰單'));
  const tpcDef    = filtered.filter(d => d.source === 'TPC NCR' && (d.type === '缺點' || d.type === '罰單'));
  const govDef    = filtered.filter(d => d.source === 'Gov' && (d.type === '缺點' || d.type === '罰單'));
  const tpcPen    = filtered.filter(d => d.source === 'TPC NCR' && d.type === '罰單');
  const govPen    = filtered.filter(d => d.source === 'Gov' && (d.type === '罰單' || d.penaltyAmount > 0));
  const lsrViol   = defects.filter(d => d.lsr);

  let totalPenalty = 0;
  tpcPen.forEach(i => totalPenalty += parseFloat(i.penaltyAmount) || 0);
  let govPenalty = 0;
  govPen.forEach(i => govPenalty += parseFloat(i.penaltyAmount) || 0);

  const closureRate = defects.length > 0 ? (closed.length / defects.length) * 100 : 0;

  // PTW compliance
  const ptwViolations = allDefects.filter(d => d.isPTWViolation).length;
  const ptwRate = allDefects.length > 0 ? Math.max(0, (1 - ptwViolations / allDefects.length) * 100) : 100;

  // TBM rate
  const workDays = Object.keys(g.workingDaysByDate).filter(d => d >= startDate && d <= endDate);
  const tbmDays = workDays.filter(d => (g.tbmByDate[d] || 0) >= 1);
  const tbmRate = workDays.length > 0 ? (tbmDays.length / workDays.length) * 100 : 0;

  // Lagging indicators
  let totalPeople = 0;
  Object.entries(g.totalPeopleByDate).forEach(([date, val]) => {
    if (date >= startDate && date <= endDate) totalPeople += val;
  });
  const totalHours = totalPeople * 8;
  function sumIncident(key) {
    if (!g.incidentData[key]) return 0;
    return Object.entries(g.incidentData[key])
      .filter(([d]) => d >= startDate && d <= endDate)
      .reduce((s, [, v]) => s + v, 0);
  }
  const rec  = sumIncident('Recordable incidents');
  const lti  = sumIncident('LTI cases');
  const lost = sumIncident('Lost days');
  const nm   = sumIncident('Near Miss');
  const fat  = sumIncident('Fatalities');
  const mtc  = sumIncident('Medical treatment') + sumIncident('Medical Treatment') + sumIncident('MTC') + sumIncident('醫療處理');
  const calcRate = (n, mul) => totalHours > 0 ? (n * mul / totalHours) : 0;
  const trir     = calcRate(rec, 200000);
  const ltir     = calcRate(lti, 200000);
  const severity = calcRate(lost, 200000);
  const nmRate   = calcRate(nm, 200000);
  const far      = calcRate(fat, 100000000);
  const mtcRate  = calcRate(mtc, 200000);

  // Category stats
  const catStats = {};
  defects.forEach(item => {
    if (!item.category) return;
    if (!catStats[item.category]) catStats[item.category] = { total:0, condition:0, action:0 };
    catStats[item.category].total++;
    if (item.defectCategory === 'Condition') catStats[item.category].condition++;
    else if (item.defectCategory === 'Action') catStats[item.category].action++;
  });
  const socByCategory = Object.entries(catStats)
    .map(([name, v]) => ({name, value: v.total, condition: v.condition, action: v.action}))
    .sort((a,b) => b.value - a.value);

  // Monthly stats
  const monthlyStats = {};
  base.forEach(item => {
    if (item.date && (item.type === '缺點' || item.type === '罰單')) {
      const m = item.date.substring(0,7);
      if (!monthlyStats[m]) monthlyStats[m] = { soc:0, ncr:0 };
      if (item.source === 'SOC') monthlyStats[m].soc++;
      else monthlyStats[m].ncr++;
    }
  });
  const monthly = Object.entries(monthlyStats).sort((a,b)=>a[0].localeCompare(b[0]))
    .map(([m, v]) => ({m, soc: v.soc, ncr: v.ncr}));

  // Contractor ranking
  const subStats = {};
  filtered.forEach(item => {
    if (item.subcontractor && (item.type === '缺點' || item.type === '罰單')) {
      if (!subStats[item.subcontractor]) subStats[item.subcontractor] = { name:item.subcontractor, soc:0, ncr:0, cond:0, act:0, closed:0, total:0 };
      subStats[item.subcontractor].total++;
      if (item.defectCategory === 'Condition') subStats[item.subcontractor].cond++;
      else if (item.defectCategory === 'Action') subStats[item.subcontractor].act++;
      if (item.solved) subStats[item.subcontractor].closed++;
      if (item.source === 'SOC') subStats[item.subcontractor].soc++;
      else subStats[item.subcontractor].ncr++;
    }
  });
  const contractorRank = Object.values(subStats)
    .filter(i=>i.total>0)
    .map(c => ({...c, score: c.total > 0 ? Math.round((c.closed/c.total)*100) : 0}))
    .sort((a,b) => b.score - a.score);

  // Positive (優點) ranking
  const posStats = {};
  filtered.forEach(item => {
    if (item.subcontractor && item.type === '優點') {
      if (!posStats[item.subcontractor]) posStats[item.subcontractor] = { name:item.subcontractor, count:0, soc:0, tpc:0 };
      posStats[item.subcontractor].count++;
      if (item.source === 'SOC') posStats[item.subcontractor].soc++;
      else posStats[item.subcontractor].tpc++;
    }
  });
  const positiveRank = Object.values(posStats).sort((a,b) => b.count - a.count);

  // Manpower stats
  const mpFiltered = g.manpowerData.filter(i => i.date >= startDate && i.date <= endDate);
  const mpByCompany = {};
  mpFiltered.forEach(item => {
    if (!mpByCompany[item.company]) mpByCompany[item.company] = {name:item.company, total:0, max:0, days:new Set()};
    mpByCompany[item.company].total += item.count;
    mpByCompany[item.company].max = Math.max(mpByCompany[item.company].max, item.count);
    mpByCompany[item.company].days.add(item.date);
  });
  const manpower = Object.values(mpByCompany).map(c => ({
    name: c.name,
    avg: c.days.size > 0 ? Math.round(c.total / c.days.size) : 0,
    max: c.max,
    hours: c.total * 8
  })).sort((a,b) => b.hours - a.hours);

  // Condition/Action open/closed counts — use ALL data (no date filter)
  // to match the Deficiency page which shows all open items regardless of date range
  const allCondDef = g.allData.filter(d =>
    (d.type === '缺點' || d.type === '罰單') &&
    d.defectCategory === 'Condition' &&
    (source === 'All' || d.source === source) &&
    (subFilter === 'All' || d.subcontractor === subFilter) &&
    (locFilter === 'All' || d.location === locFilter)
  );
  const allActDef = g.allData.filter(d =>
    (d.type === '缺點' || d.type === '罰單') &&
    d.defectCategory === 'Action' &&
    (source === 'All' || d.source === source) &&
    (subFilter === 'All' || d.subcontractor === subFilter) &&
    (locFilter === 'All' || d.location === locFilter)
  );
  const openCond   = allCondDef.filter(d => !d.solved).length;
  const openAct    = allActDef.filter(d  => !d.solved).length;
  const closedCond = allCondDef.filter(d => d.solved).length;
  const closedAct  = allActDef.filter(d  => d.solved).length;

  return {
    summary: {
      totalSOC: socDef.length, totalNCR: tpcDef.length, totalGov: govDef.length,
      totalDefects: defects.length, positives: positives.length,
      closureRate: closureRate, manpower: totalPeople,
      safeHours: totalHours,
      trir, ltir, far, nearMissRate: nmRate, severityRate: severity, mtcRate,
      penaltyAmount: totalPenalty,
      govPenalty: govPenalty,
      conditionOpen: openCond, conditionClosed: closedCond,
      actionOpen: openAct, actionClosed: closedAct,
      lsrViolations: lsrViol.length,
      rec, lti, lost, nm, fat, mtc, totalPeople, totalHours
    },
    ncrClosure: closureRate, ptwCompliance: ptwRate, tbmRate: tbmRate,
    socByCategory, monthly, contractorRank, positiveRank, manpower,
    // Monthly manpower by location (台中/通霄)
    monthlyManpower: calcMonthlyManpowerByLocation(startDate, endDate)
  };
}

function calcMonthlyManpowerByLocation(startDate, endDate) {
  const g = gsheetData;
  const monthData = {}; // month → {taichung, tongxiao}
  g.manpowerData.forEach(item => {
    if (item.date < startDate || item.date > endDate) return;
    const m = item.date.substring(0, 7);
    if (!monthData[m]) monthData[m] = { taichung: 0, tongxiao: 0, unassigned: 0 };
    const cn = (item.company || '').toLowerCase();
    if (cn.includes('台中') || cn.includes('taichung')) {
      monthData[m].taichung += item.count;
    } else if (cn.includes('通霄') || cn.includes('tongxiao') || cn.includes('tunghsiao')) {
      monthData[m].tongxiao += item.count;
    } else {
      monthData[m].unassigned += item.count;
    }
  });
  // Split unassigned 50/50 rounded
  return Object.entries(monthData).sort((a,b)=>a[0].localeCompare(b[0])).map(([m, v]) => {
    const halfUp = Math.ceil(v.unassigned / 2);
    const halfDown = Math.floor(v.unassigned / 2);
    return { month: m, taichung: v.taichung + halfUp, tongxiao: v.tongxiao + halfDown };
  });
}

function getFallbackKPI() {
  return {
    summary:{totalSOC:0,totalNCR:0,totalGov:0,totalDefects:0,positives:0,closureRate:0,manpower:0,safeHours:0,trir:0,ltir:0,far:0,nearMissRate:0,severityRate:0,mtcRate:0,penaltyAmount:0,govPenalty:0,conditionOpen:0,conditionClosed:0,actionOpen:0,actionClosed:0,lsrViolations:0,rec:0,lti:0,lost:0,nm:0,fat:0,mtc:0,totalPeople:0,totalHours:0},
    ncrClosure:0,ptwCompliance:0,tbmRate:0,
    socByCategory:[],monthly:[],contractorRank:[],positiveRank:[],manpower:[],monthlyManpower:[]
  };
}

function getDateRange() {
  if (sheetLoaded) {
    const allDates = [
      ...gsheetData.allData.map(d=>d.date),
      ...Object.keys(gsheetData.totalPeopleByDate)
    ].filter(d => d && d.length >= 10).sort();
    if (allDates.length > 0) return { start: allDates[0], end: allDates[allDates.length-1] };
  }
  return { start: '2025-04-01', end: new Date().toISOString().slice(0,10) };
}

function autoSeverity(desc,cat){
  const s=(desc+" "+cat).toLowerCase();
  if(SEV_KW.critical.some(k=>s.includes(k)))return"critical";
  if(SEV_KW.major.some(k=>s.includes(k)))return"major";
  if(SEV_KW.minor.some(k=>s.includes(k)))return"minor";
  return"major";
}

function statCard(icon,label,value,sub,color){
  return `<div class="card stat-card"><div class="stat-icon" style="background:${color}15;color:${color}">${icon}</div><div><div class="stat-label">${label}</div><div class="stat-value">${value}</div>${sub?`<div class="stat-sub">${sub}</div>`:''}</div></div>`;
}
function gaugeCard(label,value,max,color){
  const pct=Math.min(value/max,1);const r=40;const c=2*Math.PI*r;const d=pct*c*.75;
  return `<div class="card" style="padding:14px;text-align:center"><svg width="100" height="70" viewBox="0 0 100 70">
    <circle cx="50" cy="55" r="${r}" fill="none" stroke="var(--border)" stroke-width="7" stroke-dasharray="${c*.75} ${c*.25}" stroke-linecap="round" transform="rotate(135 50 55)"/>
    <circle cx="50" cy="55" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-dasharray="${d} ${c}" stroke-linecap="round" transform="rotate(135 50 55)"/>
    <text x="50" y="48" text-anchor="middle" fill="var(--text)" style="font-size:16px;font-weight:700;font-family:var(--mono)">${max>10?value.toFixed(1):value.toFixed(2)}</text>
    <text x="50" y="62" text-anchor="middle" fill="var(--textMut)" style="font-size:8px">${max>10?'%':''}</text>
  </svg><div class="gauge-label">${label}</div></div>`;
}

        <div class="card" style="padding:20px;text-align:center">${gaugeCard(g.l,g.v,100,g.v>=g.t[1]?'var(--green)':g.v>=g.t[0]?'var(--amber)':'var(--red)').replace(/<\/?div[^>]*>/g,'')}

    <div class="grid grid-6" style="gap:0;margin-bottom:22px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden">
      ${[{l:"SOC缺失",v:s.totalSOC,c:"var(--blue)"},{l:"TPC缺失",v:s.totalNCR,c:"var(--purple)"},{l:"政府機關",v:s.totalGov||0,c:"var(--cyan)"},{l:"總缺失",v:s.totalDefects,c:"var(--red)"},{l:"優點",v:s.positives,c:"var(--green)"},{l:"結案率",v:s.closureRate.toFixed(1)+'%',c:"var(--cyan)"}].map((x,i)=>`
        <div style="padding:18px 10px;text-align:center;border-right:${i<5?'1px solid var(--border)':'none'}">
          <div style="font-size:10px;color:var(--textMut);font-weight:600;margin-bottom:6px">${x.l}</div>
          <div style="font-size:20px;font-weight:800;color:${x.c};font-family:var(--mono)">${x.v}</div>
        </div>`).join('')}
    </div>
    <div class="grid grid-2" style="gap:0;margin-bottom:22px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden">
      <div style="padding:14px 18px;border-right:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:11px;color:var(--textMut);font-weight:600">⚠️ TPC 罰款</span>
        <span style="font-size:18px;font-weight:800;color:var(--red);font-family:var(--mono)">NT$${(s.penaltyAmount||0).toLocaleString()}</span>

        <span style="font-size:11px;color:var(--textMut);font-weight:600">🏛️ 政府機關罰款</span>
        <span style="font-size:18px;font-weight:800;color:var(--red);font-family:var(--mono)">NT$${(s.govPenalty||0).toLocaleString()}</span>

        <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>排名</th><th>承包商</th><th>條件</th><th>行為</th><th>合計</th><th>結案率</th></tr></thead>
        <tbody>${kpi.contractorRank.length > 0 ? kpi.contractorRank.map((c,i)=>{const r=c.total>0?Math.round((c.closed/c.total)*100):0;return`
          <tr><td style="font-weight:700;color:${i===0?'var(--amber)':'var(--text)'}">${['🥇','🥈','🥉'][i]||'#'+(i+1)}</td>

          <td style="font-family:var(--mono)">${c.cond}</td><td style="font-family:var(--mono)">${c.act}</td><td style="font-family:var(--mono);font-weight:700">${c.total}</td>

        <div style="text-align:center;padding:12px;background:var(--blueBg);border-radius:8px"><div style="font-size:10px;color:var(--textMut);margin-bottom:4px">行為已結案</div><div style="font-size:24px;font-weight:800;color:var(--blue);font-family:var(--mono)">${s.actionClosed}</div></div>

    const topCats = kpi.socByCategory.slice(0,8);
    const totalCats = kpi.socByCategory.reduce((s,c)=>s+c.value,0);
    if(cc && topCats.length > 0) catChart=new Chart(cc,{
      type:'bar',
      data:{
        labels:topCats.map(c=>c.name),
        datasets:[{data:topCats.map(c=>c.value),backgroundColor:PAL,borderRadius:4}]
      },
      options:{
        responsive:true,maintainAspectRatio:false,indexAxis:'y',
        layout:{padding:{right:60}},
        plugins:{
          legend:{display:false},
          tooltip:{callbacks:{label:(ctx)=>{const pct=totalCats>0?(ctx.parsed.x/totalCats*100).toFixed(1):0;return `${ctx.parsed.x} 件 (${pct}%)`;}}}
        },
        scales:{
          x:{ticks:{color:'#5a6478',font:{size:10}},grid:{color:'#1e2738'}},
          y:{ticks:{color:'#8b95a8',font:{size:10}},grid:{display:false}}
        },
        animation:{onComplete:function(){
          const chart=this; const ctx=chart.ctx;
          ctx.font='bold 10px DM Sans, sans-serif';
          ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillStyle='#e8edf5';
          chart.data.datasets[0].data.forEach((value, idx) => {
            const meta = chart.getDatasetMeta(0).data[idx];
            const pct = totalCats > 0 ? (value/totalCats*100).toFixed(1) : 0;
            ctx.fillText(`${value} (${pct}%)`, meta.x + 6, meta.y);
          });
        }}
      }
    });
    else if(cc) catChart=new Chart(cc,{type:'bar',data:{labels:['無資料'],datasets:[{data:[0],backgroundColor:['#5a6478']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
  },100);
}

// ─── DEFICIENCY ──────────────────────────────────────────────
let defTab = 'soc'; // 'soc' / 'tpc' / 'gov'
function renderDeficiency(){
  const el=document.getElementById('page-deficiency');
  if (!sheetLoaded) {
    el.innerHTML='<div style="padding:40px;text-align:center;color:var(--textMut)">載入中... 請等待 Google Sheet 連線完成</div>';
    return;
  }
  const g = gsheetData;
  const todayStr = new Date().toISOString().slice(0,10);
  const socOpen = g.allData.filter(d => d.source === 'SOC' && d.type !== '優點' && !d.solved);
  const tpcOpen = g.allData.filter(d => d.source === 'TPC NCR' && d.type !== '優點' && !d.solved);
  const govOpen = g.allData.filter(d => d.source === 'Gov' && d.type !== '優點' && !d.solved);
  const tpcOverdue = tpcOpen.filter(d => d.dueDate && d.dueDate < todayStr).length;
  const govOverdue = govOpen.filter(d => d.dueDate && d.dueDate < todayStr).length;

  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="pill-btn" style="background:${defTab==='soc'?'var(--amberBg)':'var(--card)'};color:${defTab==='soc'?'var(--amber)':'var(--textSec)'}" onclick="defTab='soc';renderDeficiency()">SOC 未結案 (${socOpen.length})</button>
        <button class="pill-btn" style="background:${defTab==='tpc'?'var(--blueBg)':'var(--card)'};color:${defTab==='tpc'?'var(--blue)':'var(--textSec)'}" onclick="defTab='tpc';renderDeficiency()">TPC NCR 未結案 (${tpcOpen.length})${tpcOverdue>0?` <span style="color:var(--red);margin-left:4px">⚠️ ${tpcOverdue} 逾期</span>`:''}</button>
        <button class="pill-btn" style="background:${defTab==='gov'?'rgba(6,182,212,.15)':'var(--card)'};color:${defTab==='gov'?'var(--cyan)':'var(--textSec)'}" onclick="defTab='gov';renderDeficiency()">🏛️ 政府機關 未結案 (${govOpen.length})${govOverdue>0?` <span style="color:var(--red);margin-left:4px">⚠️ ${govOverdue} 逾期</span>`:''}</button>
      </div>
    </div>
    ${defTab === 'soc' ? renderSOCTable(socOpen) : defTab === 'tpc' ? renderTPCTable(tpcOpen) : renderGovTable(govOpen)}`;
}

function renderGovTable(items) {
  const todayStr = new Date().toISOString().slice(0,10);
  return `<div class="card"><div style="overflow-x:auto"><table class="tbl">
    <thead><tr><th>開立單位</th><th>發文字號</th><th>日期</th><th>承攬商</th><th>地點</th><th>缺失種類</th><th>內容</th><th>發規條款</th><th>改善期限</th><th>罰款</th></tr></thead>
    <tbody>${items.length > 0 ? items.map(d => {
      const overdue = d.dueDate && d.dueDate < todayStr;
      return `
      <tr style="${overdue?'background:rgba(239,68,68,.05)':''}">
        <td style="font-weight:600;color:var(--cyan)">${d.issuer||'-'}</td>
        <td style="font-family:var(--mono);font-size:10px">${d.docNo||'-'}</td>

        <td style="font-family:var(--mono);color:${d.penaltyAmount?'var(--red)':'var(--textMut)'}">${d.penaltyAmount ? 'NT$'+d.penaltyAmount.toLocaleString() : '-'}</td>

function renderTPCTable(items) {

function calcSling(){
  const load=+document.getElementById('sLoad').value,angle=+document.getElementById('sAngle').value,legs=+document.getElementById('sLegs').value;

  document.getElementById('slingResult').innerHTML=[{l:"放大係數",v:f.toFixed(3)+'×',c:'var(--amber)'},{l:"每條張力",v:tpl.toFixed(0)+'kg',c:'var(--blue)'},{l:"建議WLL",v:(tpl*2).toFixed(0)+'kg',c:'var(--green)'}].map(x=>`<div style="background:var(--bg);border-radius:8px;padding:14px;text-align:center"><div style="font-size:10px;color:var(--textMut);margin-bottom:4px">${x.l}</div><div style="font-size:20px;font-weight:800;color:${x.c};font-family:var(--mono)">${x.v}</div></div>`).join('');
  document.getElementById('slingWarn').innerHTML=angle>120?'<div style="margin-top:14px;padding:10px;background:var(--redBg);border-radius:8px;color:var(--red);font-size:11px;font-weight:600">⚠️ 夾角超過120°！</div>':'';
}

function isHoliday(dateStr){return !!TW_HOLIDAYS[dateStr];}

function getEffectiveCell(p, di, dateStr) {
  // Apply temporary leave overlay
  const leave = (state.leave||[]).find(l => l.name === p.name && l.date === dateStr);
  if (leave) return '臨';
  // Default: weekday=R, weekend/holiday=休 if cell is empty
  let val = p.days?.[di] || '';
  if (!val) {
    // Parse YYYY-MM-DD manually to avoid timezone issues
    const [yr, mo, da] = dateStr.split('-').map(Number);
    const wd = new Date(yr, mo-1, da).getDay();
    val = (wd === 0 || wd === 6 || isHoliday(dateStr)) ? '休' : 'R';
  }
  return val;
}

// ── Upload Excel and parse rotation plan ──
function uploadScheduleExcel(event){
  const file = event.target.files[0];
  if(!file)return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array',cellDates:true});
      const sheetName = wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      const aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      parseRotationPlan(aoa, sheetName);
      event.target.value = ''; // reset
    } catch(err){
      console.error('Excel parse error:',err);
      toast('Excel 解析失敗：'+err.message,'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseRotationPlan(aoa, sheetName){
  console.log('=== Parsing Excel ===');
  console.log('Total rows:', aoa.length);
  console.log('Row 0:', aoa[0]);
  console.log('Row 1:', aoa[1]);
  console.log('Row 2:', aoa[2]);
  console.log('Row 3:', aoa[3]);

  // Helper: format Date as YYYY-MM-DD using LOCAL time (not UTC)
  function fmtDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${dd}`;
  }

  // Find the date row: the row that contains at least one Date object or parseable date
  let dateRowIdx = -1;
  let dateStartCol = -1;
  let firstDate = null;

  // Strategy 1: look for '日期 Date' header, then first Date object to the right
  for(let i=0; i<Math.min(aoa.length,5); i++){
    const row = aoa[i];
    if(!row) continue;
    for(let j=0; j<Math.min(row.length,5); j++){
      const cell = String(row[j]||'').trim();
      if(cell.includes('日期') || cell.toLowerCase().includes('date')){
        dateRowIdx = i;
        // Find first Date object to the right
        for(let k=j+1; k<row.length; k++){
          const v = row[k];
          if(v instanceof Date && !isNaN(v.getTime())){
            dateStartCol = k;
            firstDate = v;
            break;
          }
          if(typeof v === 'number' && v > 40000){ // Excel serial date number
            const d = new Date((v - 25569) * 86400000);
            if(!isNaN(d.getTime())){
              dateStartCol = k;
              firstDate = d;
              break;
            }
          }
        }
        break;
      }
    }
    if(dateRowIdx !== -1 && dateStartCol !== -1) break;
  }

  // Strategy 2: scan all rows for any Date object
  if(dateStartCol === -1){
    for(let i=0; i<Math.min(aoa.length,8); i++){
      const row = aoa[i] || [];
      for(let j=0; j<row.length; j++){
        const v = row[j];
        if(v instanceof Date && !isNaN(v.getTime()) && v.getFullYear() > 2020){
          dateRowIdx = i;
          dateStartCol = j;
          firstDate = v;
          console.log(`Found date at row ${i} col ${j}: ${v}`);
          break;
        }
      }
      if(dateStartCol !== -1) break;
    }
  }

  if(dateStartCol === -1 || !firstDate){
    toast('找不到日期欄位，請看 Console (F12)','error');
    console.error('No date detected. Full first 4 rows:', aoa.slice(0,4));
    return;
  }

  console.log(`Found: dateRow=${dateRowIdx}, dateStartCol=${dateStartCol}, firstDate=${firstDate} (local: ${fmtDate(firstDate)})`);

  // ── Normalize firstDate: SheetJS may return time slightly before midnight due to UTC conversion ──
  // If the time is near end of day (UTC), treat as the next local day
  if(firstDate.getUTCHours() >= 12){
    // Likely a date that got shifted; round up
    firstDate = new Date(firstDate.getTime() + 12*3600*1000);
  }
  // Snap to local midnight to prevent accumulation errors
  firstDate = new Date(firstDate.getFullYear(), firstDate.getMonth(), firstDate.getDate());
  console.log(`Normalized firstDate: ${fmtDate(firstDate)}`);

  // Build date columns array - extrapolate sequentially
  const dateRow = aoa[dateRowIdx];
  const dateColumns = [];
  const monthStr = firstDate.getFullYear() + '-' + String(firstDate.getMonth()+1).padStart(2,'0');
  const year = firstDate.getFullYear();
  const month = firstDate.getMonth();
  const startDay = firstDate.getDate();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  // Generate sequential dates starting from firstDate within the same month
  for(let i=0; i<daysInMonth; i++){
    const d = new Date(year, month, startDay + i);
    if(d.getMonth() !== month) break;
    const col = dateStartCol + i;
    dateColumns.push({col, date:d, dateStr: fmtDate(d)});
  }

  console.log(`Generated ${dateColumns.length} date columns from ${dateColumns[0].dateStr} to ${dateColumns[dateColumns.length-1].dateStr}`);

  if(dateColumns.length < 5){
    toast(`只解析到 ${dateColumns.length} 個日期`,'error');
    return;
  }

  // Find name column - search rows below dateRow for cells with \n + Latin chars
  let nameCol = -1, areaCol = -1;
  for(let r=dateRowIdx+1; r<Math.min(aoa.length, dateRowIdx+12); r++){
    const row = aoa[r];
    if(!row) continue;
    for(let c=0; c<dateStartCol; c++){
      const v = String(row[c]||'').trim();
      if(v.includes('\n') && /[A-Za-z]{2,}/.test(v)){
        nameCol = c;
        if(c > 0) areaCol = c - 1;
        console.log(`Found name col=${c} in row ${r}: ${v.replace(/\n/g,' / ')}`);
        break;
      }
    }
    if(nameCol !== -1) break;
  }

  // Fallback: assume name is one column before date start
  if(nameCol === -1){
    nameCol = dateStartCol - 1;
    areaCol = dateStartCol - 2;
    console.log(`Fallback: nameCol=${nameCol}, areaCol=${areaCol}`);
  }

  const newPeople = [];
  let currentArea = '';

  // Iterate rows: skip dateRow + week_day row, then every 2 rows = one person
  for(let r = dateRowIdx + 2; r < aoa.length; r++){
    const row = aoa[r];
    if(!row || row.length === 0) continue;

    if(areaCol >= 0){
      const areaCell = String(row[areaCol]||'').trim();
      if(areaCell && !areaCell.match(/^\d+$/) && areaCell.length > 1 && !areaCell.startsWith('=')){
        currentArea = areaCell.replace(/\n/g,' ').trim();
      }
    }

    const nameCell = String(row[nameCol]||'').trim();
    if(!nameCell) continue;
    if(nameCell.match(/^[\d.\s]+$/)) continue;
    if(nameCell.startsWith('=')) continue;
    if(nameCell.includes('SUM')) continue;
    if(nameCell === '加班累計' || nameCell.includes('Accumulated')) continue;
    if(nameCell.length < 2) continue;

    let displayName = nameCell;
    if(nameCell.includes('\n')){
      const parts = nameCell.split('\n').map(p=>p.trim()).filter(Boolean);
      const eng = parts.find(p => /^[A-Za-z]+$/.test(p));
      displayName = eng || parts[parts.length-1] || parts[0];
    }
    if(!displayName || displayName.length < 2) continue;

    const days = [];
    dateColumns.forEach(({col, date}, dayIdx) => {
      const cell = row[col];
      let code = '';
      if(cell !== null && cell !== undefined){
        code = String(cell).trim();
      }
      if(code.startsWith('=')) code = '';
      if(code === 'H') code = '休';
      if(code === 'CCTV' || code === 'CCTV ') code = 'CCT';
      if(code === '環保') code = '環';
      if(!code){
        const wd = date.getDay();
        code = (wd === 0 || wd === 6) ? '休' : 'R';
      }
      days[dayIdx] = code;
    });

    const otRow = aoa[r+1] || [];
    const overtime = [];
    dateColumns.forEach(({col}, dayIdx) => {
      const v = otRow[col];
      let n = 0;
      if(v !== null && v !== undefined && v !== ''){
        const parsed = parseFloat(v);
        if(!isNaN(parsed)) n = parsed;
      }
      overtime[dayIdx] = n;
    });

    console.log(`Person ${newPeople.length+1}: ${displayName} (${currentArea})`);
    newPeople.push({name: displayName, area: currentArea, days: days, overtime: overtime});

    if(!getTeam().includes(displayName)){
      if(!state.customTeam) state.customTeam = [...TEAM];
      if(!state.customTeam.includes(displayName)) state.customTeam.push(displayName);
    }

    r++; // skip overtime row
  }

  console.log(`Total people parsed: ${newPeople.length}`);

  if(newPeople.length === 0){
    toast('未解析到任何人員，請看 Console (F12)','error');
    return;
  }

  state.schedule.month = monthStr;
  state.schedule.people = newPeople;
  if(state.customTeam) TEAM = state.customTeam;
  saveState();
  renderSchedule();
  toast(`已匯入 ${newPeople.length} 位人員的 ${monthStr} 班表 ✓`);
}
