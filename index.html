<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety E-System</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<style>
:root {
  --bg:#07090f;--surface:#0f1219;--card:#141922;--border:#1e2738;--borderHi:#2a3548;
  --amber:#f59e0b;--amberBg:rgba(245,158,11,0.12);--red:#ef4444;--redBg:rgba(239,68,68,0.1);
  --green:#10b981;--greenBg:rgba(16,185,129,0.1);--blue:#3b82f6;--blueBg:rgba(59,130,246,0.1);
  --purple:#8b5cf6;--cyan:#06b6d4;--text:#e8edf5;--textSec:#8b95a8;--textMut:#5a6478;
  --font:'DM Sans','Noto Sans TC',sans-serif;--mono:'JetBrains Mono','Fira Code',monospace;
  --shadow:0 4px 20px rgba(0,0,0,0.5);--radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:var(--font);transition:all .2s}
button:hover:not(:disabled){filter:brightness(1.15)}
input:focus,select:focus,textarea:focus{border-color:var(--amber)!important;box-shadow:0 0 0 2px var(--amberBg);outline:none}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
[contenteditable]:empty:before{content:attr(data-placeholder);color:var(--textMut)}
a{color:var(--amber);text-decoration:none}

/* SIDEBAR */
.sidebar{width:230px;min-height:100vh;background:linear-gradient(180deg,#0b0e16,#111622);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;z-index:100;flex-shrink:0;transition:width .3s;overflow:hidden}
.sidebar.collapsed{width:56px}
.sidebar-logo{padding:18px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10}
.sidebar.collapsed .sidebar-logo{padding:18px 10px}
.logo-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.logo-text{overflow:hidden;white-space:nowrap}
.sidebar.collapsed .logo-text,.sidebar.collapsed .nav-label,.sidebar.collapsed .admin-label{display:none}
.sidebar nav{flex:1;padding:10px 6px}
.nav-btn{display:flex;align-items:center;gap:10;width:100%;padding:9px 12px;background:transparent;border:none;border-radius:8px;color:var(--textSec);font-size:12px;font-weight:500;margin-bottom:1px}
.sidebar.collapsed .nav-btn{padding:9px 13px;justify-content:center}
.nav-btn.active{background:var(--amberBg);color:var(--amber);font-weight:700}
.sidebar-footer{padding:10px 6px;border-top:1px solid var(--border)}
.admin-btn{display:flex;align-items:center;gap:8;width:100%;padding:8px 12px;border:none;border-radius:8px;font-size:11px;font-weight:600}
.admin-btn.off{background:var(--border);color:var(--textSec)}
.admin-btn.on{background:var(--greenBg);color:var(--green)}
.toggle-btn{display:flex;align-items:center;justify-content:center;width:100%;padding:6px;margin-top:4px;background:transparent;border:none;color:var(--textMut);border-radius:6px}

/* MAIN */
.main{flex:1;min-width:0;padding:22px 26px;max-width:1440px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.header h1{font-size:20px;font-weight:800;letter-spacing:-.3px}
.header-sub{margin-top:3px;font-size:11px;color:var(--textMut)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px}
.page{animation:fi .3s ease}
.page[hidden]{display:none!important}

/* CARDS & STATS */
.grid{display:grid;gap:14px}.grid-4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid-3{grid-template-columns:repeat(3,1fr)}.grid-2{grid-template-columns:1fr 1fr}
.grid-6{grid-template-columns:repeat(6,1fr)}.grid-5{grid-template-columns:repeat(5,1fr)}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.card-head h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.card-body{padding:10px 16px;max-height:320px;overflow:auto}
.stat-card{display:flex;align-items:center;gap:14px;padding:16px 18px}
.stat-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.stat-label{font-size:10px;color:var(--textMut);font-weight:600;letter-spacing:.5px;margin-bottom:2px;text-transform:uppercase}
.stat-value{font-size:20px;font-weight:800;font-family:var(--mono)}
.stat-sub{font-size:10px;color:var(--textSec);margin-top:1px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;font-weight:600;border-radius:8px;font-size:13px;padding:8px 16px}
.btn-sm{font-size:12px;padding:5px 10px}
.btn-pri{background:linear-gradient(135deg,#f59e0b,#d97706);color:#000}
.btn-def{background:var(--border);color:var(--text)}
.btn-ghost{background:transparent;color:var(--textSec)}
.btn-danger{background:var(--redBg);color:var(--red)}
.btn-success{background:var(--greenBg);color:var(--green)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* INPUTS */
.inp,.sel,.txa{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:var(--font);outline:none}
.txa{min-height:70px;resize:vertical}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:5px;font-size:11px;font-weight:600;color:var(--textSec);letter-spacing:.5px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);backdrop-filter:blur(6px)}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:16px;border:1px solid var(--border);width:92%;max-width:540px;max-height:88vh;overflow:auto;box-shadow:var(--shadow);animation:fi .25s ease}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15px;font-weight:700}
.modal-body{padding:20px}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{padding:10px 12px;text-align:left;color:var(--textMut);font-weight:600;font-size:10px;white-space:nowrap;border-bottom:2px solid var(--border)}
.tbl td{padding:8px 12px;border-bottom:1px solid rgba(30,39,56,.3)}
.tbl tr:hover{background:rgba(255,255,255,.02)}

/* RICH EDITOR */
.rich-editor{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.rich-toolbar{display:flex;gap:2px;padding:4px 8px;background:var(--bg);border-bottom:1px solid var(--border)}
.rich-toolbar button{background:none;border:none;color:var(--textSec);padding:2px 6px;border-radius:4px;font-size:13px}
.rich-content{padding:9px 12px;min-height:60px;color:var(--text);font-size:13px;outline:none;background:var(--bg)}

/* FILTER BAR */
.filter-bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 20px;margin-bottom:20px}
.filter-bar label{font-size:11px;color:var(--textSec)}
.filter-bar input[type=date]{width:150px;padding:6px 10px;font-size:12px}
.pill-btn{padding:6px 16px;border-radius:20px;border:none;font-size:12px;font-weight:600;font-family:var(--font)}

/* SCHEDULE */
.sched-table{border-collapse:collapse;font-size:11px;min-width:800px}
.sched-table th{padding:5px 3px;text-align:center;font-size:9px;font-weight:600;color:var(--textMut)}
.sched-table td{padding:1px;text-align:center}
.sched-cell{width:24px;height:20px;border-radius:3px;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:8px;font-weight:700;color:white}
.sched-select{width:24px;height:20px;border:none;border-radius:3px;font-size:8px;font-weight:700;color:white;cursor:pointer;text-align:center;padding:0}
.sched-name{padding:5px 10px!important;font-weight:600;font-size:11px;text-align:left!important;position:sticky;left:0;background:var(--card);z-index:1}
.sched-name-head{min-width:75px;text-align:left!important;position:sticky;left:0;background:var(--card);z-index:2}

/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;z-index:99999;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:var(--shadow);animation:fi .25s ease;display:none}
.toast.show{display:block}
.toast.success{background:#064e3b;border:1px solid rgba(16,185,129,.2)}
.toast.error{background:#7f1d1d;border:1px solid rgba(239,68,68,.2)}

/* GAUGE */
.gauge-wrap{text-align:center}
.gauge-label{font-size:12px;font-weight:700;margin-top:4px}

/* LOADING */
.loading-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:16px}
.loading-bar .fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--green));animation:loadAni 1.5s ease infinite;width:40%;border-radius:2px}
@keyframes loadAni{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

/* SYNC INDICATOR */
.sync-spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Responsive */
@media(max-width:1200px){.grid-6{grid-template-columns:repeat(3,1fr)}.grid-5{grid-template-columns:repeat(3,1fr)}.grid-3{grid-template-columns:1fr 1fr}}
@media(max-width:768px){
  .sidebar{position:fixed;z-index:200;width:230px;left:0;top:0;transform:translateX(-100%);transition:transform .3s ease}
  .sidebar.mobile-open{transform:translateX(0)}
  .sidebar.collapsed{transform:translateX(-100%);width:230px}
  .mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:199}
  .mobile-overlay.show{display:block}
  .mobile-ham{display:flex!important}
  .main{padding:14px 12px}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .grid-6,.grid-5,.grid-4{grid-template-columns:repeat(2,1fr)}
  .header{flex-direction:column;align-items:flex-start;gap:8px}
  .filter-bar{flex-direction:column;align-items:flex-start;gap:10px}
}
</style>
</head>
<body>

<!-- ═══════ SIDEBAR ═══════ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">🛡️</div>
    <div class="logo-text">
      <div style="font-size:13px;font-weight:800;color:var(--amber)">Safety</div>
      <div style="font-size:10px;color:var(--textMut)">E-System</div>
    </div>
  </div>
  <nav id="navContainer"></nav>
  <div class="sidebar-footer">
    <button class="admin-btn off" id="adminBtn" onclick="toggleAdmin()">🔒 <span class="admin-label">管理員登入</span></button>
    <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
  </div>
</aside>

<!-- ═══════ MAIN ═══════ -->
<div class="mobile-overlay" id="mobileOverlay" onclick="closeMobile()"></div>
<div class="main">
  <header class="header">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="mobile-ham" id="hamBtn" onclick="openMobile()" style="display:none;background:none;border:none;color:var(--amber);padding:6px;font-size:22px;line-height:1">☰</button>
      <div>
        <h1 id="pageTitle">首頁 Home</h1>
        <p class="header-sub">NMDC Energy — Tongxiao Power Plant Phase II · <span id="todayDate"></span> <span id="sheetStatus" style="margin-left:8px"></span> <span id="gasStatus" style="margin-left:6px"></span></p>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <div id="adminBadge" style="display:none"><span class="badge" style="color:var(--green);background:var(--greenBg)">ADMIN</span></div>
      <button class="btn btn-def btn-sm" onclick="refreshAll()" title="重新整理資料">🔄 重新整理</button>
    </div>
  </header>

  <!-- PAGES -->
  <div class="page" id="page-home"></div>
  <div class="page" id="page-dashboard" hidden></div>
  <div class="page" id="page-deficiency" hidden></div>
  <div class="page" id="page-documents" hidden></div>
  <div class="page" id="page-tools" hidden></div>
  <div class="page" id="page-tracking" hidden></div>
  <div class="page" id="page-schedule" hidden></div>
</div>

<!-- ═══════ LOGIN MODAL ═══════ -->
<div class="modal-overlay" id="loginModal">
  <div class="modal" style="max-width:360px" onclick="event.stopPropagation()">
    <div class="modal-head"><h3>🔐 管理員登入</h3><button class="btn-ghost" onclick="closeModal('loginModal')">✕</button></div>
    <div class="modal-body">
      <p style="font-size:12px;color:var(--textSec);margin-bottom:14px">登入以啟用編輯功能</p>
      <div class="field"><label>帳號</label><input class="inp" id="loginUser" placeholder="帳號"></div>
      <div class="field"><label>密碼</label><input class="inp" id="loginPass" type="password" placeholder="密碼" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <p id="loginErr" style="color:var(--red);font-size:12px;margin-bottom:10px;display:none"></p>
      <button class="btn btn-pri" style="width:100%;justify-content:center" onclick="doLogin()">🔓 登入</button>
    </div>
  </div>
</div>

<!-- ═══════ GENERIC MODAL ═══════ -->
<div class="modal-overlay" id="genModal" onclick="closeModal('genModal')">
  <div class="modal" id="genModalBox" onclick="event.stopPropagation()">
    <div class="modal-head"><h3 id="genModalTitle"></h3><button class="btn-ghost" onclick="closeModal('genModal')">✕</button></div>
    <div class="modal-body" id="genModalBody"></div>
  </div>
</div>

<!-- ═══════ TOAST ═══════ -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════
const SHEET1_ID = "19KlNuUTQO4_qzP6mYEAxh97La-RjjcvpyMC5c8K7Pj8";  // 數據源（唯讀）
const SHEET2_ID = "1AnSjD28WmpLRoDcUPWuyl5tPfU5Qt4cFiP0oaoLBFCg";  // 系統資料（讀寫）

let TEAM = ["Sam","Daniel","Yong","Jin","Ben","Elson","Jeffrey","Vic","Noah","Jet","Sue"];
const CONTRACTORS = ["海義 HiE","美綺 Magitech","高虎 GAC","兆濰/茂富","天力 Tianli"];
const LOCATIONS = ["台中 Taichung","通霄 Tongxiao","天力 Tianli","離岸 Offshore"];
const DEF_CATS = ["高處作業","吊掛作業","電氣安全","侷限空間","開挖作業","火災爆炸","機具安全","個人防護","環境整潔","交通管理","工作許可","施工架","其他"];
const PAL = ["#f59e0b","#3b82f6","#10b981","#ef4444","#8b5cf6","#ec4899","#06b6d4","#84cc16","#f97316","#64748b"];
const SEV_KW = {critical:["死亡","墜落","倒塌","爆炸","觸電","collapse","electrocution"],major:["夾傷","截斷","骨折","缺少護欄","未繫安全帶","重大","嚴重"],minor:["未戴","未穿","標示","整潔","PPE","反光背心","安全帽"]};
const SEV_LABEL = {critical:"🔴 嚴重",major:"🟠 重大",minor:"🟡 輕微"};
const SEV_COLOR = {critical:"var(--red)",major:"#f97316",minor:"var(--amber)"};
const STATUS_COLOR = {open:"var(--red)","in-progress":"var(--blue)",closed:"var(--green)"};
const STATUS_LABEL = {open:"待改善","in-progress":"改善中",closed:"已結案"};
const SCHED_COLOR = {R:"#1d4ed8",H:"#dc2626","台":"#f59e0b","霄":"#10b981"};
const SCHED_LABEL = {R:"上班",H:"休假","台":"台中","霄":"通霄"};

let isAdmin = false;
let currentPage = "home";

// ═══════════════════════════════════════════════════════════════
// STATE — Sheet 2 data (synced via GAS)
// ═══════════════════════════════════════════════════════════════
let cloudData = {
  announcements: [],
  tracking: [],
  documents: [],
  schedule: []
};

// Local-only state (tools, custom team)
let localState = {
  tools: [{id:"tpc-def",name:"TPC 缺失單新增",desc:"新增TPC安全缺失改善單",icon:"⚠️",color:"var(--red)",type:"builtin"},{id:"sling-calc",name:"吊掛張力計算器",desc:"Sling Tension Calculator",icon:"🔧",color:"var(--purple)",type:"builtin"},{id:"gas-url",name:"GAS URL 設定",desc:"連接 Google Apps Script",icon:"🔗",color:"var(--textSec)",type:"builtin"}],
  customTeam: null
};

function saveLocal(){try{localStorage.setItem('safety_es_local',JSON.stringify(localState))}catch{}}
function loadLocal(){try{const s=localStorage.getItem('safety_es_local');if(s){const d=JSON.parse(s);Object.assign(localState,d);if(localState.customTeam)TEAM=localState.customTeam;}}catch{}}

// ═══════════════════════════════════════════════════════════════
// GOOGLE APPS SCRIPT API (Sheet 2 — read/write)
// ═══════════════════════════════════════════════════════════════
function getGasUrl(){return localStorage.getItem('gasUrl')||''}

let gasConnected = false;

async function gasRead(tab) {
  const url = getGasUrl();
  if (!url) return null;
  try {
    const resp = await fetch(url + '?action=read&tab=' + encodeURIComponent(tab));
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    return data.data || data;
  } catch(e) {
    console.error('GAS read error ['+tab+']:', e);
    return null;
  }
}

async function gasWrite(tab, payload) {
  const url = getGasUrl();
  if (!url) { toast('請先設定 GAS URL','error'); return false; }
  try {
    const resp = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type':'text/plain'},
      body: JSON.stringify({action:'write', tab, data: payload})
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    return true;
  } catch(e) {
    console.error('GAS write error ['+tab+']:', e);
    toast('寫入失敗: '+e.message,'error');
    return false;
  }
}

async function loadSheet2Data() {
  const statusEl = document.getElementById('gasStatus');
  const url = getGasUrl();
  if (!url) {
    statusEl.innerHTML = '<span style="color:var(--textMut)">GAS 未設定</span>';
    gasConnected = false;
    return;
  }
  statusEl.innerHTML = '<span style="color:var(--amber)"><span class="sync-spin">⟳</span> GAS連線中...</span>';
  try {
    const [ann, trk, docs, sched] = await Promise.all([
      gasRead('announcements'),
      gasRead('tracking'),
      gasRead('documents'),
      gasRead('schedule')
    ]);
    if (ann) cloudData.announcements = ann;
    if (trk) cloudData.tracking = trk;
    if (docs) cloudData.documents = docs;
    if (sched) cloudData.schedule = sched;
    gasConnected = true;
    statusEl.innerHTML = '<span style="color:var(--green)">● GAS 已連線</span>';
  } catch(e) {
    console.error('Sheet2 load error:', e);
    gasConnected = false;
    statusEl.innerHTML = '<span style="color:var(--red)">● GAS 連線失敗</span>';
  }
}

// Fallback: read Sheet 2 via Google Visualization API (read-only)
async function loadSheet2Fallback() {
  const statusEl = document.getElementById('gasStatus');
  try {
    const [annGviz, trkGviz, docsGviz, schedGviz] = await Promise.all([
      loadSheetJsonp('announcements', SHEET2_ID),
      loadSheetJsonp('tracking', SHEET2_ID),
      loadSheetJsonp('documents', SHEET2_ID),
      loadSheetJsonp('schedule', SHEET2_ID)
    ]);
    if (annGviz && annGviz.table) cloudData.announcements = gvizToObjects(annGviz.table);
    if (trkGviz && trkGviz.table) cloudData.tracking = gvizToObjects(trkGviz.table);
    if (docsGviz && docsGviz.table) cloudData.documents = gvizToObjects(docsGviz.table);
    if (schedGviz && schedGviz.table) cloudData.schedule = gvizToObjects(schedGviz.table);
    if (!gasConnected) statusEl.innerHTML = '<span style="color:var(--cyan)">● Sheet2 唯讀</span>';
  } catch(e) {
    console.error('Sheet2 fallback error:', e);
    if (!gasConnected) statusEl.innerHTML = '<span style="color:var(--red)">● Sheet2 載入失敗</span>';
  }
}

// Generic GViz to object array (uses labels as keys)
function gvizToObjects(table) {
  // GViz may return labels or column IDs; prefer labels
  let keys = table.cols.map(c => (c.label || '').trim());
  // If all labels are empty, use column IDs
  if (keys.every(k => !k)) keys = table.cols.map(c => (c.id || '').trim());
  // If labels look like column IDs (A,B,C) and first row has text, use first row as header
  const allColIds = keys.every(k => /^[A-Z]{1,2}$/.test(k));
  let startRow = 0;
  if (allColIds && table.rows.length > 0) {
    const firstRow = table.rows[0];
    const firstVals = firstRow.c.map(c => c && c.v != null ? String(c.v).trim() : '');
    if (firstVals.some(v => v && !/^\d+$/.test(v))) {
      keys = firstVals;
      startRow = 1;
    }
  }
  const result = [];
  for (let r = startRow; r < table.rows.length; r++) {
    const row = table.rows[r];
    const obj = {};
    row.c.forEach((cell, i) => {
      if (!cell || cell.v === null || cell.v === undefined) return;
      let val = cell.v;
      const key = keys[i];
      if (!key) return;
      if (typeof val === 'string' && val.startsWith('Date(')) val = parseGvizDate(val);
      obj[key] = val;
    });
    if (Object.keys(obj).length > 0) result.push(obj);
  }
  return result;
}

let gsheetData = {allData:[], socRaw:[], tpcRaw:[], manpowerData:[], tbmByDate:{}, workingDaysByDate:{}, totalPeopleByDate:{}, totalHoursByDate:{}, incidentData:{}, socSubcontractors:new Set()};
let sheetLoaded = false;
let sheetLoadError = false;

// ── JSONP loader ──
let _jsonpCounter = 0;
function loadSheetJsonp(sheetName, sheetId) {
  const sid = sheetId || SHEET1_ID;
  return new Promise((resolve, reject) => {
    const cbName = '_gviz_cb_' + (++_jsonpCounter) + '_' + Date.now();
    const timeout = setTimeout(() => {
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      reject(new Error('JSONP timeout for ' + sheetName));
    }, 15000);
    window[cbName] = function(resp) {
      clearTimeout(timeout);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      resolve(resp);
    };
    const url = `https://docs.google.com/spreadsheets/d/${sid}/gviz/tq?tqx=responseHandler:${cbName}&sheet=${encodeURIComponent(sheetName)}`;
    const script = document.createElement('script');
    script.src = url;
    script.onerror = () => { clearTimeout(timeout); delete window[cbName]; if (script.parentNode) script.parentNode.removeChild(script); reject(new Error('Script load error for ' + sheetName)); };
    document.head.appendChild(script);
  });
}

function parseGvizDate(val) {
  if (val === null || val === undefined) return '';
  if (typeof val === 'string' && val.startsWith('Date(')) {
    const parts = val.replace('Date(','').replace(')','').split(',').map(Number);
    return new Date(parts[0], parts[1], parts[2]||1).toISOString().slice(0,10);
  }
  if (typeof val === 'number') return new Date((val - 25569) * 86400000).toISOString().slice(0,10);
  return String(val);
}

// ── Convert SOC table ──
function gvizToFormRows(gvizTable) {
  const LABEL_MAP = {
    'filled date':'filled_date','填寫日期':'filled_date',
    'observation type':'observation_type','觀察種類':'observation_type',
    'observed subcontractor':'observed_subcontractor','觀察到的承攬商':'observed_subcontractor',
    'location':'location','地點':'location',
    'hazard type':'hazard_type','危害種類':'hazard_type',
    'lsr violated':'LSR_violated','保命原則':'LSR_violated',
    'dercription':'description','description':'description','描述':'description','優點':'description',
    'already been solved':'already_solved','已經解決':'already_solved',
    'operation':'operation','工作內容':'operation',
  };
  const colKeys = gvizTable.cols.map(c => {
    const lbl = (c.label || '').toLowerCase();
    for (const [kw, key] of Object.entries(LABEL_MAP)) { if (lbl.includes(kw.toLowerCase())) return key; }
    return c.id;
  });
  return gvizTable.rows.map(row => {
    const obj = {};
    row.c.forEach((cell, i) => {
      if (!cell) return;
      let val = cell.v;
      if (val === null || val === undefined) return;
      const key = colKeys[i];
      if (key === 'filled_date') val = parseGvizDate(val);
      obj[key] = val;
    });
    return obj;
  });
}

// ── Convert TPC NCR table ──
function gvizToTpcRows(gvizTable) {
  const TPC_LABEL_MAP = {
    '開單日期':'issue_date','開立單位':'issuer','主辦組':'department',
    '巡檢類型':'inspection_type','管登編號':'ncr_no','承攬商':'contractor',
    '開立總類':'issue_category','其他':'other_category','內容':'description',
    '缺失種類':'defect_type','罰款金額':'penalty_amount',
    '是否結案':'is_closed','結案日期':'close_date',
  };
  const colKeys = gvizTable.cols.map(c => {
    const lbl = (c.label || '').trim();
    for (const [kw, key] of Object.entries(TPC_LABEL_MAP)) { if (lbl.includes(kw)) return key; }
    return c.id;
  });
  return gvizTable.rows.map(row => {
    const obj = {};
    row.c.forEach((cell, i) => {
      if (!cell) return;
      let val = cell.v;
      if (val === null || val === undefined) return;
      const key = colKeys[i];
      if (key === 'issue_date' || key === 'close_date') val = parseGvizDate(val);
      obj[key] = val;
    });
    return obj;
  });
}

// ── Convert manpower table ──
function gvizToManpowerData(gvizTable) {
  const rows = gvizTable.rows;
  if (rows.length < 2) return [];
  const dateRow = rows[0];
  const dateMap = {};
  dateRow.c.forEach((cell, i) => {
    if (i === 0 || !cell || cell.v === null) return;
    dateMap[i] = parseGvizDate(cell.v);
  });
  const result = [];
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    const companyCell = row.c[0];
    const company = companyCell ? String(companyCell.v || '') : '';
    if (!company) continue;
    const dailyData = {};
    row.c.forEach((cell, i) => {
      if (i === 0 || !dateMap[i] || !cell) return;
      const cnt = parseFloat(cell.v) || 0;
      dailyData[dateMap[i]] = cnt;
    });
    result.push({ company, dailyData });
  }
  return result;
}

function getDefectCategory(t) {
  if (!t) return null;
  const s = (t+'').toLowerCase();
  if (s.includes('不安全條件') || s.includes('unsafe condition')) return 'Condition';
  if (s.includes('不安全行為') || s.includes('unsafe action')) return 'Action';
  if (s.includes('優點') || s.includes('good practice')) return 'Positive';
  return null;
}

async function loadGoogleSheetData() {
  const statusEl = document.getElementById('sheetStatus');
  statusEl.innerHTML = '<span style="color:var(--amber);animation:pulse 1s infinite">● 連線中...</span>';
  try {
    const [socGviz, tpcGviz, mpGviz] = await Promise.all([
      loadSheetJsonp('SOC'),
      loadSheetJsonp('TPC NCR'),
      loadSheetJsonp('manpower')
    ]);
    if (socGviz.status === 'error' || tpcGviz.status === 'error' || mpGviz.status === 'error') throw new Error('GViz query error');

    const socRows = gvizToFormRows(socGviz.table);
    const tpcRows = gvizToTpcRows(tpcGviz.table);
    const mpData  = gvizToManpowerData(mpGviz.table);

    gsheetData.socRaw = socRows;
    gsheetData.tpcRaw = tpcRows;
    processSheetData(socRows, tpcRows, mpData);

    sheetLoaded = true;
    statusEl.innerHTML = `<span style="color:var(--green)">● 雲端已連線</span> <span style="font-size:10px;color:var(--textMut)">(SOC:${socRows.length} TPC:${tpcRows.length} MP:${mpData.length})</span>`;
    toast('Google Sheet 資料載入完成 ✓');
    renderPage(currentPage);
  } catch(err) {
    console.error('Sheet load error:', err);
    sheetLoadError = true;
    statusEl.innerHTML = '<span style="color:var(--red)">● 連線失敗</span> <span style="font-size:10px;color:var(--textMut)">(使用本地資料)</span>';
  }
}

function processSheetData(socRows, tpcRows, mpData) {
  const g = gsheetData;
  g.allData=[]; g.manpowerData=[]; g.tbmByDate={}; g.workingDaysByDate={}; g.totalPeopleByDate={}; g.totalHoursByDate={}; g.incidentData={}; g.socSubcontractors=new Set();
  const INCIDENT_KEYS = ['Recordable incidents','LTI cases','Lost days','Near Miss','Fatalities'];

  socRows.forEach((row, idx) => {
    const sub = row.observed_subcontractor || '';
    if (sub) g.socSubcontractors.add(sub);
    const obsType = row.observation_type || '';
    const dc = getDefectCategory(obsType);
    const solved = row.already_solved === true || String(row.already_solved).toLowerCase() === 'true';
    const lsrRaw = String(row.LSR_violated || '').toLowerCase();
    const lsrViolated = lsrRaw === 'true' || lsrRaw.includes('是') || lsrRaw.includes('yes');
    const hazType = row.hazard_type || '';
    const desc = row.description || '';
    g.allData.push({
      id:'SOC-'+idx, date:row.filled_date||'', type:dc==='Positive'?'優點':'缺點',
      defectCategory:dc, subcontractor:sub, category:hazType, location:row.location||'',
      description:desc, solved, lsr:lsrViolated, source:'SOC',
      isPTWViolation: hazType.includes('工作許可') || desc.toLowerCase().includes('ptw') || desc.includes('工作許可'),
      rawRow: row
    });
  });

  tpcRows.forEach((row, idx) => {
    let contractor = row.contractor || '';
    let matchedSub = contractor;
    g.socSubcontractors.forEach(s => {
      if ((contractor.includes('兆濰')&&s.includes('兆濰'))||(contractor.includes('茂富')&&s.includes('茂富'))||
          (contractor.includes('NMDC')&&s.includes('NMDC'))||(contractor.includes('安達希')&&s.includes('NMDC'))||
          (contractor.includes('環海')&&s.includes('環海'))||(contractor.includes('EGS')&&s.includes('EGS'))||
          (contractor.includes('海義')&&s.includes('海義'))||(contractor.includes('HiE')&&s.includes('HiE'))||
          (contractor.includes('高虎')&&s.includes('高虎'))||(contractor.includes('GAC')&&s.includes('GAC'))||
          (contractor.includes('美綺')&&s.includes('美綺'))||(contractor.includes('天力')&&s.includes('天力'))) matchedSub = s;
    });

    let penaltyAmount = 0;
    if (row.penalty_amount) penaltyAmount = parseFloat(String(row.penalty_amount).replace(/[^\d.]/g,'')) || 0;

    const issueCat = row.issue_category || '';
    let type = '缺點', dc = 'Condition';
    if (issueCat.includes('罰單')) type = '罰單';
    else if (issueCat.includes('優點') || issueCat.includes('Good practice')) { type = '優點'; dc = 'Positive'; }
    if (issueCat.includes('不安全行為') || issueCat.includes('Unsafe action')) dc = 'Action';
    if (issueCat.includes('不安全條件') || issueCat.includes('Unsafe condition')) dc = 'Condition';

    const defectType = row.defect_type || row.other_category || '';
    const desc = row.description || '';
    const dtStr = defectType.toLowerCase();
    const isClosed = row.is_closed === '是' || row.is_closed === true || String(row.is_closed).includes('是');

    g.allData.push({
      id:'TPC-'+idx, date:row.issue_date||'', type, defectCategory:dc,
      subcontractor:matchedSub||contractor, category:defectType, location:'',
      description:desc, solved:isClosed, lsr:false,
      penaltyAmount, ncrNo:row.ncr_no||'', source:'TPC NCR',
      isPTWViolation: dtStr.includes('工作許可') || dtStr.includes('ptw') || dtStr.includes('permit'),
      rawRow: row
    });
  });

  mpData.forEach(item => {
    const cname = item.company;
    if (!cname) return;
    const isTBM = cname === 'TBM 次數';
    const isTotal = cname === 'TOTAL';
    const isTotalHours = cname === 'TOTAL HOURS';
    const isIncident = INCIDENT_KEYS.includes(cname);
    Object.entries(item.dailyData).forEach(([dateStr, cnt]) => {
      if (isTBM) { g.tbmByDate[dateStr] = (g.tbmByDate[dateStr]||0) + cnt; }
      else if (isTotalHours) { g.totalHoursByDate[dateStr] = cnt; }
      else if (isIncident) { if (!g.incidentData[cname]) g.incidentData[cname] = {}; g.incidentData[cname][dateStr] = cnt; }
      else if (isTotal) { g.totalPeopleByDate[dateStr] = cnt; }
      else {
        if (cnt > 0) {
          g.manpowerData.push({ company: cname, date: dateStr, count: cnt });
          if (!g.workingDaysByDate[dateStr]) g.workingDaysByDate[dateStr] = 0;
          g.workingDaysByDate[dateStr] += cnt;
        }
      }
    });
  });
}

// KPI CALCULATION ENGINE (ported from v2.4)
// ═══════════════════════════════════════════════════════════════
function calcKPI(startDate, endDate, source, subFilter, locFilter, dcFilter) {
  if (!sheetLoaded) return getFallbackKPI();
  const g = gsheetData;
  let base = g.allData.filter(item =>
    item.date >= startDate && item.date <= endDate &&
    (source === 'All' || item.source === source) &&
    (subFilter === 'All' || item.subcontractor === subFilter) &&
    (locFilter === 'All' || item.location === locFilter)
  );
  const allDefects = base.filter(d => d.type === '缺點' || d.type === '罰單');
  const condDef = allDefects.filter(d => d.defectCategory === 'Condition');
  const actDef  = allDefects.filter(d => d.defectCategory === 'Action');
  let filtered = dcFilter && dcFilter !== 'All' ? base.filter(i => i.type === '優點' || i.defectCategory === dcFilter) : base;
  const defects   = filtered.filter(d => d.type === '缺點' || d.type === '罰單');
  const positives = filtered.filter(d => d.type === '優點');
  const closed    = defects.filter(d => d.solved);
  const socDef    = filtered.filter(d => d.source === 'SOC' && (d.type === '缺點' || d.type === '罰單'));
  const tpcDef    = filtered.filter(d => d.source === 'TPC NCR' && (d.type === '缺點' || d.type === '罰單'));
  const tpcPen    = filtered.filter(d => d.source === 'TPC NCR' && d.type === '罰單');
  const lsrViol   = defects.filter(d => d.lsr);

  let totalPenalty = 0;
  tpcPen.forEach(i => totalPenalty += parseFloat(i.penaltyAmount) || 0);
  const closureRate = defects.length > 0 ? (closed.length / defects.length) * 100 : 0;

  const ptwViolations = allDefects.filter(d => d.isPTWViolation).length;
  const ptwRate = allDefects.length > 0 ? Math.max(0, (1 - ptwViolations / allDefects.length) * 100) : 100;

  const workDays = Object.keys(g.workingDaysByDate).filter(d => d >= startDate && d <= endDate);
  const tbmDays = workDays.filter(d => (g.tbmByDate[d] || 0) >= 1);
  const tbmRate = workDays.length > 0 ? (tbmDays.length / workDays.length) * 100 : 0;

  let totalPeople = 0;
  Object.entries(g.totalPeopleByDate).forEach(([date, val]) => { if (date >= startDate && date <= endDate) totalPeople += val; });
  const totalHours = totalPeople * 8;
  function sumIncident(key) {
    if (!g.incidentData[key]) return 0;
    return Object.entries(g.incidentData[key]).filter(([d]) => d >= startDate && d <= endDate).reduce((s, [, v]) => s + v, 0);
  }
  const rec=sumIncident('Recordable incidents'),lti=sumIncident('LTI cases'),lost=sumIncident('Lost days'),nm=sumIncident('Near Miss'),fat=sumIncident('Fatalities');
  const calcRate = (n, mul) => totalHours > 0 ? (n * mul / totalHours) : 0;
  const trir=calcRate(rec,200000),ltir=calcRate(lti,200000),severity=calcRate(lost,200000),nmRate=calcRate(nm,200000),far=calcRate(fat,100000000);

  const catStats = {};
  defects.forEach(item => { if (!item.category) return; if (!catStats[item.category]) catStats[item.category]={total:0,condition:0,action:0}; catStats[item.category].total++; if(item.defectCategory==='Condition')catStats[item.category].condition++; else if(item.defectCategory==='Action')catStats[item.category].action++; });
  const socByCategory = Object.entries(catStats).map(([name, v]) => ({name, value:v.total, condition:v.condition, action:v.action})).sort((a,b) => b.value - a.value);

  const monthlyStats = {};
  base.forEach(item => { if (item.date && (item.type === '缺點' || item.type === '罰單')) { const m = item.date.substring(0,7); if (!monthlyStats[m]) monthlyStats[m] = {soc:0,ncr:0}; if(item.source==='SOC')monthlyStats[m].soc++; else monthlyStats[m].ncr++; }});
  const monthly = Object.entries(monthlyStats).sort((a,b)=>a[0].localeCompare(b[0])).map(([m, v]) => ({m, soc:v.soc, ncr:v.ncr}));

  const subStats = {};
  filtered.forEach(item => {
    if (item.subcontractor && (item.type === '缺點' || item.type === '罰單')) {
      if (!subStats[item.subcontractor]) subStats[item.subcontractor] = {name:item.subcontractor,soc:0,ncr:0,cond:0,act:0,closed:0,total:0};
      subStats[item.subcontractor].total++;
      if(item.defectCategory==='Condition')subStats[item.subcontractor].cond++; else if(item.defectCategory==='Action')subStats[item.subcontractor].act++;
      if(item.solved)subStats[item.subcontractor].closed++;
      if(item.source==='SOC')subStats[item.subcontractor].soc++; else subStats[item.subcontractor].ncr++;
    }
  });
  const contractorRank = Object.values(subStats).filter(i=>i.total>0).map(c=>({...c,score:c.total>0?Math.round((c.closed/c.total)*100):0})).sort((a,b)=>b.score-a.score);

  const mpFiltered = g.manpowerData.filter(i => i.date >= startDate && i.date <= endDate);
  const mpByCompany = {};
  mpFiltered.forEach(item => { if(!mpByCompany[item.company])mpByCompany[item.company]={name:item.company,total:0,max:0,days:new Set()}; mpByCompany[item.company].total+=item.count; mpByCompany[item.company].max=Math.max(mpByCompany[item.company].max,item.count); mpByCompany[item.company].days.add(item.date); });
  const manpower = Object.values(mpByCompany).map(c=>({name:c.name,avg:c.days.size>0?Math.round(c.total/c.days.size):0,max:c.max,hours:c.total*8})).sort((a,b)=>b.hours-a.hours);

  const openCond=condDef.filter(d=>!d.solved).length,openAct=actDef.filter(d=>!d.solved).length;
  const closedCond=condDef.filter(d=>d.solved).length,closedAct=actDef.filter(d=>d.solved).length;

  return {
    summary:{totalSOC:socDef.length,totalNCR:tpcDef.length,totalDefects:defects.length,positives:positives.length,closureRate,manpower:totalPeople,safeHours:totalHours,trir,ltir,far,nearMissRate:nmRate,severityRate:severity,penaltyAmount:totalPenalty,conditionOpen:openCond,conditionClosed:closedCond,actionOpen:openAct,actionClosed:closedAct,lsrViolations:lsrViol.length,rec,lti,lost,nm,fat,totalPeople,totalHours},
    ncrClosure:closureRate, ptwCompliance:ptwRate, tbmRate,
    socByCategory, monthly, contractorRank, manpower,
    monthlyManpower: calcMonthlyManpowerByLocation(startDate, endDate)
  };
}

function calcMonthlyManpowerByLocation(startDate, endDate) {
  const g = gsheetData;
  const monthData = {};
  g.manpowerData.forEach(item => {
    if (item.date < startDate || item.date > endDate) return;
    const m = item.date.substring(0, 7);
    if (!monthData[m]) monthData[m] = {taichung:0,tongxiao:0,unassigned:0};
    const cn = (item.company||'').toLowerCase();
    if (cn.includes('台中')||cn.includes('taichung')) monthData[m].taichung += item.count;
    else if (cn.includes('通霄')||cn.includes('tongxiao')||cn.includes('tunghsiao')) monthData[m].tongxiao += item.count;
    else monthData[m].unassigned += item.count;
  });
  return Object.entries(monthData).sort((a,b)=>a[0].localeCompare(b[0])).map(([m, v]) => {
    const halfUp = Math.ceil(v.unassigned / 2), halfDown = Math.floor(v.unassigned / 2);
    return {month:m, taichung:v.taichung+halfUp, tongxiao:v.tongxiao+halfDown};
  });
}

function getFallbackKPI() {
  return {summary:{totalSOC:0,totalNCR:0,totalDefects:0,positives:0,closureRate:0,manpower:0,safeHours:0,trir:0,ltir:0,far:0,nearMissRate:0,severityRate:0,penaltyAmount:0,conditionOpen:0,conditionClosed:0,actionOpen:0,actionClosed:0,lsrViolations:0,rec:0,lti:0,lost:0,nm:0,fat:0,totalPeople:0,totalHours:0},ncrClosure:0,ptwCompliance:0,tbmRate:0,socByCategory:[],monthly:[],contractorRank:[],manpower:[],monthlyManpower:[]};
}

function getDateRange() {
  if (sheetLoaded) {
    const allDates = [...gsheetData.allData.map(d=>d.date),...Object.keys(gsheetData.totalPeopleByDate)].filter(d => d && d.length >= 10).sort();

  }
  return {start:'2025-04-01', end:new Date().toISOString().slice(0,10)};
}

function buildNav(){
  document.getElementById('navContainer').innerHTML=NAV.map(n=>
    `<button class="nav-btn${n.id===currentPage?' active':''}" onclick="goPage('${n.id}')">${n.icon} <span class="nav-label">${n.label}</span></button>`
  ).join('');
}
function goPage(id){
  if(window.innerWidth<=768) closeMobile();
  currentPage=id;
  NAV.forEach(n=>{const el=document.getElementById('page-'+n.id);if(el)el.hidden=n.id!==id});
  document.getElementById('pageTitle').textContent=NAV.find(n=>n.id===id)?.label||'';
  buildNav(); renderPage(id);
}
function toggleSidebar(){if(window.innerWidth<=768){closeMobile();return;}document.getElementById('sidebar').classList.toggle('collapsed')}
function openMobile(){var sb=document.getElementById('sidebar');sb.classList.remove('collapsed');sb.classList.add('mobile-open');document.getElementById('mobileOverlay').classList.add('show')}
function closeMobile(){document.getElementById('sidebar').classList.remove('mobile-open');document.getElementById('mobileOverlay').classList.remove('show')}
function checkMobile(){var btn=document.getElementById('hamBtn');if(btn)btn.style.display=window.innerWidth<=768?'flex':'none';if(window.innerWidth>768){document.getElementById('sidebar').classList.remove('mobile-open');document.getElementById('mobileOverlay').classList.remove('show')}}

function statCard(icon,label,value,sub,color){
  return `<div class="card stat-card"><div class="stat-icon" style="background:${color}15;color:${color}">${icon}</div><div><div class="stat-label">${label}</div><div class="stat-value">${value}</div>${sub?`<div class="stat-sub">${sub}</div>`:''}</div></div>`;
}
function gaugeCard(label,value,max,color){
  const pct=Math.min(value/max,1);const r=40;const c=2*Math.PI*r;const d=pct*c*.75;
  return `<div class="card" style="padding:14px;text-align:center"><svg width="100" height="70" viewBox="0 0 100 70">
    <circle cx="50" cy="55" r="${r}" fill="none" stroke="var(--border)" stroke-width="7" stroke-dasharray="${c*.75} ${c*.25}" stroke-linecap="round" transform="rotate(135 50 55)"/>
    <circle cx="50" cy="55" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-dasharray="${d} ${c}" stroke-linecap="round" transform="rotate(135 50 55)"/>
    <text x="50" y="48" text-anchor="middle" fill="var(--text)" style="font-size:16px;font-weight:700;font-family:var(--mono)">${max>10?value.toFixed(1):value.toFixed(2)}</text>
    <text x="50" y="62" text-anchor="middle" fill="var(--textMut)" style="font-size:8px">${max>10?'%':''}</text>
  </svg><div class="gauge-label">${label}</div></div>`;
}

function addDocItem_cloud(sec){

async function saveDocItem_cloud(sec){
  const c=document.getElementById('diCode').value,n=document.getElementById('diName').value,s=document.getElementById('diStatus').value,u=document.getElementById('diUrl').value;
  if(!c||!n)return;
  cloudData.documents.push({section:sec, code:c, name:n, status:s, fileUrl:u});
  if(gasConnected) await gasWrite('documents', cloudData.documents);
  closeModal('genModal');toast('已新增');renderDocuments();
}
function editCloudDoc(sec, idx){
  const docs = cloudData.documents.filter(d=>(d.section||d.sec)===sec);
  const doc = docs[idx]; if(!doc)return;
  showGenModal('編輯文件',`
    <div class="field"><label>編號</label><input class="inp" id="eiCode" value="${doc.code||''}"></div>
    <div class="field"><label>名稱</label><input class="inp" id="eiName" value="${doc.name||''}"></div>
    <div class="field"><label>狀態</label><select class="sel" id="eiStatus"><option value="complete"${doc.status==='complete'?' selected':''}>完整</option><option value="in-progress"${doc.status==='in-progress'?' selected':''}>更新中</option></select></div>
    <div class="field"><label>檔案連結</label><input class="inp" id="eiUrl" value="${doc.fileUrl||''}"></div>
    <button class="btn btn-pri" style="width:100%;justify-content:center" onclick="saveEditCloudDoc('${sec}',${idx})">儲存</button>`);
}
async function saveEditCloudDoc(sec, idx){
  const docs = cloudData.documents.filter(d=>(d.section||d.sec)===sec);
  const doc = docs[idx]; if(!doc)return;
  // Find the actual index in the flat array
  const realIdx = cloudData.documents.indexOf(doc);
  if(realIdx>=0){
    cloudData.documents[realIdx] = {section:sec, code:document.getElementById('eiCode').value, name:document.getElementById('eiName').value, status:document.getElementById('eiStatus').value, fileUrl:document.getElementById('eiUrl').value};
    if(gasConnected) await gasWrite('documents', cloudData.documents);
  }
  closeModal('genModal');toast('已更新');renderDocuments();
}
async function delCloudDoc(sec, idx){
  const docs = cloudData.documents.filter(d=>(d.section||d.sec)===sec);
  const doc = docs[idx]; if(!doc)return;
  const realIdx = cloudData.documents.indexOf(doc);
  if(realIdx>=0){
    cloudData.documents.splice(realIdx,1);
    if(gasConnected) await gasWrite('documents', cloudData.documents);
  }
  toast('已刪除');renderDocuments();
}

        <div style="display:flex;align-items:flex-start;gap:14px">
          <div style="width:42px;height:42px;border-radius:10px;background:${t.color||'var(--amber)'}15;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${t.icon||'🔧'}</div>
          <div><div style="font-size:13px;font-weight:700;margin-bottom:3px">${t.name}</div><div style="font-size:11px;color:var(--textMut)">${t.desc}</div></div>
        </div>

function saveGasUrl(){
  const url=document.getElementById('gasUrlInp').value.trim();
  localStorage.setItem('gasUrl',url);
  toast('已儲存');
  testGasConnection();
}
async function testGasConnection(){
  const el=document.getElementById('gasTestResult');
  el.innerHTML='<span style="color:var(--amber)"><span class="sync-spin">⟳</span> 測試中...</span>';
  try {
    const data = await gasRead('announcements');
    if(data !== null){
      el.innerHTML=`<span style="color:var(--green)">✅ 連線成功！取得 ${Array.isArray(data)?data.length:'?'} 筆公告</span>`;
      gasConnected = true;
      await loadSheet2Data();
      renderPage(currentPage);
    } else {
      el.innerHTML='<span style="color:var(--red)">❌ 連線失敗，請檢查 URL</span>';
    }
  } catch(e) {
    el.innerHTML=`<span style="color:var(--red)">❌ ${e.message}</span>`;
  }
}

function calcSling(){
  const load=+document.getElementById('sLoad').value,angle=+document.getElementById('sAngle').value,legs=+document.getElementById('sLegs').value;
  const f=1/Math.cos((angle/2)*Math.PI/180),tpl=(load/legs)*f;
  document.getElementById('slingResult').innerHTML=[{l:"放大係數",v:f.toFixed(3)+'×',c:'var(--amber)'},{l:"每條張力",v:tpl.toFixed(0)+'kg',c:'var(--blue)'},{l:"建議WLL",v:(tpl*2).toFixed(0)+'kg',c:'var(--green)'}].map(x=>`<div style="background:var(--bg);border-radius:8px;padding:14px;text-align:center"><div style="font-size:10px;color:var(--textMut);margin-bottom:4px">${x.l}</div><div style="font-size:20px;font-weight:800;color:${x.c};font-family:var(--mono)">${x.v}</div></div>`).join('');
  document.getElementById('slingWarn').innerHTML=angle>120?'<div style="margin-top:14px;padding:10px;background:var(--redBg);border-radius:8px;color:var(--red);font-size:11px;font-weight:600">⚠️ 夾角超過120°！</div>':'';
}

function addTool(){showGenModal('新增工具',`

  <div class="field"><label>說明</label><input class="inp" id="tlDesc" placeholder="描述"></div>

  <button class="btn btn-pri" style="width:100%;justify-content:center" onclick="saveTool()">新增工具</button>`);

function delTool(id){localState.tools=localState.tools.filter(t=>t.id!==id);saveLocal();renderTools();toast('已刪除')}

function renderTracking(){
  const trk = getTracking();
  const el=document.getElementById('page-tracking');

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:12px;color:var(--textSec)">共 ${trk.length} 項 · 待辦 ${trk.filter(t=>t.status==='pending').length} · 進行中 ${trk.filter(t=>t.status==='in-progress').length} · 完成 ${trk.filter(t=>t.status==='done').length}${gasConnected?' · <span style="color:var(--green)">● 雲端同步</span>':''}</div>

    </div>

          <div style="font-size:10px;color:var(--textMut);display:flex;gap:10px;flex-wrap:wrap"><span>👤 ${assignees.join(', ')}</span><span style="color:${od?'var(--red)':'var(--textMut)'}">📅 ${t.deadline||''}${od?' ⚠️':''}</span>${badge(t.priority==='high'?'高':t.priority==='medium'?'中':'低',t.priority==='high'?'var(--red)':t.priority==='medium'?'var(--amber)':'var(--green)')}</div>

// ─── ANNOUNCEMENTS CRUD (Sheet 2 via GAS) ────────────────────
function addAnnouncement(){
  showGenModal('📢 新增公告',`
    <div class="field"><label>公告內容</label><div class="rich-editor"><div class="rich-toolbar">
      <button onmousedown="event.preventDefault();document.execCommand('bold')"><b>B</b></button>
      <button onmousedown="event.preventDefault();document.execCommand('italic')"><i>I</i></button>

async function saveAnn(){
  const c=document.getElementById('annContent').innerHTML,p=document.getElementById('annPri').value;
  if(!c.trim())return;
  const newAnn = {id:Date.now(),date:today(),content:c,priority:p};
  cloudData.announcements.unshift(newAnn);
  if(gasConnected) await gasWrite('announcements', cloudData.announcements);
  closeModal('genModal');toast('公告已發布');renderPage(currentPage);
}
async function delAnn(id){
  cloudData.announcements = cloudData.announcements.filter(a=>String(a.id)!==String(id));
  if(gasConnected) await gasWrite('announcements', cloudData.announcements);
  renderPage(currentPage);toast('已刪除');
}

// ─── TRACKING CRUD (Sheet 2 via GAS) ─────────────────────────
function addTracking(){
  showGenModal('📋 新增追蹤事項',`
    <div class="field"><label>事項</label><input class="inp" id="trkItem" placeholder="事項內容..."></div>
    <div class="field"><label>負責人</label><div style="display:flex;flex-wrap:wrap;gap:4px" id="trkAssignees">${getTeam().map(p=>`<button class="pill-btn" style="background:transparent;border:1px solid var(--border);color:var(--textSec);font-size:11px" onclick="this.dataset.sel=this.dataset.sel==='1'?'':'1';this.style.background=this.dataset.sel==='1'?'var(--amberBg)':'transparent';this.style.color=this.dataset.sel==='1'?'var(--amber)':'var(--textSec)'" data-name="${p}">${p}</button>`).join('')}</div></div>
    <div class="field"><label>期限</label><input class="inp" type="date" id="trkDeadline"></div>
    <div class="field"><label>優先度</label><select class="sel" id="trkPri"><option value="high">🔴 高</option><option value="medium" selected>🟡 中</option><option value="low">🟢 低</option></select></div>
    <div class="field"><label>備註</label><div class="rich-editor"><div class="rich-toolbar"><button onmousedown="event.preventDefault();document.execCommand('bold')"><b>B</b></button><button onmousedown="event.preventDefault();document.execCommand('italic')"><i>I</i></button></div><div contenteditable class="rich-content" id="trkNote" data-placeholder="備註..."></div></div></div>
    <button class="btn btn-pri" style="width:100%;justify-content:center" onclick="saveTrk()">新增</button>`);
}
async function saveTrk(){
  const item=document.getElementById('trkItem').value;if(!item)return;
  const assignees=[...document.querySelectorAll('#trkAssignees button[data-sel="1"]')].map(b=>b.dataset.name);
  const newTrk = {id:Date.now(),item,assignees:assignees.join(','),deadline:document.getElementById('trkDeadline').value,priority:document.getElementById('trkPri').value,status:'pending',note:document.getElementById('trkNote').innerHTML};
  cloudData.tracking.unshift(newTrk);
  if(gasConnected) await gasWrite('tracking', cloudData.tracking);
  closeModal('genModal');toast('已新增');renderPage(currentPage);
}
async function cycleTrack(idx){
  const c={pending:'in-progress','in-progress':'done',done:'pending'};
  const trk=cloudData.tracking;
  if(trk[idx])trk[idx].status=c[trk[idx].status]||'pending';
  if(gasConnected) await gasWrite('tracking', cloudData.tracking);
  renderTracking();toast('已更新');
}
async function delTrack(idx){
  cloudData.tracking.splice(idx,1);
  if(gasConnected) await gasWrite('tracking', cloudData.tracking);
  renderTracking();toast('已刪除');
}

// ─── SCHEDULE (from Sheet 2 via GAS) ─────────────────────────
function renderSchedule(){
  const schedData = getScheduleData();
  const curMonth = document.getElementById('schedMonth')?.value || new Date().toISOString().slice(0,7);
  const year=parseInt(curMonth.split('-')[0]),mon=parseInt(curMonth.split('-')[1]);
  const dim=new Date(year,mon,0).getDate();

  // Build people array from schedule data or defaults
  let people = [];
  if (schedData.length > 0) {
    // Assume schedule data has: name, day1, day2, ..., day31 columns
    people = schedData.map(row => {
      const name = row.name || row['人員'] || '';
      const days = [];
      for (let d=1;d<=31;d++) {
        days.push(row['d'+d] || row[String(d)] || row['day'+d] || (new Date(year,mon-1,d).getDay()%6===0?'H':'R'));
      }
      return {name, days};
    });
  }
  if (people.length === 0) {
    people = TEAM.map(p => ({name:p, days:Array.from({length:31},(_,i)=>{const wd=new Date(year,mon-1,i+1).getDay();return wd===0||wd===6?"H":"R"})}));
  }

  const el=document.getElementById('page-schedule');
  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:10px">
        <input type="month" class="inp" id="schedMonth" value="${curMonth}" onchange="renderSchedule()" style="width:160px;padding:6px 10px">
        <div style="display:flex;gap:6px">${Object.entries(SCHED_LABEL).map(([k,v])=>`<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--textSec)"><span style="width:12px;height:12px;border-radius:3px;background:${SCHED_COLOR[k]};display:inline-block"></span>${v}</span>`).join('')}</div>
        ${gasConnected?'<span style="font-size:10px;color:var(--green)">● 雲端同步</span>':''}
      </div>
      ${isAdmin?'<div style="display:flex;gap:6px"><button class="btn btn-pri" onclick="addSchedulePerson()">+ 新增人員</button><button class="btn btn-def" onclick="addTeamMember()">👥 管理團隊</button></div>':''}
    </div>
    <div class="card" style="overflow:auto"><table class="sched-table">
      <thead><tr><th class="sched-name-head" style="padding:8px 10px">人員</th>
        ${Array.from({length:dim},(_,i)=>{const d=new Date(year,mon-1,i+1);const wd=d.getDay();return`<th style="color:${wd===0||wd===6?'var(--red)':'var(--textMut)'}">${i+1}<div style="font-size:7px">${'日一二三四五六'[wd]}</div></th>`}).join('')}
        ${isAdmin?'<th style="min-width:28px"></th>':''}
      </tr></thead>
      <tbody>${people.map((p,pi)=>`<tr>
        <td class="sched-name">${p.name}</td>
        ${Array.from({length:dim},(_,di)=>{const val=p.days?.[di]||'R';return`<td>${isAdmin?`<select class="sched-select" style="background:${SCHED_COLOR[val]||'var(--border)'}" onchange="updateSchedCell(${pi},${di},this.value,this)">${Object.keys(SCHED_LABEL).map(k=>`<option value="${k}"${k===val?' selected':''}>${k}</option>`).join('')}</select>`:`<div class="sched-cell" style="background:${SCHED_COLOR[val]||'var(--border)'}">${val}</div>`}</td>`}).join('')}
        ${isAdmin?`<td><button class="btn-ghost btn-sm" onclick="delSchedPerson(${pi})">🗑</button></td>`:''}</tr>`).join('')}</tbody>
    </table></div>`;
  // Store reference for updates
  window._schedPeople = people;
}

async function updateSchedCell(pi,di,val,selectEl){
  selectEl.style.background=SCHED_COLOR[val]||'var(--border)';
  if(window._schedPeople && window._schedPeople[pi]){
    window._schedPeople[pi].days[di]=val;
    // Debounced cloud save
    clearTimeout(window._schedSaveTimer);
    window._schedSaveTimer = setTimeout(async()=>{
      if(gasConnected){
        const schedOut = window._schedPeople.map(p=>{
          const obj={name:p.name};
          p.days.forEach((v,i)=>obj['d'+(i+1)]=v);
          return obj;
        });
        await gasWrite('schedule', schedOut);
      }
    },2000);
  }
}
function addSchedulePerson(){const name=prompt('輸入姓名');if(!name)return;if(window._schedPeople)window._schedPeople.push({name,days:Array.from({length:31},()=>'R')});renderSchedule();toast('已新增')}
function delSchedPerson(pi){if(window._schedPeople)window._schedPeople.splice(pi,1);renderSchedule();toast('已刪除')}
