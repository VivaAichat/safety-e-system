<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety E-System</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg:#ffffff;--surface:#f4f6f9;--card:#ffffff;--border:#e4e8ef;--borderHi:#cfd6e0;
  --amber:#b45309;--amberBg:rgba(217,119,6,0.10);--red:#dc2626;--redBg:rgba(220,38,38,0.08);
  --green:#059669;--greenBg:rgba(5,150,105,0.10);--blue:#2563eb;--blueBg:rgba(37,99,235,0.08);
  --purple:#7c3aed;--cyan:#0e8aa8;--text:#1b2433;--textSec:#5b6675;--textMut:#94a0b0;
  --font:'DM Sans','Noto Sans TC',sans-serif;--mono:'JetBrains Mono','Fira Code',monospace;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.08);--radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:var(--font);transition:all .2s}
button:hover:not(:disabled){filter:brightness(1.15)}
input:focus,select:focus,textarea:focus{border-color:var(--amber)!important;box-shadow:0 0 0 2px var(--amberBg);outline:none}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
[contenteditable]:empty:before{content:attr(data-placeholder);color:var(--textMut)}
a{color:var(--amber);text-decoration:none}

/* SIDEBAR */
.sidebar{width:230px;min-height:100vh;background:linear-gradient(180deg,#fbfcfd,#f4f6f9);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;z-index:100;flex-shrink:0;transition:width .3s;overflow:hidden}
.sidebar.collapsed{width:56px}
.sidebar-logo{padding:18px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10}
.sidebar.collapsed .sidebar-logo{padding:18px 10px}
.logo-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.logo-text{overflow:hidden;white-space:nowrap}
.sidebar.collapsed .logo-text,.sidebar.collapsed .nav-label,.sidebar.collapsed .admin-label{display:none}
.sidebar nav{flex:1;padding:10px 6px}
.nav-btn{display:flex;align-items:center;gap:10;width:100%;padding:9px 12px;background:transparent;border:none;border-radius:8px;color:var(--textSec);font-size:12px;font-weight:500;margin-bottom:1px}
.sidebar.collapsed .nav-btn{padding:9px 13px;justify-content:center}
.nav-btn.active{background:var(--amberBg);color:var(--amber);font-weight:700}
.sidebar-footer{padding:10px 6px;border-top:1px solid var(--border)}
.admin-btn{display:flex;align-items:center;gap:8;width:100%;padding:8px 12px;border:none;border-radius:8px;font-size:11px;font-weight:600}
.admin-btn.off{background:var(--border);color:var(--textSec)}
.admin-btn.on{background:var(--greenBg);color:var(--green)}
.toggle-btn{display:flex;align-items:center;justify-content:center;width:100%;padding:6px;margin-top:4px;background:transparent;border:none;color:var(--textMut);border-radius:6px}

/* MAIN */
.main{flex:1;min-width:0;padding:22px 26px;max-width:1440px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.header h1{font-size:20px;font-weight:800;letter-spacing:-.3px}
.header-sub{margin-top:3px;font-size:11px;color:var(--textMut)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px}
.page{animation:fi .3s ease}
.page[hidden]{display:none!important}

/* CARDS & STATS */
.grid{display:grid;gap:14px}.grid-4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid-3{grid-template-columns:repeat(3,1fr)}.grid-2{grid-template-columns:1fr 1fr}
.grid-6{grid-template-columns:repeat(6,1fr)}.grid-5{grid-template-columns:repeat(5,1fr)}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.card-head h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.card-body{padding:10px 16px;max-height:320px;overflow:auto}
.stat-card{display:flex;align-items:center;gap:14px;padding:16px 18px}
.stat-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.stat-label{font-size:10px;color:var(--textMut);font-weight:600;letter-spacing:.5px;margin-bottom:2px;text-transform:uppercase}
.stat-value{font-size:20px;font-weight:800;font-family:var(--mono)}
.stat-sub{font-size:10px;color:var(--textSec);margin-top:1px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;font-weight:600;border-radius:8px;font-size:13px;padding:8px 16px}
.btn-sm{font-size:12px;padding:5px 10px}
.btn-pri{background:linear-gradient(135deg,#f59e0b,#d97706);color:#000}
.btn-def{background:var(--border);color:var(--text)}
.btn-ghost{background:transparent;color:var(--textSec)}
.btn-danger{background:var(--redBg);color:var(--red)}
.btn-success{background:var(--greenBg);color:var(--green)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* INPUTS */
.inp,.sel,.txa{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:var(--font);outline:none}
.txa{min-height:70px;resize:vertical}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:5px;font-size:11px;font-weight:600;color:var(--textSec);letter-spacing:.5px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.45);backdrop-filter:blur(6px)}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:16px;border:1px solid var(--border);width:92%;max-width:540px;max-height:88vh;overflow:auto;box-shadow:var(--shadow);animation:fi .25s ease}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15px;font-weight:700}
.modal-body{padding:20px}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{padding:10px 12px;text-align:left;color:var(--textMut);font-weight:600;font-size:10px;white-space:nowrap;border-bottom:2px solid var(--border)}
.tbl td{padding:8px 12px;border-bottom:1px solid rgba(30,39,56,.3)}
.tbl tr:hover{background:rgba(17,24,39,.025)}

/* RICH EDITOR */
.rich-editor{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.rich-toolbar{display:flex;gap:2px;padding:4px 8px;background:var(--bg);border-bottom:1px solid var(--border)}
.rich-toolbar button{background:none;border:none;color:var(--textSec);padding:2px 6px;border-radius:4px;font-size:13px}
.rich-content{padding:9px 12px;min-height:60px;color:var(--text);font-size:13px;outline:none;background:var(--bg)}

/* FILTER BAR */
.filter-bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 20px;margin-bottom:20px}
.filter-bar label{font-size:11px;color:var(--textSec)}
.filter-bar input[type=date]{width:150px;padding:6px 10px;font-size:12px}
.pill-btn{padding:6px 16px;border-radius:20px;border:none;font-size:12px;font-weight:600;font-family:var(--font)}

/* SCHEDULE */
.sched-table{border-collapse:collapse;font-size:11px;min-width:800px}
.sched-table th{padding:5px 3px;text-align:center;font-size:9px;font-weight:600;color:var(--textMut)}
.sched-table td{padding:1px;text-align:center}
.sched-cell{width:24px;height:20px;border-radius:3px;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:8px;font-weight:700;color:white}
.sched-select{width:24px;height:20px;border:none;border-radius:3px;font-size:8px;font-weight:700;color:white;cursor:pointer;text-align:center;padding:0}
.sched-name{padding:5px 10px!important;font-weight:600;font-size:11px;text-align:left!important;position:sticky;left:0;background:var(--card);z-index:1}
.sched-name-head{min-width:75px;text-align:left!important;position:sticky;left:0;background:var(--card);z-index:2}

/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;z-index:99999;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:var(--shadow);animation:fi .25s ease;display:none}
.toast.show{display:block}
.toast.success{background:#e7f6ef;color:#0f7a55;border:1px solid rgba(5,150,105,.3)}
.toast.error{background:#fdeaea;color:#b42318;border:1px solid rgba(220,38,38,.3)}

/* GAUGE */
.gauge-wrap{text-align:center}
.gauge-label{font-size:12px;font-weight:700;margin-top:4px}

/* LOADING */
.loading-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:16px}
.loading-bar .fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--green));animation:loadAni 1.5s ease infinite;width:40%;border-radius:2px}
@keyframes loadAni{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

/* Responsive */
@media(max-width:1200px){.grid-6{grid-template-columns:repeat(3,1fr)}.grid-5{grid-template-columns:repeat(3,1fr)}.grid-3{grid-template-columns:1fr 1fr}}
@media(max-width:768px){.sidebar{position:fixed;z-index:200}.sidebar.collapsed{width:0;border:none}.main{padding:14px}.grid-2,.grid-3{grid-template-columns:1fr}.grid-6,.grid-5{grid-template-columns:repeat(2,1fr)}.header{flex-direction:column;align-items:flex-start;gap:8px}}
/* ===== KPI FORMS (white A4 document look + print isolation) ===== */
.kpi-cardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:22px}
.kpi-doc{background:#fff;color:#000;border-radius:6px;padding:16px 18px;font-family:"Segoe UI",Arial,Helvetica,sans-serif;font-size:13px;max-width:900px;margin:0 auto;box-shadow:0 0 0 1px var(--border)}
.kpi-doc h2{font-size:17px;text-align:center;margin:0 0 4px}
.kpi-doc .kpi-head{position:relative;min-height:46px;margin-bottom:6px}
.kpi-doc .kpi-head .kpi-logo{position:absolute;left:0;top:0;height:40px;width:auto}
.kpi-doc .kpi-head h2{font-size:17px;text-align:center;margin:0;padding-top:8px}
.kpi-doc .kpi-meta-line{text-align:center;font-size:10.5px;color:#333;margin-bottom:10px}
.kpi-tbl{border-collapse:collapse;width:100%;table-layout:fixed;margin-bottom:8px}
.kpi-tbl td,.kpi-tbl th{border:1px solid #000;padding:4px 6px;vertical-align:top;text-align:left;word-wrap:break-word;overflow-wrap:anywhere;font-size:12.5px}
.kpi-tbl .hdr{background:#d9d9d9;font-weight:700;text-align:center}
.kpi-tbl .sub{background:#efefef;font-weight:700}
.kpi-tbl .lbl{background:#fafafa;font-weight:600}
.kpi-tbl .ctr{text-align:center;vertical-align:middle}
.kpi-tbl input.f{width:100%;border:none;background:transparent;font:inherit;padding:1px;color:#000}
.kpi-tbl input.f:focus{outline:none;background:#eef6ff}
.kpi-tbl textarea.f{width:100%;border:none;background:transparent;font:inherit;resize:vertical;min-height:28px;padding:2px;color:#000}
.kpi-tbl textarea.f:focus{outline:none;background:#eef6ff}
.kpi-tbl input[type=checkbox]{width:15px;height:15px;cursor:pointer}
.kpi-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
@media print{
  body{background:#fff !important}
  .sidebar,.header,#adminBadge,.toast,.modal-overlay,.kpi-noprint,.loading-bar{display:none !important}
  .main{padding:0 !important;max-width:none !important}
  .page:not(#page-kpiforms){display:none !important}
  #page-kpiforms{display:block !important}
  .kpi-doc{box-shadow:none;max-width:none;padding:0;border-radius:0}
  .kpi-tbl td,.kpi-tbl th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 portrait;margin:6mm}
}
</style>
</head>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">🛡️</div>
    <div class="logo-text">
      <div style="font-size:13px;font-weight:800;color:var(--amber)">Safety</div>
      <div style="font-size:10px;color:var(--textMut)">E-System</div>
    </div>
  </div>
  <nav id="navContainer"></nav>
  <div class="sidebar-footer">
    <button class="admin-btn off" id="adminBtn" onclick="toggleAdmin()">🔒 <span class="admin-label">管理員登入</span></button>
    <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
  </div>
</aside>

<div class="main">
  <header class="header">
    <div>
      <h1 id="pageTitle">首頁 Home</h1>
      <p class="header-sub">NMDC Energy — Tongxiao Power Plant Phase II · <span id="todayDate"></span> <span id="sheetStatus" style="margin-left:8px"></span></p>
    </div>
    <div id="adminBadge" style="display:none"><span class="badge" style="color:var(--green);background:var(--greenBg)">ADMIN</span></div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn btn-def btn-sm" onclick="refreshData()" title="重新整理資料">🔄 重新整理</button>
    </div>
  </header>

  <div class="page" id="page-home"></div>
  <div class="page" id="page-dashboard" hidden></div>
  <div class="page" id="page-deficiency" hidden></div>
  <div class="page" id="page-tools" hidden></div>
  <div class="page" id="page-tracking" hidden></div>
  <div class="page" id="page-schedule" hidden></div>
  <div class="page" id="page-kpiforms" hidden></div>
</div>

<div class="modal-overlay" id="loginModal">
  <div class="modal" style="max-width:360px" onclick="event.stopPropagation()">
    <div class="modal-head"><h3>🔐 管理員登入</h3><button class="btn-ghost" onclick="closeModal('loginModal')">✕</button></div>
    <div class="modal-body">
      <p style="font-size:12px;color:var(--textSec);margin-bottom:14px">登入以啟用編輯功能</p>
      <div class="field"><label>帳號</label><input class="inp" id="loginUser" placeholder="帳號"></div>
      <div class="field"><label>密碼</label><input class="inp" id="loginPass" type="password" placeholder="密碼" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <p id="loginErr" style="color:var(--red);font-size:12px;margin-bottom:10px;display:none"></p>
      <button class="btn btn-pri" style="width:100%;justify-content:center" onclick="doLogin()">🔓 登入</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="genModal" onclick="closeModal('genModal')">
  <div class="modal" id="genModalBox" onclick="event.stopPropagation()">
    <div class="modal-head"><h3 id="genModalTitle"></h3><button class="btn-ghost" onclick="closeModal('genModal')">✕</button></div>
    <div class="modal-body" id="genModalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

let _jsonpCounter = 0;
function loadSheetJsonp(sheetName) {
  return new Promise((resolve, reject) => {
    const cbName = '_gviz_cb_' + (++_jsonpCounter) + '_' + Date.now();
    const timeout = setTimeout(() => {
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      reject(new Error('JSONP timeout for ' + sheetName));
    }, 15000);
    window[cbName] = function(resp) {
      clearTimeout(timeout);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      resolve(resp);
    };
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${cbName}&sheet=${encodeURIComponent(sheetName)}`;
    const script = document.createElement('script');
    script.src = url;
    script.onerror = () => {
      clearTimeout(timeout);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      reject(new Error('Script load error for ' + sheetName));
    };
    document.head.appendChild(script);
  });
}

// Try several candidate tab names; return first that loads OK (handles name/spacing guesses)
async function loadSheetJsonpMulti(candidates) {
  for (const name of candidates) {
    try {
      const resp = await loadSheetJsonp(name);
      if (resp && resp.status !== 'error' && resp.table && resp.table.cols && resp.table.cols.length) {
        resp.__tabName = name;
        return resp;
      }
    } catch(e) { /* try next */ }
  }
  return null;
}

function parseGvizDate(val) {
  if (val === null || val === undefined) return '';
  const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  if (typeof val === 'string' && val.startsWith('Date(')) {
    const parts = val.replace('Date(','').replace(')','').split(',').map(Number);
    const d = new Date(parts[0], parts[1], parts[2]||1);
    return fmt(d);
  }
  if (typeof val === 'number') {
    const utcMs = (val - 25569) * 86400000;
    const utc = new Date(utcMs);
    const d = new Date(utc.getUTCFullYear(), utc.getUTCMonth(), utc.getUTCDate());
    return fmt(d);
  }
  return String(val);
}

// Flexible date normalizer for free-text date cells (M/D/YYYY, YYYY/M/D, YYYY-MM-DD)
function normalizeFlexDate(val) {
  if (val === null || val === undefined || val === '') return '';
  if (typeof val === 'string' && val.startsWith('Date(')) return parseGvizDate(val);
  if (typeof val === 'number') return parseGvizDate(val);
  const s = String(val).trim();
  if (!s) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  let m = s.match(/^(\d{4})[\/.](\d{1,2})[\/.](\d{1,2})$/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/);
  if (m) return `${m[3]}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2})$/);
  if (m) return `20${m[3]}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
  return s;
}

function gvizToFormRows(gvizTable) {

    'observation type':'observation_type','觀察種類':'observation_type',
    'observed subcontractor':'observed_subcontractor','觀察到的承攬商':'observed_subcontractor',

    'hazard type':'hazard_type','危害種類':'hazard_type',
    'lsr violated':'LSR_violated','保命原則':'LSR_violated',
    'dercription':'description','description':'description','描述觀察':'description',
    'already been solved':'already_solved','已經解決':'already_solved',
    'operation':'operation','工作內容':'operation',
  };
  const colKeys = gvizTable.cols.map(c => {
    const lbl = (c.label || '').toLowerCase();
    for (const [kw, key] of Object.entries(LABEL_MAP)) { if (lbl.includes(kw.toLowerCase())) return key; }
    return c.id;
  });
  return gvizTable.rows.map(row => {
    const obj = {};

      let val = cell.v;

      obj[key] = val;

  });

function gvizToManpowerData(gvizTable) {
  const rows = gvizTable.rows;
  if (rows.length < 2) return [];
  const dateRow = rows[0];
  const dateMap = {};
  dateRow.c.forEach((cell, i) => { if (i === 0 || !cell || cell.v === null) return; dateMap[i] = parseGvizDate(cell.v); });
  const result = [];
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    const companyCell = row.c[0];
    const company = companyCell ? String(companyCell.v || '') : '';
    if (!company) continue;
    const dailyData = {};
    row.c.forEach((cell, i) => { if (i === 0 || !dateMap[i] || !cell) return; const cnt = parseFloat(cell.v) || 0; dailyData[dateMap[i]] = cnt; });
    result.push({ company, dailyData });
  }
  return result;
}

function getDefectCategory(t) {
  if (!t) return null;
  const s = (t+'').toLowerCase();
  if (s.includes('不安全條件') || s.includes('unsafe condition')) return 'Condition';
  if (s.includes('不安全行為') || s.includes('unsafe action'))    return 'Action';
  if (s.includes('優點') || s.includes('good practice'))          return 'Positive';
  return null;
}

      const [trkData, annData, lvData] = await Promise.all([ gasRead('tracking'), gasRead('announcements'), gasRead('leave') ]);
      function normalizeDate(v) {
        if (!v) return '';
        const s = String(v);
        if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
        if (s.includes('T')) { const d = new Date(s); if (!isNaN(d.getTime())) return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

      }

      if (annData.length > 0) state.ann = annData.map(r => ({ id: r.id || Date.now() + Math.random(), date: normalizeDate(r.date), content: r.content || '', priority: r.priority || 'medium' }));
      if (lvData.length > 0) state.leave = lvData.map(r => ({ id: r.id || Date.now() + Math.random(), date: normalizeDate(r.date), name: r.name || '', reason: r.reason || '' }));
      saveState();
      gasConnected = true;
    } catch(gasErr) { console.warn('GAS load failed, using local data:', gasErr); }

    statusEl.innerHTML = `<span style="color:var(--green)">● 雲端已連線</span> <span style="font-size:10px;color:var(--textMut)">(SOC:${socRows.length} TPC:${tpcRows.length} Gov:${govRows.length} NMDC罰款:${penRows.length} NMDC-NCR:${ncrRows.length} MP:${mpData.length})</span>${gasConnected ? ' <span style="color:var(--green);font-size:10px">● GAS 已連線</span>' : ''}`;
    toast('Google Sheet 資料載入完成 ✓');
    renderPage(currentPage);
  } catch(err) {
    console.error('Sheet load error:', err);
    sheetLoadError = true;
    statusEl.innerHTML = '<span style="color:var(--red)">● 連線失敗</span> <span style="font-size:10px;color:var(--textMut)">(使用本地資料)</span>';
  }
}

function processSheetData(socRows, tpcRows, mpData, govRows, penRows, ncrRows) {
  govRows = govRows || []; penRows = penRows || []; ncrRows = ncrRows || [];
  const g = gsheetData;
  g.allData = []; g.manpowerData = []; g.tbmByDate = {}; g.workingDaysByDate = {}; g.totalPeopleByDate = {}; g.totalHoursByDate = {}; g.incidentData = {}; g.socSubcontractors = new Set();
  const INCIDENT_KEYS = ['Recordable incidents','LTI cases','Lost days','Near Miss','Fatalities','Medical treatment','Medical Treatment','MTC','醫療處理'];

  function processFormRow(row, idx, source) {
    const sub = row.observed_subcontractor || '';
    if (sub) g.socSubcontractors.add(sub);
    const obsType = row.observation_type || '';
    const dc = getDefectCategory(obsType);
    const hazType = row.hazard_type || '';
    const desc = row.description || '';
    const loc = row.location || '';
    const filledDate = row.filled_date || '';
    const solved = row.already_solved === true || String(row.already_solved).toLowerCase() === 'true';
    const lsrRaw = String(row.LSR_violated || '').toLowerCase();
    const lsrViolated = lsrRaw === 'true' || lsrRaw.includes('是') || lsrRaw.includes('yes');
    g.allData.push({ id: source + '-' + idx, date: filledDate, type: dc === 'Positive' ? '優點' : '缺點', defectCategory: dc, subcontractor: sub, category: hazType, location: loc, description: desc, solved: solved, lsr: lsrViolated, source: source, isPTWViolation: hazType.includes('工作許可') || (desc||'').toLowerCase().includes('ptw') || (desc||'').includes('工作許可') });
  }
  socRows.forEach((row, idx) => processFormRow(row, idx, 'SOC'));

  function matchSub(contractor) {
    let matched = contractor;
    g.socSubcontractors.forEach(s => {
      if ((contractor.includes('兆濰') && s.includes('兆濰')) || (contractor.includes('茂富') && s.includes('茂富')) ||
          (contractor.includes('NMDC') && s.includes('NMDC')) || (contractor.includes('安達希') && s.includes('NMDC')) ||
          (contractor.includes('環海') && s.includes('環海')) || (contractor.includes('EGS') && s.includes('EGS')) ||
          (contractor.includes('海義') && s.includes('海義')) || (contractor.includes('HiE') && s.includes('HiE')) ||
          (contractor.includes('高虎') && s.includes('高虎')) || (contractor.includes('GAC') && s.includes('GAC')) ||
          (contractor.includes('美綺') && s.includes('美綺')) || (contractor.includes('天力') && s.includes('天力'))) matched = s;
    });
    return matched;
  }

  tpcRows.forEach((row, idx) => {
    let contractor = row.contractor || '';
    let matchedSub = matchSub(contractor);
    let penaltyAmount = 0;
    if (row.penalty_amount) penaltyAmount = parseFloat(String(row.penalty_amount).replace(/[^\d.]/g,'')) || 0;
    const issueCat = row.issue_category || '';
    const inspType = row.inspection_type || '';
    let type = '缺點', dc = 'Condition';
    if (inspType.includes('罰單') || issueCat.includes('罰單')) type = '罰單';
    else if (issueCat.includes('優點') || issueCat.includes('Good practice')) { type = '優點'; dc = 'Positive'; }
    if (issueCat.includes('不安全行為') || issueCat.includes('Unsafe action')) dc = 'Action';
    if (issueCat.includes('不安全條件') || issueCat.includes('Unsafe condition')) dc = 'Condition';
    const defectType = row.defect_type || row.other_category || '';
    const desc = row.description || '';
    const dtStr = defectType.toLowerCase();
    const isClosed = row.is_closed === '是' || row.is_closed === true || String(row.is_closed).includes('是');
    g.allData.push({ id: 'TPC-'+idx, date: row.issue_date || '', type: type, defectCategory: dc, subcontractor: matchedSub || contractor, category: defectType, location: row.area || '', description: desc, solved: isClosed, lsr: false, penaltyAmount: penaltyAmount, ncrNo: row.ncr_no || '', dueDate: row.due_date || '', source: 'TPC NCR', isPTWViolation: dtStr.includes('工作許可') || dtStr.includes('ptw') || dtStr.includes('permit') });
  });

  govRows.forEach((row, idx) => {
    let contractor = row.contractor || '';
    let matchedSub = matchSub(contractor);
    let penaltyAmount = 0;
    if (row.penalty_amount) penaltyAmount = parseFloat(String(row.penalty_amount).replace(/[^\d.]/g,'')) || 0;
    const issueCat = row.issue_category || '';
    let type = '缺點', dc = 'Condition';
    if (issueCat.includes('罰單')) type = '罰單';
    else if (issueCat.includes('優點')) { type = '優點'; dc = 'Positive'; }
    if (issueCat.includes('不安全行為')) dc = 'Action';
    if (issueCat.includes('不安全條件')) dc = 'Condition';
    const defectType = row.defect_type || '';
    const desc = row.description || '';
    const isClosed = row.is_closed === '是' || row.is_closed === true || String(row.is_closed).includes('是');
    g.allData.push({ id: 'GOV-'+idx, date: row.issue_date || '', type: type, defectCategory: dc, subcontractor: matchedSub || contractor, category: defectType, location: row.area || '', description: desc, solved: isClosed, lsr: false, penaltyAmount: penaltyAmount, docNo: row.doc_no || '', regulation: row.regulation || '', issuer: row.issuer || '', dueDate: row.due_date || '', source: 'Gov', isPTWViolation: false });
  });

  // NMDC NCR — kept SEPARATE; no 危害種類, so excluded from hazard analysis
  ncrRows.forEach((row, idx) => {
    const closeDate = row.close_date || '';
    g.allData.push({ id: 'NMDCNCR-'+idx, date: row.issue_date || row.defect_date || '', type: '缺點', defectCategory: 'NMDC_NCR', subcontractor: mapNmdcSubcon(row.subcon), category: row.hazard_type || '', location: row.location || '', description: row.description || '', solved: !!closeDate, lsr: false, ncrNo: row.ncr_no || '', defectDate: row.defect_date || '', dueDate: row.due_date || '', preparer: row.preparer || '', closeDate: closeDate, closeRecipient: row.close_recipient || '', source: 'NMDC NCR', isPTWViolation: false });
  });

  // NMDC Penalty — kept SEPARATE
  penRows.forEach((row, idx) => {
    let amt = 0;
    if (row.amount) amt = parseFloat(String(row.amount).replace(/[^\d.]/g,'')) || 0;
    const revokedRaw = String(row.revoked || '').trim().toLowerCase();
    const revoked = revokedRaw === 'v' || revokedRaw === 'true' || revokedRaw.includes('是') || revokedRaw.includes('撤');
    g.allData.push({ id: 'NMDCPEN-'+idx, date: row.issue_date || '', type: '罰單', defectCategory: 'NMDC_Penalty', subcontractor: mapNmdcSubcon(row.subcon), category: '', location: '', description: row.violation || '', solved: false, lsr: false, penaltyAmount: amt, penaltyNo: row.penalty_no || '', reporter: row.reporter || '', clauses: row.clauses || '', revoked: revoked, source: 'NMDC Penalty', isPTWViolation: false });
  });

  mpData.forEach(item => {
    const cname = item.company;
    if (!cname) return;
    const isTBM = cname === 'TBM 次數';
    const isTotal = cname === 'TOTAL';
    const isTotalHours = cname === 'TOTAL HOURS';
    const isIncident = INCIDENT_KEYS.includes(cname);
    Object.entries(item.dailyData).forEach(([dateStr, cnt]) => {
      if (isTBM) g.tbmByDate[dateStr] = (g.tbmByDate[dateStr]||0) + cnt;
      else if (isTotalHours) g.totalHoursByDate[dateStr] = cnt;
      else if (isIncident) { if (!g.incidentData[cname]) g.incidentData[cname] = {}; g.incidentData[cname][dateStr] = cnt; }
      else if (isTotal) g.totalPeopleByDate[dateStr] = cnt;
      else { if (cnt > 0) { g.manpowerData.push({ company: cname, date: dateStr, count: cnt }); if (!g.workingDaysByDate[dateStr]) g.workingDaysByDate[dateStr] = 0; g.workingDaysByDate[dateStr] += cnt; } }
    });
  });
}

function calcKPI(startDate, endDate, source, subFilter, locFilter, dcFilter) {
  if (!sheetLoaded) return getFallbackKPI();
  const g = gsheetData;
  // source can be a string ('All' | one source) or an array of sources (multi-select)
  const srcList = Array.isArray(source) ? source.slice() : (source === 'All' ? SAFETY_SOURCES.slice() : [source]);
  const baseSources = srcList.filter(s => SAFETY_SOURCES.includes(s)); // 缺失統計/結案率僅限 SOC/TPC/Gov
  const hazardSources = srcList.slice();                                // 危害種類可含 NMDC NCR

  // base restricted to SAFETY_SOURCES so NMDC Penalty/NCR never mix in
  let base = g.allData.filter(item =>
    item.date >= startDate && item.date <= endDate &&
    baseSources.includes(item.source) &&
    (subFilter === 'All' || item.subcontractor === subFilter) &&
    (locFilter === 'All' || item.location === locFilter)
  );

  const allDefects = base.filter(d => d.type === '缺點' || d.type === '罰單');
  let filtered = dcFilter && dcFilter !== 'All' ? base.filter(i => i.type === '優點' || i.defectCategory === dcFilter) : base;

  const defects   = filtered.filter(d => d.type === '缺點' || d.type === '罰單');
  const positives = filtered.filter(d => d.type === '優點');
  const closed    = defects.filter(d => d.solved);
  const socDef    = filtered.filter(d => d.source === 'SOC' && (d.type === '缺點' || d.type === '罰單'));
  const tpcDef    = filtered.filter(d => d.source === 'TPC NCR' && (d.type === '缺點' || d.type === '罰單'));
  const govDef    = filtered.filter(d => d.source === 'Gov' && (d.type === '缺點' || d.type === '罰單'));
  const tpcPen    = filtered.filter(d => d.source === 'TPC NCR' && d.type === '罰單');
  const govPen    = filtered.filter(d => d.source === 'Gov' && (d.type === '罰單' || d.penaltyAmount > 0));
  const lsrViol   = defects.filter(d => d.lsr);

  let totalPenalty = 0; tpcPen.forEach(i => totalPenalty += parseFloat(i.penaltyAmount) || 0);
  let govPenalty = 0;   govPen.forEach(i => govPenalty += parseFloat(i.penaltyAmount) || 0);
  const closureRate = defects.length > 0 ? (closed.length / defects.length) * 100 : 0;
  const socClosure = socDef.length > 0 ? (socDef.filter(d=>d.solved).length / socDef.length) * 100 : 0;
  const tpcClosure = tpcDef.length > 0 ? (tpcDef.filter(d=>d.solved).length / tpcDef.length) * 100 : 0;

  const ptwViolations = allDefects.filter(d => d.isPTWViolation).length;
  const ptwRate = allDefects.length > 0 ? Math.max(0, (1 - ptwViolations / allDefects.length) * 100) : 100;

  const workDays = Object.keys(g.workingDaysByDate).filter(d => d >= startDate && d <= endDate);
  const tbmDays = workDays.filter(d => (g.tbmByDate[d] || 0) >= 1);
  const tbmRate = workDays.length > 0 ? (tbmDays.length / workDays.length) * 100 : 0;

  let totalPeople = 0;
  Object.entries(g.totalPeopleByDate).forEach(([date, val]) => { if (date >= startDate && date <= endDate) totalPeople += val; });
  const totalHours = totalPeople * 8;
  function sumIncident(key) { if (!g.incidentData[key]) return 0; return Object.entries(g.incidentData[key]).filter(([d]) => d >= startDate && d <= endDate).reduce((s, [, v]) => s + v, 0); }
  const rec = sumIncident('Recordable incidents'), lti = sumIncident('LTI cases'), lost = sumIncident('Lost days'), nm = sumIncident('Near Miss'), fat = sumIncident('Fatalities');
  const mtc = sumIncident('Medical treatment') + sumIncident('Medical Treatment') + sumIncident('MTC') + sumIncident('醫療處理');
  const calcRate = (n, mul) => totalHours > 0 ? (n * mul / totalHours) : 0;
  const trir = calcRate(rec, 200000), ltir = calcRate(lti, 200000), severity = calcRate(lost, 200000), nmRate = calcRate(nm, 200000), far = calcRate(fat, 100000000), mtcRate = calcRate(mtc, 200000);

  // 危害種類統計 — 依所選來源（可含 NMDC NCR）
  const hazardBase = g.allData.filter(item =>
    item.date >= startDate && item.date <= endDate &&
    hazardSources.includes(item.source) &&
    (subFilter === 'All' || item.subcontractor === subFilter) &&
    (locFilter === 'All' || item.location === locFilter) &&
    (item.type === '缺點' || item.type === '罰單') && item.category
  );
  const catStats = {};
  hazardBase.forEach(item => { if (!catStats[item.category]) catStats[item.category] = { total:0, condition:0, action:0 }; catStats[item.category].total++; if (item.defectCategory === 'Condition') catStats[item.category].condition++; else if (item.defectCategory === 'Action') catStats[item.category].action++; });
  const socByCategory = Object.entries(catStats).map(([name, v]) => ({name, value: v.total, condition: v.condition, action: v.action})).sort((a,b) => b.value - a.value);

  const monthlyStats = {};
  base.forEach(item => { if (item.date && (item.type === '缺點' || item.type === '罰單')) { const m = item.date.substring(0,7); if (!monthlyStats[m]) monthlyStats[m] = { soc:0, ncr:0 }; if (item.source === 'SOC') monthlyStats[m].soc++; else monthlyStats[m].ncr++; } });
  const monthly = Object.entries(monthlyStats).sort((a,b)=>a[0].localeCompare(b[0])).map(([m, v]) => ({m, soc: v.soc, ncr: v.ncr}));

  // 每個危害種類的每月走勢（含 NMDC NCR）
  const hzCatMonth = {}; const hzMonthSet = {};
  hazardBase.forEach(item=>{ if(!item.date||!item.category) return; const mm=item.date.substring(0,7); hzMonthSet[mm]=true; if(!hzCatMonth[item.category]) hzCatMonth[item.category]={}; hzCatMonth[item.category][mm]=(hzCatMonth[item.category][mm]||0)+1; });
  const hzMonths = Object.keys(hzMonthSet).sort();
  const hazardTrend = {
    months: hzMonths,
    total: hzMonths.map(mm => socByCategory.reduce((s,c)=> s + ((hzCatMonth[c.name]&&hzCatMonth[c.name][mm])||0), 0)),
    cats: socByCategory.map(c => ({ name:c.name, data: hzMonths.map(mm => (hzCatMonth[c.name]&&hzCatMonth[c.name][mm])||0) }))
  };

  const subStats = {};
  filtered.forEach(item => { if (item.subcontractor && (item.type === '缺點' || item.type === '罰單')) { if (!subStats[item.subcontractor]) subStats[item.subcontractor] = { name:item.subcontractor, soc:0, ncr:0, cond:0, act:0, closed:0, total:0 }; subStats[item.subcontractor].total++; if (item.defectCategory === 'Condition') subStats[item.subcontractor].cond++; else if (item.defectCategory === 'Action') subStats[item.subcontractor].act++; if (item.solved) subStats[item.subcontractor].closed++; if (item.source === 'SOC') subStats[item.subcontractor].soc++; else subStats[item.subcontractor].ncr++; } });
  const contractorRank = Object.values(subStats).filter(i=>i.total>0).map(c => ({...c, score: c.total > 0 ? Math.round((c.closed/c.total)*100) : 0})).sort((a,b) => b.score - a.score);

  const posStats = {};
  filtered.forEach(item => { if (item.subcontractor && item.type === '優點') { if (!posStats[item.subcontractor]) posStats[item.subcontractor] = { name:item.subcontractor, count:0, soc:0, tpc:0 }; posStats[item.subcontractor].count++; if (item.source === 'SOC') posStats[item.subcontractor].soc++; else posStats[item.subcontractor].tpc++; } });
  const positiveRank = Object.values(posStats).sort((a,b) => b.count - a.count);

  const mpFiltered = g.manpowerData.filter(i => i.date >= startDate && i.date <= endDate);
  const mpByCompany = {};
  mpFiltered.forEach(item => { if (!mpByCompany[item.company]) mpByCompany[item.company] = {name:item.company, total:0, max:0, days:new Set()}; mpByCompany[item.company].total += item.count; mpByCompany[item.company].max = Math.max(mpByCompany[item.company].max, item.count); mpByCompany[item.company].days.add(item.date); });
  const manpower = Object.values(mpByCompany).map(c => ({ name: c.name, avg: c.days.size > 0 ? Math.round(c.total / c.days.size) : 0, max: c.max, hours: c.total * 8 })).sort((a,b) => b.hours - a.hours);

  const inScope = d => baseSources.includes(d.source) && (subFilter === 'All' || d.subcontractor === subFilter) && (locFilter === 'All' || d.location === locFilter);
  const allCondDef = g.allData.filter(d => (d.type === '缺點' || d.type === '罰單') && d.defectCategory === 'Condition' && inScope(d));
  const allActDef  = g.allData.filter(d => (d.type === '缺點' || d.type === '罰單') && d.defectCategory === 'Action' && inScope(d));
  const openCond = allCondDef.filter(d => !d.solved).length, openAct = allActDef.filter(d => !d.solved).length;
  const closedCond = allCondDef.filter(d => d.solved).length, closedAct = allActDef.filter(d => d.solved).length;

  // NMDC computations — SEPARATE; respects date+sub+loc, ignores the source dropdown
  const nmdcNcrBase = g.allData.filter(d => d.source === 'NMDC NCR' && d.date >= startDate && d.date <= endDate && (subFilter === 'All' || d.subcontractor === subFilter) && (locFilter === 'All' || d.location === locFilter));
  const nmdcPenBase = g.allData.filter(d => d.source === 'NMDC Penalty' && d.date >= startDate && d.date <= endDate && (subFilter === 'All' || d.subcontractor === subFilter));
  const nmdcNcrTotal = nmdcNcrBase.length;
  const nmdcNcrClosed = nmdcNcrBase.filter(d => d.solved).length;
  const nmdcNcrOpen = nmdcNcrTotal - nmdcNcrClosed;
  const nmdcNcrClosure = nmdcNcrTotal > 0 ? (nmdcNcrClosed / nmdcNcrTotal) * 100 : 0;
  const nmdcPenTotal = nmdcPenBase.length;
  const nmdcPenRevoked = nmdcPenBase.filter(d => d.revoked).length;
  let nmdcPenAmount = 0, nmdcPenAmountAll = 0;
  nmdcPenBase.forEach(d => { const a = parseFloat(d.penaltyAmount) || 0; nmdcPenAmountAll += a; if (!d.revoked) nmdcPenAmount += a; });
  const nmdcPenList = nmdcPenBase.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const nmdcNcrList = nmdcNcrBase.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  return {
    summary: {
      totalSOC: socDef.length, totalNCR: tpcDef.length, totalGov: govDef.length,
      totalDefects: defects.length, positives: positives.length, closureRate: closureRate,
      socClosure: socClosure, tpcClosure: tpcClosure,
      manpower: totalPeople, safeHours: totalHours,
      trir, ltir, far, nearMissRate: nmRate, severityRate: severity, mtcRate,
      penaltyAmount: totalPenalty, govPenalty: govPenalty,
      conditionOpen: openCond, conditionClosed: closedCond, actionOpen: openAct, actionClosed: closedAct,
      lsrViolations: lsrViol.length, rec, lti, lost, nm, fat, mtc, totalPeople, totalHours,
      nmdcNcrTotal, nmdcNcrClosed, nmdcNcrOpen, nmdcNcrClosure,
      nmdcPenTotal, nmdcPenRevoked, nmdcPenAmount, nmdcPenAmountAll
    },
    ncrClosure: closureRate, ptwCompliance: ptwRate, tbmRate: tbmRate,
    socByCategory, monthly, hazardTrend, contractorRank, positiveRank, manpower,
    nmdcPenList, nmdcNcrList,
    monthlyManpower: calcMonthlyManpowerByLocation(startDate, endDate)
  };
}

function calcMonthlyManpowerByLocation(startDate, endDate) {
  const g = gsheetData;
  const monthData = {};
  g.manpowerData.forEach(item => {
    if (item.date < startDate || item.date > endDate) return;
    const m = item.date.substring(0, 7);
    if (!monthData[m]) monthData[m] = { taichung: 0, tongxiao: 0, unassigned: 0 };
    const cn = (item.company || '').toLowerCase();
    if (cn.includes('台中') || cn.includes('taichung')) monthData[m].taichung += item.count;
    else if (cn.includes('通霄') || cn.includes('tongxiao') || cn.includes('tunghsiao')) monthData[m].tongxiao += item.count;
    else monthData[m].unassigned += item.count;
  });
  return Object.entries(monthData).sort((a,b)=>a[0].localeCompare(b[0])).map(([m, v]) => { const halfUp = Math.ceil(v.unassigned / 2); const halfDown = Math.floor(v.unassigned / 2); return { month: m, taichung: v.taichung + halfUp, tongxiao: v.tongxiao + halfDown }; });
}

function getFallbackKPI() {
  return {
    summary:{totalSOC:0,totalNCR:0,totalGov:0,totalDefects:0,positives:0,closureRate:0,socClosure:0,tpcClosure:0,manpower:0,safeHours:0,trir:0,ltir:0,far:0,nearMissRate:0,severityRate:0,mtcRate:0,penaltyAmount:0,govPenalty:0,conditionOpen:0,conditionClosed:0,actionOpen:0,actionClosed:0,lsrViolations:0,rec:0,lti:0,lost:0,nm:0,fat:0,mtc:0,totalPeople:0,totalHours:0,nmdcNcrTotal:0,nmdcNcrClosed:0,nmdcNcrOpen:0,nmdcNcrClosure:0,nmdcPenTotal:0,nmdcPenRevoked:0,nmdcPenAmount:0,nmdcPenAmountAll:0},
    ncrClosure:0,ptwCompliance:0,tbmRate:0,socByCategory:[],monthly:[],hazardTrend:{months:[],total:[],cats:[]},contractorRank:[],positiveRank:[],manpower:[],monthlyManpower:[],nmdcPenList:[],nmdcNcrList:[]
  };
}

function getDateRange() {
  if (sheetLoaded) {
    const allDates = [...gsheetData.allData.map(d=>d.date), ...Object.keys(gsheetData.totalPeopleByDate)].filter(d => d && d.length >= 10).sort();
    if (allDates.length > 0) return { start: allDates[0], end: allDates[allDates.length-1] };
  }
  return { start: '2025-04-01', end: new Date().toISOString().slice(0,10) };
}

function autoSeverity(desc,cat){
  const s=(desc+" "+cat).toLowerCase();
  if(SEV_KW.critical.some(k=>s.includes(k)))return"critical";
  if(SEV_KW.major.some(k=>s.includes(k)))return"major";
  if(SEV_KW.minor.some(k=>s.includes(k)))return"minor";
  return"major";
}

function statCard(icon,label,value,sub,color){
  return `<div class="card stat-card"><div class="stat-icon" style="background:${color}15;color:${color}">${icon}</div><div><div class="stat-label">${label}</div><div class="stat-value">${value}</div>${sub?`<div class="stat-sub">${sub}</div>`:''}</div></div>`;
}
function gaugeCard(label,value,max,color){
  const pct=Math.min(value/max,1);const r=40;const c=2*Math.PI*r;const d=pct*c*.75;
  return `<div class="card" style="padding:14px;text-align:center"><svg width="100" height="70" viewBox="0 0 100 70">
    <circle cx="50" cy="55" r="${r}" fill="none" stroke="var(--border)" stroke-width="7" stroke-dasharray="${c*.75} ${c*.25}" stroke-linecap="round" transform="rotate(135 50 55)"/>
    <circle cx="50" cy="55" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-dasharray="${d} ${c}" stroke-linecap="round" transform="rotate(135 50 55)"/>
    <text x="50" y="48" text-anchor="middle" fill="var(--text)" style="font-size:16px;font-weight:700;font-family:var(--mono)">${max>10?value.toFixed(1):value.toFixed(2)}</text>
    <text x="50" y="62" text-anchor="middle" fill="var(--textMut)" style="font-size:8px">${max>10?'%':''}</text>
  </svg><div class="gauge-label">${label}</div></div>`;
}

function downloadChartPng(canvasId, filename){
  const src=document.getElementById(canvasId);
  if(!src){ toast('找不到圖表','error'); return; }
  const tmp=document.createElement('canvas'); tmp.width=src.width; tmp.height=src.height;
  const ctx=tmp.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,tmp.width,tmp.height); ctx.drawImage(src,0,0);
  const a=document.createElement('a'); a.href=tmp.toDataURL('image/png'); a.download=(filename||'chart')+'_'+today()+'.png';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); toast('已下載圖表 ✓');
}

    // 危害種類每月走勢

function calcSling(){
  const load=+document.getElementById('sLoad').value,angle=+document.getElementById('sAngle').value,legs=+document.getElementById('sLegs').value;
  const f=1/Math.cos((angle/2)*Math.PI/180),tpl=(load/legs)*f;
  document.getElementById('slingResult').innerHTML=[{l:"放大係數",v:f.toFixed(3)+'×',c:'var(--amber)'},{l:"每條張力",v:tpl.toFixed(0)+'kg',c:'var(--blue)'},{l:"建議WLL",v:(tpl*2).toFixed(0)+'kg',c:'var(--green)'}].map(x=>`<div style="background:var(--bg);border-radius:8px;padding:14px;text-align:center"><div style="font-size:10px;color:var(--textMut);margin-bottom:4px">${x.l}</div><div style="font-size:20px;font-weight:800;color:${x.c};font-family:var(--mono)">${x.v}</div></div>`).join('');
  document.getElementById('slingWarn').innerHTML=angle>120?'<div style="margin-top:14px;padding:10px;background:var(--redBg);border-radius:8px;color:var(--red);font-size:11px;font-weight:600">⚠️ 夾角超過120°！</div>':'';
}

          ${isAdmin?`<button class="btn btn-sm ${t.status==='done'?'btn-success':'btn-def'}" onclick="cycleTrack(${t.id})">${t.status==='done'?'✅':t.status==='in-progress'?'🔄':'⏳'}</button><button class="btn btn-danger btn-sm" onclick="delTrack(${t.id})">🗑</button>`
          :badge(t.status==='done'?'✅ 完成':t.status==='in-progress'?'🔄 進行中':'⏳ 待辦',t.status==='done'?'var(--green)':t.status==='in-progress'?'var(--blue)':'var(--amber)')}
        </div>
      </div>`}).join('')}`;
}

function isHoliday(dateStr){return !!TW_HOLIDAYS[dateStr];}

function getEffectiveCell(p, di, dateStr) {
  const leave = (state.leave||[]).find(l => l.name === p.name && l.date === dateStr);
  if (leave) return '臨';
  let val = p.days?.[di] || '';
  if (!val) {
    const [yr, mo, da] = dateStr.split('-').map(Number);
    const wd = new Date(yr, mo-1, da).getDay();
    val = (wd === 0 || wd === 6 || isHoliday(dateStr)) ? '休' : 'R';
  }
  return val;
}

function uploadScheduleExcel(event){
  const file = event.target.files[0];
  if(!file)return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array',cellDates:true});
      const sheetName = wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      const aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      parseRotationPlan(aoa, sheetName);
      event.target.value = '';
    } catch(err){ console.error('Excel parse error:',err); toast('Excel 解析失敗：'+err.message,'error'); }
  };
  reader.readAsArrayBuffer(file);
}

function parseRotationPlan(aoa, sheetName){
  function fmtDate(d) { const y = d.getFullYear(); const m = String(d.getMonth()+1).padStart(2,'0'); const dd = String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
  let dateRowIdx = -1, dateStartCol = -1, firstDate = null;
  for(let i=0; i<Math.min(aoa.length,5); i++){
    const row = aoa[i]; if(!row) continue;
    for(let j=0; j<Math.min(row.length,5); j++){
      const cell = String(row[j]||'').trim();
      if(cell.includes('日期') || cell.toLowerCase().includes('date')){
        dateRowIdx = i;
        for(let k=j+1; k<row.length; k++){
          const v = row[k];
          if(v instanceof Date && !isNaN(v.getTime())){ dateStartCol = k; firstDate = v; break; }
          if(typeof v === 'number' && v > 40000){ const d = new Date((v - 25569) * 86400000); if(!isNaN(d.getTime())){ dateStartCol = k; firstDate = d; break; } }
        }
        break;
      }
    }
    if(dateRowIdx !== -1 && dateStartCol !== -1) break;
  }
  if(dateStartCol === -1){
    for(let i=0; i<Math.min(aoa.length,8); i++){
      const row = aoa[i] || [];
      for(let j=0; j<row.length; j++){
        const v = row[j];
        if(v instanceof Date && !isNaN(v.getTime()) && v.getFullYear() > 2020){ dateRowIdx = i; dateStartCol = j; firstDate = v; break; }
      }
      if(dateStartCol !== -1) break;
    }
  }
  if(dateStartCol === -1 || !firstDate){ toast('找不到日期欄位，請看 Console (F12)','error'); console.error('No date detected. Full first 4 rows:', aoa.slice(0,4)); return; }
  if(firstDate.getUTCHours() >= 12){ firstDate = new Date(firstDate.getTime() + 12*3600*1000); }
  firstDate = new Date(firstDate.getFullYear(), firstDate.getMonth(), firstDate.getDate());

  const dateColumns = [];
  const monthStr = firstDate.getFullYear() + '-' + String(firstDate.getMonth()+1).padStart(2,'0');
  const year = firstDate.getFullYear(), month = firstDate.getMonth(), startDay = firstDate.getDate();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  for(let i=0; i<daysInMonth; i++){ const d = new Date(year, month, startDay + i); if(d.getMonth() !== month) break; const col = dateStartCol + i; dateColumns.push({col, date:d, dateStr: fmtDate(d)}); }
  if(dateColumns.length < 5){ toast(`只解析到 ${dateColumns.length} 個日期`,'error'); return; }

  let nameCol = -1, areaCol = -1;
  for(let r=dateRowIdx+1; r<Math.min(aoa.length, dateRowIdx+12); r++){
    const row = aoa[r]; if(!row) continue;
    for(let c=0; c<dateStartCol; c++){
      const v = String(row[c]||'').trim();
      if(v.includes('\n') && /[A-Za-z]{2,}/.test(v)){ nameCol = c; if(c > 0) areaCol = c - 1; break; }
    }
    if(nameCol !== -1) break;
  }
  if(nameCol === -1){ nameCol = dateStartCol - 1; areaCol = dateStartCol - 2; }

  const newPeople = [];
  let currentArea = '';
  for(let r = dateRowIdx + 2; r < aoa.length; r++){
    const row = aoa[r];
    if(!row || row.length === 0) continue;
    if(areaCol >= 0){ const areaCell = String(row[areaCol]||'').trim(); if(areaCell && !areaCell.match(/^\d+$/) && areaCell.length > 1 && !areaCell.startsWith('=')){ currentArea = areaCell.replace(/\n/g,' ').trim(); } }
    const nameCell = String(row[nameCol]||'').trim();
    if(!nameCell) continue;
    if(nameCell.match(/^[\d.\s]+$/)) continue;
    if(nameCell.startsWith('=')) continue;
    if(nameCell.includes('SUM')) continue;
    if(nameCell === '加班累計' || nameCell.includes('Accumulated')) continue;
    if(nameCell.length < 2) continue;
    let displayName = nameCell;
    if(nameCell.includes('\n')){ const parts = nameCell.split('\n').map(p=>p.trim()).filter(Boolean); const eng = parts.find(p => /^[A-Za-z]+$/.test(p)); displayName = eng || parts[parts.length-1] || parts[0]; }
    if(!displayName || displayName.length < 2) continue;
    const days = [];
    dateColumns.forEach(({col, date}, dayIdx) => {
      const cell = row[col];
      let code = '';
      if(cell !== null && cell !== undefined){ code = String(cell).trim(); }
      if(code.startsWith('=')) code = '';
      if(code === 'H') code = '休';
      if(code === 'CCTV' || code === 'CCTV ') code = 'CCT';
      if(code === '環保') code = '環';
      if(!code){ const wd = date.getDay(); code = (wd === 0 || wd === 6) ? '休' : 'R'; }
      days[dayIdx] = code;
    });
    const otRow = aoa[r+1] || [];
    const overtime = [];
    dateColumns.forEach(({col}, dayIdx) => { const v = otRow[col]; let n = 0; if(v !== null && v !== undefined && v !== ''){ const parsed = parseFloat(v); if(!isNaN(parsed)) n = parsed; } overtime[dayIdx] = n; });
    newPeople.push({name: displayName, area: currentArea, days: days, overtime: overtime});
    if(!getTeam().includes(displayName)){ if(!state.customTeam) state.customTeam = [...TEAM]; if(!state.customTeam.includes(displayName)) state.customTeam.push(displayName); }
    r++;
  }
  if(newPeople.length === 0){ toast('未解析到任何人員，請看 Console (F12)','error'); return; }
  state.schedule.month = monthStr;
  state.schedule.people = newPeople;
  if(state.customTeam) TEAM = state.customTeam;
  saveState();
  renderSchedule();
  toast(`已匯入 ${newPeople.length} 位人員的 ${monthStr} 班表 ✓`);
}

// ── Read the open form into a submission record ──
function collectKpiSubmission(type){
  const F = KPI_FORMS[type];
  const host = document.getElementById('kpiPrintArea');
  if(!host) return null;
  const meta = {};
  F.meta.forEach(m=>{ const el=host.querySelector('#kpi_m_'+m.k); meta[m.k]= el?el.value.trim():''; });
  if(F.sign) F.sign.forEach(s=>{ const el=host.querySelector('#kpi_m_'+s.k); if(el) meta[s.k]=el.value.trim(); });
  const dateStr = normalizeFlexDate(meta.date) || today();
  const rec = { id: Date.now(), date: dateStr, code: F.code, meta };

  if(type==='bsa'){
    const checks = [];
    host.querySelectorAll('.kpi-chk').forEach(cb=>{ if(cb.checked){ checks.push({cat:+cb.dataset.cat, item:+cb.dataset.item}); } });
    rec.checks = checks;
    rec.persons = parseInt(meta.persons)||0;
  } else {
    const answers = [];
    const total = F.sections.reduce((n,s)=>n+s.items.length,0);
    for(let i=0;i<total;i++){
      const yes = host.querySelector(`.kpi-yn[data-q="${i}"][data-v="yes"]`);
      const no  = host.querySelector(`.kpi-yn[data-q="${i}"][data-v="no"]`);
      const rmk = host.querySelector('#kpi_rmk_'+i);
      answers.push({ q:i, yes: yes?yes.checked:false, no: no?no.checked:false, remark: rmk?rmk.value.trim():'' });
    }
    rec.answers = answers;
  }
  return rec;
}

function saveKpiSubmission(){
  const type = kpiOpen; if(!type) return;
  const rec = collectKpiSubmission(type);
  if(!rec) return;
  if(type==='bsa' && rec.checks.length===0){ if(!confirm('沒有勾選任何 Item，仍要儲存這份 BSA 嗎？')) return; }
  if(!state.kpiForms[type]) state.kpiForms[type]=[];
  state.kpiForms[type].unshift(rec);
  saveState();
  toast('已儲存並計入統計 ✓');
  kpiOpen = null;
  renderKpiForms();
  gasAppend('kpi_'+type, kpiFlat(type, rec));
}

function delKpiSubmission(type, id){
  if(!confirm('刪除這筆紀錄？統計會一併扣除。')) return;
  state.kpiForms[type] = (state.kpiForms[type]||[]).filter(r=>r.id!==id);
  saveState(); toast('已刪除'); renderKpiForms(); gasDeleteRow('kpi_'+type, id);
}

function _kpiPxPerMm(){ var p=document.createElement('div'); p.style.cssText='width:100mm;height:1mm;position:absolute;left:-9999px;top:0'; document.body.appendChild(p); var px=p.getBoundingClientRect().width/100; document.body.removeChild(p); return px; }
function prepKpiPrint(){
  var doc=document.getElementById('kpiPrintArea'); if(!doc) return;
  var pxmm=_kpiPxPerMm(), m=6, availH=(297-2*m)*pxmm, availWmm=210-2*m;
  doc.style.zoom=''; doc.style.width=availWmm+'mm';
  var rows=doc.querySelectorAll('.kpi-frow'); rows.forEach(function(r){ r.style.height=''; });
  var h=doc.scrollHeight;
  if(h>availH+1){
    // Fit onto ONE page while keeping full printed width: widen the document by 1/s then
    // zoom by s, so the printed width maps back to the full page and only height compresses
    // (text scales uniformly, no distortion, no left/right gaps).
    var s=availH/h;
    for(var i=0;i<5;i++){
      doc.style.width=(availWmm/s)+'mm';
      var hh=doc.scrollHeight; var ns=availH/hh;
      if(Math.abs(ns-s)<0.005){ s=ns; break; }
      s=ns;
    }
    s=Math.max(0.5, Math.min(s,1));
    doc.style.width=(availWmm/s)+'mm';
    doc.style.zoom=s;
  } else if(rows.length){
    var leftover=availH-h-6; if(leftover>0){ var add=leftover/rows.length; rows.forEach(function(r){ r.style.height=(r.offsetHeight+add)+'px'; }); }
  }
}
function rzKpiPrint(){ var doc=document.getElementById('kpiPrintArea'); if(!doc) return; doc.style.zoom=''; doc.style.width=''; doc.querySelectorAll('.kpi-frow').forEach(function(r){ r.style.height=''; }); }
window.addEventListener('beforeprint', prepKpiPrint);
window.addEventListener('afterprint', rzKpiPrint);

// ── GAS sync (flat rows: id,date,code,summary,dataJson) — best effort ──
function kpiSummaryText(type, rec){
  const m = rec.meta||{};
  if(type==='bsa') return [m.site,m.work].filter(Boolean).join(' / ');
  if(type==='ptw') return [m.area,m.pno].filter(Boolean).join(' / ');
  if(type==='hip') return [m.person,m.area].filter(Boolean).join(' / ');
  return [m.area,m.activity].filter(Boolean).join(' / ');
}
function kpiFlat(type, r){
  return { id:r.id, date:r.date, code:r.code, summary:kpiSummaryText(type,r),
    dataJson: JSON.stringify({meta:r.meta, checks:r.checks, answers:r.answers, persons:r.persons}) };
}
// Append a single record (multi-user safe: each submission is its own row; GAS serialises with a lock)
async function gasAppend(tab, row){
  try{
    const resp = await fetch(GAS_URL, {method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({action:'append', tab:tab, row:row})});
    const j = await resp.json(); return j.success;
  }catch(e){ console.warn('gasAppend failed', e); return false; }
}
async function gasDeleteRow(tab, id){
  try{
    const resp = await fetch(GAS_URL, {method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({action:'delete', tab:tab, id:id})});
    const j = await resp.json(); return j.success;
  }catch(e){ console.warn('gasDeleteRow failed', e); return false; }
}
async function loadKpiFromGas(){
  for(const type of KPI_ORDER){
    try{
      const rows = await gasRead('kpi_'+type);
      if(rows && rows.length>0){
        state.kpiForms[type] = rows.map(r=>{
          let d={}; try{ d=JSON.parse(r.dataJson||'{}'); }catch(e){}
          return { id:r.id||Date.now()+Math.random(), date:r.date||'', code:r.code||KPI_FORMS[type].code, meta:d.meta||{}, checks:d.checks, answers:d.answers, persons:d.persons };
        });
      }
    }catch(e){ /* tab may not exist; keep local */ }
  }
  saveState();
  if(currentPage==='kpiforms') renderKpiForms();
}

// ── Statistics ──
function isoWeek(dateStr){
  if(!dateStr) return '';
  const p=String(dateStr).substring(0,10).split('-'); if(p.length<3) return '';
  const d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); if(isNaN(d.getTime())) return '';
  const day=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-day+3);
  const ft=new Date(Date.UTC(d.getUTCFullYear(),0,4)); const fd=(ft.getUTCDay()+6)%7; ft.setUTCDate(ft.getUTCDate()-fd+3);
  const wk=1+Math.round((d-ft)/6048e5);
  return d.getUTCFullYear()+'-W'+String(wk).padStart(2,'0');
}
let kpiPeriod='month';
function kpiInPeriod(dateStr){
  if(kpiPeriod==='all') return true;
  if(!dateStr) return false;
  const now=today();
  return kpiPeriod==='week' ? isoWeek(dateStr)===isoWeek(now) : String(dateStr).substring(0,7)===now.substring(0,7);
}
function kpiPeriodLabel(){ return kpiPeriod==='week'?('本週 '+isoWeek(today())) : kpiPeriod==='month'?('本月 '+today().substring(0,7)) : '全部累計'; }
function kpiBsaTally(filterFn){
  const F=KPI_FORMS.bsa; let arr=state.kpiForms.bsa||[]; if(filterFn) arr=arr.filter(filterFn);
  const cats=F.categories.map(c=>({name:c.name,total:0,items:c.items.map(it=>({name:it,count:0}))}));
  let persons=0;
  arr.forEach(r=>{ persons+=(parseInt(r.persons)||0); (r.checks||[]).forEach(ch=>{ const c=cats[ch.cat]; if(c&&c.items[ch.item]){ c.items[ch.item].count++; c.total++; } }); });
  return {cats,persons,audits:arr.length};
}
function kpiHistory(mode,limit){
  const map={};
  KPI_ORDER.forEach(t=>(state.kpiForms[t]||[]).forEach(r=>{ const k=mode==='week'?isoWeek(r.date):(String(r.date||'').substring(0,7)); if(!k) return; if(!map[k]) map[k]={key:k,bsa:0,ptw:0,hip:0,risk:0}; map[k][t]=(map[k][t]||0)+1; }));
  return Object.values(map).sort((a,b)=>b.key.localeCompare(a.key)).slice(0,limit);
}

// ── Page render ──
function renderKpiForms(){
  const el = document.getElementById('page-kpiforms');

  if(kpiOpen){
    const F = KPI_FORMS[kpiOpen];
    el.innerHTML = `
      <div class="kpi-toolbar kpi-noprint">
        <button class="btn btn-ghost" onclick="closeKpiForm()">← 返回</button>
        <div style="font-weight:700;font-size:14px;flex:1">${esc(F.title)}</div>
        <button class="btn btn-def" onclick="printKpiForm()">🖨 列印紙本</button>
        <button class="btn btn-pri" onclick="saveKpiSubmission()">💾 儲存並計入統計</button>
      </div>
      <p style="font-size:11px;color:var(--textMut);margin:-6px 0 12px" class="kpi-noprint">填寫後可直接「列印紙本」（白底 A4），或「儲存並計入統計」。${kpiOpen==='bsa'?'BSA 會依勾選的 Category／Item 累計次數；':'本表單以份數統計；'}列印時會自動隱藏側邊欄與深色介面。</p>
      ${buildKpiFormHtml(kpiOpen)}
      <div class="kpi-toolbar kpi-noprint" style="margin-top:14px;justify-content:flex-end">
        <button class="btn btn-def" onclick="printKpiForm()">🖨 列印紙本</button>
        <button class="btn btn-pri" onclick="saveKpiSubmission()">💾 儲存並計入統計</button>
      </div>`;
    return;
  }

  const cards = KPI_ORDER.map(t=>{
    const F=KPI_FORMS[t], arr=state.kpiForms[t]||[];
    const pc=arr.filter(r=>kpiInPeriod(r.date)).length;
    return `<div class="card" style="padding:16px">
      <div style="font-size:13px;font-weight:700;margin-bottom:2px">${F.code}</div>
      <div style="font-size:11px;color:var(--textMut);margin-bottom:10px;min-height:30px">${esc(F.title)}</div>
      <div style="display:flex;gap:14px;margin-bottom:12px">
        <div><div style="font-size:9px;color:var(--textMut)">${kpiPeriod==='all'?'總份數':'本期份數'}</div><div style="font-size:22px;font-weight:800;font-family:var(--mono);color:var(--amber)">${pc}</div></div>
        <div><div style="font-size:9px;color:var(--textMut)">總計</div><div style="font-size:22px;font-weight:800;font-family:var(--mono);color:var(--textSec)">${arr.length}</div></div>
      </div>
      <button class="btn btn-pri btn-sm" style="width:100%;justify-content:center" onclick="openKpiForm('${t}')">📝 填寫 / 列印</button>
    </div>`;
  }).join('');

  const bt = kpiBsaTally(r=>kpiInPeriod(r.date));
  let bsaRows='';
  bt.cats.forEach(c=>{
    c.items.forEach((it,ii)=>{
      bsaRows += `<tr>`;
      if(ii===0) bsaRows += `<td rowspan="${c.items.length}" style="font-weight:700;color:var(--amber);vertical-align:middle">${esc(c.name)}<div style="font-size:10px;color:var(--textMut);font-weight:500">小計 ${c.total}</div></td>`;
      bsaRows += `<td>${esc(it.name)}</td><td style="text-align:right;font-family:var(--mono);font-weight:${it.count?'700':'400'};color:${it.count?'var(--text)':'var(--textMut)'}">${it.count||''}</td></tr>`;
    });
  });

  const countRows = ['ptw','hip','risk'].map(t=>{
    const F=KPI_FORMS[t], arr=state.kpiForms[t]||[];
    const pc=arr.filter(r=>kpiInPeriod(r.date)).length;
    return `<tr><td style="font-weight:600">${F.code} <span style="color:var(--textMut);font-weight:400">${esc(F.title)}</span></td>
      <td style="text-align:center;font-family:var(--mono);font-weight:700;color:var(--green)">${pc}</td>
      <td style="text-align:center;font-family:var(--mono)">${arr.length}</td></tr>`;
  }).join('');

  const histRows=(mode,limit)=>{
    const rows=kpiHistory(mode,limit);
    if(!rows.length) return '<tr><td colspan="5" style="text-align:center;padding:18px;color:var(--textMut)">尚無紀錄</td></tr>';
    return rows.map(r=>`<tr><td style="font-weight:600;white-space:nowrap">${r.key}</td>
      <td style="text-align:center;font-family:var(--mono);color:var(--amber);font-weight:700">${r.bsa||''}</td>
      <td style="text-align:center;font-family:var(--mono)">${r.ptw||''}</td>
      <td style="text-align:center;font-family:var(--mono)">${r.hip||''}</td>
      <td style="text-align:center;font-family:var(--mono)">${r.risk||''}</td></tr>`).join('');
  };

  let recent = [];
  KPI_ORDER.forEach(t=>(state.kpiForms[t]||[]).forEach(r=>recent.push({t,r})));
  recent.sort((a,b)=>(b.r.id||0)-(a.r.id||0));
  recent = recent.slice(0,12);
  const recentRows = recent.length? recent.map(x=>`
    <tr><td style="white-space:nowrap">${x.r.date||'-'}</td>
      <td>${KPI_FORMS[x.t].code}</td>
      <td>${x.t==='bsa'?('勾選 '+((x.r.checks||[]).length)+' 項'+(x.r.persons?(' · '+x.r.persons+'人'):'')):esc(kpiSummaryText(x.t,x.r))||'-'}</td>
      <td style="text-align:right">${isAdmin?`<button class="btn-ghost btn-sm" onclick="delKpiSubmission('${x.t}',${x.r.id})">🗑</button>`:''}</td></tr>`).join('')
    : '<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--textMut)">尚無紀錄</td></tr>';

  const tbtn=(v,l)=>`<button class="pill-btn" style="background:${kpiPeriod===v?'var(--amberBg)':'var(--card)'};color:${kpiPeriod===v?'var(--amber)':'var(--textSec)'};border:1px solid var(--border)" onclick="kpiPeriod='${v}';renderKpiForms()">${l}</button>`;

  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap">
      <p style="font-size:11px;color:var(--textMut);margin:0;flex:1;min-width:220px">NMDC KPI 表單：點「填寫 / 列印」開啟、可直接列印紙本或儲存計入統計。下方統計可切換期間；每月／每週份數歷史在最下方。</p>
      <button class="btn btn-def btn-sm" onclick="loadKpiFromGas();toast('已從雲端更新統計')">🔄 更新統計</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap">
      <span style="font-size:11px;color:var(--textSec);font-weight:600">統計期間</span>
      ${tbtn('week','本週')}${tbtn('month','本月')}${tbtn('all','全部')}
      <span style="font-size:11px;color:var(--textMut)">目前：${kpiPeriodLabel()}</span>
    </div>
    <div class="kpi-cardgrid">${cards}</div>

    <div class="card" style="margin-bottom:22px">
      <div class="card-head"><h3>📊 BSA 項目統計（${kpiPeriodLabel()}）</h3><span style="font-size:11px;color:var(--textMut)">份數 ${bt.audits} · 受稽核 ${bt.persons} 人次</span></div>
      <div style="overflow-x:auto;max-height:460px"><table class="tbl">
        <thead><tr><th style="width:24%">Category 類別</th><th>Item 項目</th><th style="text-align:right;width:90px">勾選次數</th></tr></thead>
        <tbody>${bsaRows}</tbody>
      </table></div>
    </div>

    <div class="grid grid-2" style="margin-bottom:22px">
      <div class="card">
        <div class="card-head"><h3>🧮 份數統計（PTW / HIP / RA）</h3><span style="font-size:11px;color:var(--textMut)">${kpiPeriodLabel()}</span></div>
        <div style="overflow-x:auto"><table class="tbl">
          <thead><tr><th>表單</th><th style="text-align:center">本期</th><th style="text-align:center">總計</th></tr></thead>
          <tbody>${countRows}</tbody>
        </table></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>🕑 最近紀錄</h3></div>
        <div style="overflow-x:auto;max-height:300px"><table class="tbl">
          <thead><tr><th>日期</th><th>表單</th><th>摘要</th><th></th></tr></thead>
          <tbody>${recentRows}</tbody>
        </table></div>
      </div>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <div class="card-head"><h3>📅 每月份數</h3><span style="font-size:11px;color:var(--textMut)">近 6 個月</span></div>
        <div style="overflow-x:auto;max-height:320px"><table class="tbl">
          <thead><tr><th>月份</th><th style="text-align:center">BSA</th><th style="text-align:center">PTW</th><th style="text-align:center">HIP</th><th style="text-align:center">RA</th></tr></thead>
          <tbody>${histRows('month',6)}</tbody>
        </table></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>🗓️ 每週份數</h3><span style="font-size:11px;color:var(--textMut)">近 8 週 (ISO 週)</span></div>
        <div style="overflow-x:auto;max-height:320px"><table class="tbl">
          <thead><tr><th>週次</th><th style="text-align:center">BSA</th><th style="text-align:center">PTW</th><th style="text-align:center">HIP</th><th style="text-align:center">RA</th></tr></thead>
          <tbody>${histRows('week',8)}</tbody>
        </table></div>
      </div>
    </div>`;
}

document.addEventListener('DOMContentLoaded',()=>{
  loadState();
  if(!state.kpiForms) state.kpiForms = {bsa:[], ptw:[], hip:[], risk:[]};
  ['bsa','ptw','hip','risk'].forEach(t=>{ if(!Array.isArray(state.kpiForms[t])) state.kpiForms[t]=[]; });
  loadKpiFromGas();
  document.getElementById('todayDate').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  buildNav();
  updateAdminUI();
  goPage('home');
  loadGoogleSheetData();
});
</script>
</body>
</html>
